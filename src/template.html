<title>Tabela Periódica das Notícias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Retrospectiva de notícias organizada como tabela periódica: química, espaço, games, tecnologia, mistérios, rock, Brasil e mundo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: dark mission-console HUD. Sticky HUD bar (XP/level) -> photo hero -> top-5 strip -> family select (periodic tiles over photos) -> sticky filter chips -> swipeable rows per family (grid when filtered) -> animated solar-system map -> bonus quiz -> upcoming missions -> footer. Full story opens in a sheet. Single dark theme by design. */
:root {
  color-scheme: dark;
  --bg: #060912;
  --panel: #0D1222;
  --panel-2: #141B30;
  --ink: #E9EDF7;
  --muted: #8C96AE;
  --line: rgba(150, 168, 215, .16);
  --sys: #7CF4FF;
  --ok: #4CE38A;
  --bad: #FF6464;
  --sun: #FFB547;
  --star: #E8ECF8;
  --c-quimica: #2EF2C8;
  --c-espaco: #9192FF;
  --c-games: #FF52BA;
  --c-tecnologia: #47AFFF;
  --c-misterios: #B9F23E;
  --c-rock: #FF6340;
  --c-brasil: #FFC83F;
  --c-mundo: #95C7FF;
  --k: 14px;
  --hud-h: 54px;
  --f-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; animation: none !important; } }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  background:
    radial-gradient(1100px 620px at 85% -8%, rgba(145, 146, 255, .20), transparent 62%),
    radial-gradient(900px 520px at -12% 28%, rgba(46, 242, 200, .09), transparent 60%),
    radial-gradient(800px 600px at 50% 110%, rgba(255, 82, 186, .08), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
img { max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sys); outline-offset: 3px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; }

[data-cat="quimica"] { --c: var(--c-quimica); }
[data-cat="espaco"] { --c: var(--c-espaco); }
[data-cat="games"] { --c: var(--c-games); }
[data-cat="tecnologia"] { --c: var(--c-tecnologia); }
[data-cat="misterios"] { --c: var(--c-misterios); }
[data-cat="rock"] { --c: var(--c-rock); }
[data-cat="brasil"] { --c: var(--c-brasil); }
[data-cat="mundo"] { --c: var(--c-mundo); }

.cut { clip-path: polygon(var(--k) 0, 100% 0, 100% calc(100% - var(--k)), calc(100% - var(--k)) 100%, 0 100%, 0 var(--k)); }
.hudlabel { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sec-title { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; font-family: var(--f-display); font-weight: 700; font-size: clamp(20px, 2.6vw, 26px); letter-spacing: .04em; text-transform: uppercase; }
.sec-title::before { content: ""; width: 10px; height: 10px; background: var(--c, var(--sys)); box-shadow: 0 0 12px var(--c, var(--sys)); transform: rotate(45deg); flex: none; }
.sec-title small { font-family: var(--f-mono); font-size: 12px; font-weight: 400; letter-spacing: .04em; color: var(--muted); text-transform: none; margin-left: auto; }

/* HUD bar */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--hud-h); background: rgba(6, 9, 18, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hud .wrap { height: 100%; display: flex; align-items: center; gap: 12px; }
.logo { display: grid; place-items: center; width: 34px; height: 34px; flex: none; font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--bg); background: var(--sys); --k: 7px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brand span { color: var(--muted); font-weight: 500; }
@media (max-width: 560px) { .brand span { display: none; } .brand { font-size: 13px; letter-spacing: .05em; } }
.xp { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; }
.lvl { font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--sys); white-space: nowrap; }
.lvl em { font-style: normal; color: var(--ink); }
@media (max-width: 420px) { .lvl em { display: none; } }
.xpbar { width: 84px; height: 8px; background: rgba(124, 244, 255, .12); --k: 3px; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--sys), var(--c-games)); box-shadow: 0 0 10px var(--sys); transition: width .5s ease; }
.xpnum { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 380px) { .xpnum { display: none; } }

/* Intro + hero */
.intro { padding-block: 22px 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.intro h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3.4vw, 34px); letter-spacing: .02em; line-height: 1.1; }
.intro p { margin: 0; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); margin-right: 6px; animation: pulse 1.8s ease-in-out infinite; vertical-align: 1px; }
@keyframes pulse { 50% { opacity: .35; } }

.hero { position: relative; display: block; overflow: hidden; aspect-ratio: 16 / 7.2; min-height: 380px; text-decoration: none; color: var(--ink); background: var(--panel); --k: 22px; cursor: pointer; }
@media (max-width: 720px) { .hero { aspect-ratio: 4 / 5; min-height: 0; } }
.hero .ph { position: absolute; inset: 0; }
.hero .ph img, .hero .ph svg { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1.2s ease; }
.hero:hover .ph img { transform: scale(1.04); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(6, 9, 18, .97) 8%, rgba(6, 9, 18, .62) 42%, rgba(6, 9, 18, .05) 75%), linear-gradient(to right, rgba(6, 9, 18, .55), transparent 60%); }
.hero-in { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: clamp(18px, 3.4vw, 40px); display: grid; gap: 12px; max-width: 860px; }
.hero h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 4.6vw, 54px); line-height: 1.04; letter-spacing: .005em; text-wrap: balance; text-shadow: 0 2px 24px rgba(0, 0, 0, .6); }
.hero p { margin: 0; color: #C9D0E2; font-size: clamp(15px, 1.6vw, 17px); max-width: 62ch; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hero .tags { justify-self: start; padding: 5px 10px; background: rgba(6, 9, 18, .72); --k: 6px; clip-path: polygon(var(--k) 0, 100% 0, 100% calc(100% - var(--k)), calc(100% - var(--k)) 100%, 0 100%, 0 var(--k)); }
.cta { justify-self: start; display: inline-flex; align-items: center; gap: 10px; padding: 11px 18px; background: var(--c); color: var(--bg); font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; --k: 9px; box-shadow: 0 0 24px color-mix(in srgb, var(--c) 60%, transparent); }
.frame { position: absolute; inset: 12px; z-index: 1; pointer-events: none;
  background:
    linear-gradient(var(--c), var(--c)) top right / 28px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) top right / 2px 28px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 28px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 2px 28px no-repeat; opacity: .9; }

.tags { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.tag-cat { color: var(--c); text-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent); }
.tag-date { color: var(--muted); }
.tag-new { padding: 2px 7px; background: var(--sys); color: var(--bg); --k: 4px; }
.tag-body { padding: 1px 7px; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); color: var(--ink); }

/* Pictures */
.ph { position: relative; overflow: hidden; background: color-mix(in srgb, var(--c) 12%, var(--panel)); }
.ph img, .ph svg { display: block; width: 100%; height: 100%; object-fit: cover; }
.art .bg { fill: color-mix(in srgb, var(--c) 13%, var(--panel)); }
.art .night { fill: #0B1030; }
.art .star { fill: var(--star); }
.art .ln { stroke: var(--c); fill: none; }
.art .fl { fill: var(--c); }
.art .sym { font-family: var(--f-display); font-weight: 700; fill: var(--c); }

/* Cards */
.card { position: relative; display: block; text-decoration: none; color: var(--ink); cursor: pointer; transition: transform .2s ease, filter .2s ease; min-width: 0; }
.card:hover { transform: translateY(-4px); filter: drop-shadow(0 0 14px color-mix(in srgb, var(--c) 45%, transparent)); }
.shape { position: relative; display: grid; height: 100%; background: var(--panel); }
.shape::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(var(--c), var(--c)) top right / 20px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) top right / 2px 20px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 20px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 2px 20px no-repeat; }
.card .ph { aspect-ratio: 16 / 10; }
.card .ph img { transition: transform .6s ease; }
.card:hover .ph img { transform: scale(1.05); }
.badges { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; z-index: 1; }
.badge { padding: 3px 8px; font-family: var(--f-display); font-weight: 700; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; --k: 5px; }
.badge.new { background: var(--sys); color: var(--bg); }
.badge.read { background: rgba(6, 9, 18, .8); color: var(--ok); border: 1px solid var(--ok); }
.sym-chip { position: absolute; right: 10px; top: 10px; z-index: 1; display: grid; place-items: center; width: 40px; height: 40px; font-family: var(--f-display); font-weight: 700; font-size: 17px; color: var(--c); background: rgba(6, 9, 18, .78); border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); --k: 8px; }
.card-in { display: grid; gap: 6px; align-content: start; padding: 12px 14px 16px; }
.card .ttl { margin: 0; font-family: var(--f-body); font-weight: 600; font-size: 16px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .tz { margin: 0; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.is-read .ph { opacity: .45; }
.card.is-read .ttl { color: var(--muted); }

/* Strip + rows */
.strip-sec { margin-top: 18px; }
.row-wrap { position: relative; }
.row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 290px); gap: 14px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; padding: 6px 2px 14px; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--c, var(--sys)) 50%, transparent) transparent; }
.row > * { scroll-snap-align: start; }
@media (max-width: 600px) { .row { grid-auto-columns: 78%; } }
.row-h { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.row-h .sec-title { margin: 0; }
.row-h .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.arrows { margin-left: auto; display: flex; gap: 6px; }
.arr { width: 38px; height: 34px; border: 0; background: var(--panel-2); color: var(--c, var(--sys)); cursor: pointer; --k: 7px; font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.arr:hover { background: color-mix(in srgb, var(--c, var(--sys)) 22%, var(--panel-2)); }
@media (max-width: 600px) { .arrows { display: none; } }
.more-card { display: grid; place-items: center; align-content: center; gap: 10px; min-height: 240px; background: color-mix(in srgb, var(--c) 10%, var(--panel)); color: var(--c); text-decoration: none; font-family: var(--f-display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; text-align: center; cursor: pointer; border: 0; padding: 20px; }
.more-card b { font-size: 46px; line-height: 1; }
.fam-row { margin-top: 34px; }
.row-desc { margin: 0 0 6px; font-size: 14px; color: var(--muted); max-width: 72ch; }
.row-desc em { font-style: normal; color: var(--c); }

/* Family select */
.fam-sec { margin-top: 40px; }
.fam-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .fam-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.fam { position: relative; display: grid; grid-template-rows: auto 1fr auto; aspect-ratio: 3 / 4; padding: 10px; overflow: hidden; border: 0; cursor: pointer; text-align: center; color: var(--ink); background: var(--panel); --k: 12px; transition: transform .2s ease, filter .2s ease; }
.fam:hover { transform: translateY(-3px); filter: drop-shadow(0 0 16px color-mix(in srgb, var(--c) 55%, transparent)); }
.fam .bgimg { position: absolute; inset: 0; z-index: 0; }
.fam .bgimg img, .fam .bgimg svg { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .38; filter: grayscale(.4); }
.fam::after { content: ""; position: absolute; inset: 0; z-index: 0; background: linear-gradient(to top, rgba(6, 9, 18, .92), rgba(6, 9, 18, .35)), linear-gradient(color-mix(in srgb, var(--c) 18%, transparent), transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); }
.fam > span { position: relative; z-index: 1; }
.fam .top { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.fam .s { align-self: center; font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 4vw, 46px); line-height: 1; color: var(--c); text-shadow: 0 0 18px color-mix(in srgb, var(--c) 70%, transparent); }
.fam .n { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.fam .n small { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0; text-transform: none; color: var(--muted); }

/* Filters */
.feed { margin-top: 44px; }
.filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hud-h)); z-index: 15; background: rgba(6, 9, 18, .86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.filters .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border: 0; background: var(--panel-2); color: var(--ink); font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; --k: 8px; }
.chip i { font-style: normal; font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: 0; }
.chip b { color: var(--c, var(--sys)); }
.chip[aria-pressed="true"] { background: var(--c, var(--sys)); color: var(--bg); }
.chip[aria-pressed="true"] b, .chip[aria-pressed="true"] i { color: var(--bg); }
.icon-btn { flex: none; display: grid; place-items: center; width: 40px; height: 36px; border: 0; background: var(--panel-2); color: var(--ink); cursor: pointer; --k: 8px; }
.icon-btn[aria-pressed="true"] { background: var(--sys); color: var(--bg); }
.icon-btn svg { width: 18px; height: 18px; }
.searchrow { padding-bottom: 10px; }
.search { width: 100%; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 400 15px/1.3 var(--f-body); --k: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; padding-top: 10px; }
.empty { padding: 40px 0; color: var(--muted); }
.filter-note { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 14px; font-size: 14px; color: var(--muted); }
.filter-note button { border: 0; background: none; color: var(--sys); text-decoration: underline; cursor: pointer; padding: 0; }

/* Orrery */
.orr-sec { margin-top: 56px; }
.orr { position: relative; background: radial-gradient(ellipse at center, rgba(145, 146, 255, .12), transparent 70%), rgba(13, 18, 34, .6); --k: 20px; padding: 8px; }
.orr svg { display: block; width: 100%; height: auto; }
.orr .orbit { fill: none; stroke: rgba(170, 185, 230, .16); stroke-width: 1; }
.orr .belt { fill: none; stroke: rgba(200, 210, 240, .35); stroke-width: 3; stroke-dasharray: 1 7; }
.orr .pl { fill: #4A5470; }
.orr .on .pl { fill: var(--c-espaco); }
.orr .sel .pl { stroke: var(--ink); stroke-width: 2.5; }
.orr text { font-family: var(--f-mono); font-size: 12px; fill: rgba(200, 210, 235, .55); }
.orr .on text { fill: var(--ink); font-weight: 500; }
.orr .cnt { fill: var(--c-espaco); font-family: var(--f-display); font-weight: 700; font-size: 13px; }
.orr g[role="button"] { cursor: pointer; }
.orr g[role="button"]:focus-visible { outline: none; }
.orr g[role="button"]:focus-visible .pl { stroke: var(--sys); stroke-width: 3; }
.orr .tail { stroke: rgba(124, 244, 255, .55); stroke-width: 2; stroke-linecap: round; }
.orr-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.orr-note { margin: 0 0 12px; font-size: 14px; color: var(--muted); }

/* Quiz */
.quiz-sec { margin-top: 56px; }
.qs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.q { display: grid; gap: 10px; align-content: start; padding: 18px; background: var(--panel); --k: 14px; }
.q p { margin: 0; font-weight: 600; line-height: 1.35; }
.q .opts { display: grid; gap: 7px; }
.opt { text-align: left; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel-2); font-size: 14px; line-height: 1.3; cursor: pointer; --k: 7px; }
.opt:hover:not(:disabled) { border-color: var(--sys); }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, var(--panel-2)); }
.opt.no { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--panel-2)); }
.q .res { font-size: 13px; color: var(--muted); }
.q .res a { color: var(--sys); }
.score { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }

/* Agenda */
.ag-sec { margin-top: 56px; }
.ag { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.ag li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 14px; background: var(--panel); --k: 12px; }
.when { display: grid; justify-items: center; align-content: start; gap: 2px; font-family: var(--f-display); color: var(--c); }
.when b { font-size: 28px; line-height: 1; font-weight: 700; }
.when span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.ag h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
.ag p { margin: 4px 0 6px; font-size: 14px; color: var(--muted); }
.ag .cd { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--sys); }
.ag a { font-size: 13px; color: var(--muted); }

/* Footer */
.foot { margin-top: 72px; padding-block: 30px 56px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.foot .msg { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(20px, 2.8vw, 28px); line-height: 1.25; max-width: 30ch; text-wrap: balance; }
.foot p { margin: 0; color: var(--muted); font-size: 14px; max-width: 72ch; }

/* Sheet */

@keyframes rise { from { transform: translateY(24px); opacity: .4; } }

  .sheet-wrap { padding: 0; place-items: end stretch; }
  .sheet { width: 100%; max-height: 100%; height: 100%; clip-path: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
.sh-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top, 0px)); background: rgba(13, 18, 34, .92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }

.sh-btn:disabled { opacity: .35; cursor: default; }
.sh-img .ph { aspect-ratio: 16 / 9; }
.sh-cap { padding: 6px 20px 0; font-size: 12px; color: var(--muted); }
.sh-cap a { color: var(--muted); }
.sh-body { display: grid; gap: 14px; padding: 16px 20px 28px; }
.sh-body h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.12; text-wrap: balance; }
.sh-body > p { margin: 0; font-size: 17px; line-height: 1.6; }
.tf { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.tf div { padding: 12px 14px; background: var(--panel-2); font-size: 15px; --k: 10px; }
.tf b { display: block; margin-bottom: 4px; font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.tf .t1 b { color: var(--c-misterios); }
.tf .t2 b { color: var(--ok); }
.chem { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding: 12px 14px; font-size: 15px; background: color-mix(in srgb, var(--c-quimica) 10%, var(--panel-2)); --k: 10px; }
.chem svg { width: 22px; height: 22px; color: var(--c-quimica); margin-top: 2px; }
.chem b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--c-quimica); margin-bottom: 2px; }
.listen { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; background: color-mix(in srgb, var(--c-rock) 10%, var(--panel-2)); --k: 10px; }

.listen a { padding: 5px 10px; background: var(--panel); text-decoration: none; font-size: 13px; font-weight: 600; --k: 5px; }
.srcs { font-size: 14px; color: var(--muted); }
.srcs a { color: var(--ink); }
.sh-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translateX(-50%); padding: 10px 18px; background: var(--panel-2); color: var(--sys); font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; box-shadow: 0 0 24px rgba(124, 244, 255, .35); --k: 9px; animation: toast 2.4s ease forwards; pointer-events: none; white-space: nowrap; }
.toast.big { font-size: 16px; padding: 14px 22px; color: var(--bg); background: linear-gradient(90deg, var(--sys), var(--c-games)); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 12px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -6px); } }

<script type="application/json" id="dados">__DADOS__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("dados").textContent);
  var CATS = D.categorias;
  var ORDER = CATS.map(function (c) { return c.id; });
  var CAT = {};
  CATS.forEach(function (c) { CAT[c.id] = c; });
  var MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
  var DIAS = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }
  function parts(iso) { var p = iso.split("-"); return { y: +p[0], m: +p[1], d: +p[2] }; }
  function weekday(iso) { var p = parts(iso); return DIAS[new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay()]; }
  function shortDate(iso) { var p = parts(iso); return p.d + " " + MESES[p.m - 1]; }
  function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function dayNum(iso) { var p = parts(iso); return Date.UTC(p.y, p.m - 1, p.d) / 864e5; }
  function todayNum() { var n = new Date(); return Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) / 864e5; }
  function store(key, fb) { try { var v = JSON.parse(localStorage.getItem(key)); return v == null ? fb : v; } catch (e) { return fb; } }
  function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  function hash(s) { var x = 2166136261; for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619); } return x >>> 0; }

  function f1(n) { return Math.round(n * 10) / 10; }
  function teaser(it) {
    var t = String(it.resumo || it.fatos || "");
    var m = t.match(/^.*?[.!?](\s|$)/);
    var s = (m ? m[0] : t).trim();
    return s.length > 160 ? s.slice(0, 157).replace(/\s+\S*$/, "") + "…" : s;
  }

  /* ---------- data ---------- */
  function isNew(it) { return !!it.adicionado_em && it.adicionado_em === D.atualizado_em; }
  var items = D.itens.filter(function (it) { return CAT[it.categoria]; }).slice().sort(function (a, b) {
    return ORDER.indexOf(a.categoria) - ORDER.indexOf(b.categoria) || (isNew(b) - isNew(a)) || (b.relevancia || 0) - (a.relevancia || 0) || b.data.localeCompare(a.data);
  });
  var byId = {};
  items.forEach(function (it) { byId[it.id] = it; });
  function inCat(cat) { return items.filter(function (it) { return it.categoria === cat; }); }
  var newCount = items.filter(isNew).length;

  var read = {};
  (store("tpn:lidas", []) || []).forEach(function (id) { read[id] = true; });
  var answers = store("tpn:quiz", {}) || {};
  var QZ = (D.quiz || []).filter(function (q) { return q.opcoes && q.opcoes.length; });

  /* ---------- XP ---------- */
  var LEVELS = [[0, "Recruta"], [60, "Cadete"], [160, "Piloto"], [320, "Explorador"], [520, "Comandante"], [800, "Almirante"], [1150, "Lenda da Tabela"]];
  function xpTotal() {
    var x = Object.keys(read).filter(function (id) { return byId[id]; }).length * 10;
    QZ.forEach(function (q) { var a = answers[String(hash(q.pergunta))]; if (a != null) x += a === q.certa ? 25 : 5; });
    return x;
  }
  function levelOf(x) {
    var i = 0; while (i + 1 < LEVELS.length && x >= LEVELS[i + 1][0]) i++;
    var next = LEVELS[i + 1] ? LEVELS[i + 1][0] : null;
    return { n: i + 1, name: LEVELS[i][1], base: LEVELS[i][0], next: next };
  }
  var lastLevel = levelOf(xpTotal()).n;
  function renderHud(gain) {
    var x = xpTotal(), L = levelOf(x);
    document.getElementById("lvl").innerHTML = "NV " + L.n + " <em>· " + esc(L.name) + "</em>";
    document.getElementById("xpbar").style.width = (L.next ? Math.round((x - L.base) / (L.next - L.base) * 100) : 100) + "%";
    document.getElementById("xpnum").textContent = x + " XP";
    if (L.n > lastLevel) toast("Subiu pro nível " + L.n + " · " + L.name, true);
    else if (gain) toast("+" + gain + " XP");
    lastLevel = L.n;
  }
  var toastEl = null;
  function toast(msg, big) {
    if (toastEl) toastEl.remove();
    toastEl = document.createElement("div");
    toastEl.className = "toast cut" + (big ? " big" : "");
    toastEl.setAttribute("role", "status");
    toastEl.textContent = msg;
    document.body.appendChild(toastEl);
  }
  function markRead(id, on) {
    var was = !!read[id];
    if (on) read[id] = true; else delete read[id];
    save("tpn:lidas", Object.keys(read));
    Array.prototype.forEach.call(document.querySelectorAll('[data-open="' + id + '"]'), function (el) {
      el.classList.toggle("is-read", !!read[id]);
      var b = el.querySelector(".badges");
      if (b) b.innerHTML = badgesHTML(byId[id]);
    });
    renderHud(on && !was ? 10 : 0);
  }

  /* ---------- art ---------- */
  function art(it) {
    var W = 320, H = 200, r = rng(hash(it.id)), g = [], night = false, i, j, cat = it.categoria;
    if (cat === "quimica") {
      var s = 22 + r() * 10, dx = s * Math.sqrt(3), ox = -r() * dx, oy = -r() * s;
      for (j = 0; j * s * 1.5 + oy < H + s; j++) for (i = 0; i * dx + ox < W + dx; i++) {
        var cx = ox + i * dx + (j % 2 ? dx / 2 : 0), cy = oy + j * s * 1.5, pts = [];
        for (var k = 0; k < 6; k++) { var a = Math.PI / 3 * k + Math.PI / 6; pts.push(f1(cx + s * Math.cos(a)) + "," + f1(cy + s * Math.sin(a))); }
        var o = f1(0.25 + r() * 0.6);
        g.push('<polygon class="ln" stroke-width="1.6" opacity="' + o + '" points="' + pts.join(" ") + '"/>');
        if (r() < 0.3) g.push('<circle class="ln" stroke-width="1.6" opacity="' + o + '" cx="' + f1(cx) + '" cy="' + f1(cy) + '" r="' + f1(s * 0.55) + '"/>');
        if (r() < 0.12) g.push('<circle class="fl" cx="' + f1(cx + s * Math.cos(Math.PI / 6)) + '" cy="' + f1(cy + s * Math.sin(Math.PI / 6)) + '" r="4"/>');
      }
    } else if (cat === "espaco") {
      night = true;
      for (i = 0; i < 90; i++) g.push('<circle class="star" opacity="' + f1(0.3 + r() * 0.7) + '" cx="' + f1(r() * W) + '" cy="' + f1(r() * H) + '" r="' + f1(0.4 + r() * 1.1) + '"/>');
      var pr = 34 + r() * 46, px = 70 + r() * 180, py = 50 + r() * 100, gid = "g" + hash(it.id);
      g.push('<defs><radialGradient id="' + gid + '" cx="35%" cy="35%" r="70%"><stop offset="0" style="stop-color:var(--c)"/><stop offset="1" stop-color="#0B1030"/></radialGradient></defs>');
      g.push('<circle cx="' + f1(px) + '" cy="' + f1(py) + '" r="' + f1(pr) + '" fill="url(#' + gid + ')"/>');
      if (r() < 0.5) g.push('<ellipse class="ln" stroke-width="2" opacity=".8" cx="' + f1(px) + '" cy="' + f1(py) + '" rx="' + f1(pr * 1.7) + '" ry="' + f1(pr * 0.35) + '" transform="rotate(' + f1(-20 + r() * 40) + " " + f1(px) + " " + f1(py) + ')"/>');
    } else if (cat === "games") {
      var c = 16;
      for (i = 0; i < W / c; i++) { var hh = Math.floor(2 + r() * 7); for (j = 0; j < hh; j++) g.push('<rect class="fl" x="' + i * c + '" y="' + (H - (j + 1) * c) + '" width="' + (c - 2) + '" height="' + (c - 2) + '" opacity="' + f1(0.2 + r() * 0.7) + '"/>'); }
      for (i = 0; i < 5; i++) g.push('<rect class="fl" x="' + Math.floor(r() * 18) * c + '" y="' + Math.floor(1 + r() * 4) * c + '" width="' + (c / 2) + '" height="' + (c / 2) + '"/>');
    } else if (cat === "tecnologia") {
      for (i = 0; i < 16; i++) {
        var x = Math.round(r() * 16) * 20, y = Math.round(r() * 10) * 20, path = "M" + x + " " + y;
        for (j = 0; j < 3; j++) { if (j % 2) y = Math.round(r() * 10) * 20; else x = Math.round(r() * 16) * 20; path += " L" + x + " " + y; }
        g.push('<path class="ln" stroke-width="2" opacity="' + f1(0.35 + r() * 0.55) + '" d="' + path + '"/><circle class="fl" cx="' + x + '" cy="' + y + '" r="3.5"/>');
      }
    } else if (cat === "misterios") {
      var mx = W * (0.4 + r() * 0.3), my = H * 0.6, a0 = r() * Math.PI * 2, a1 = a0 + 0.7, R = 150;
      for (i = 1; i <= 5; i++) g.push('<circle class="ln" stroke-width="1.2" opacity=".45" cx="' + f1(mx) + '" cy="' + f1(my) + '" r="' + i * 30 + '"/>');
      g.push('<path class="ln" stroke-width="1" opacity=".4" d="M' + f1(mx - R) + " " + f1(my) + " H" + f1(mx + R) + " M" + f1(mx) + " " + f1(my - R) + " V" + f1(my + R) + '"/>');
      g.push('<path class="fl" opacity=".28" d="M' + f1(mx) + " " + f1(my) + " L" + f1(mx + R * Math.cos(a0)) + " " + f1(my + R * Math.sin(a0)) + " A" + R + " " + R + " 0 0 1 " + f1(mx + R * Math.cos(a1)) + " " + f1(my + R * Math.sin(a1)) + 'Z"/>');
      for (i = 0; i < 4; i++) { var ba = r() * Math.PI * 2, br = 20 + r() * 120; g.push('<circle class="fl" cx="' + f1(mx + br * Math.cos(ba)) + '" cy="' + f1(my + br * Math.sin(ba)) + '" r="' + f1(2.5 + r() * 2.5) + '"/>'); }
    } else if (cat === "rock") {
      var n = 34, bw = 5, gap = 4, mid = H * 0.5, phase = r() * 6;
      for (i = 0; i < n; i++) { var amp = (0.25 + 0.75 * Math.abs(Math.sin(i * 0.35 + phase))) * (0.5 + r() * 0.5) * 70; g.push('<rect class="fl" opacity="' + f1(0.45 + r() * 0.5) + '" x="' + (14 + i * (bw + gap)) + '" y="' + f1(mid - amp) + '" width="' + bw + '" height="' + f1(amp * 2) + '" rx="2"/>'); }
      g.push('<circle class="ln" stroke-width="2" opacity=".5" cx="' + (W - 10) + '" cy="' + mid + '" r="70"/><circle class="ln" stroke-width="1" opacity=".35" cx="' + (W - 10) + '" cy="' + mid + '" r="52"/><circle class="fl" opacity=".6" cx="' + (W - 10) + '" cy="' + mid + '" r="14"/>');
    } else {
      var gx = W * (0.55 + r() * 0.2), gy = H * 0.55, gr = 88;
      g.push('<circle class="ln" stroke-width="2" opacity=".75" cx="' + f1(gx) + '" cy="' + f1(gy) + '" r="' + gr + '"/>');
      for (i = 1; i < 4; i++) g.push('<ellipse class="ln" stroke-width="1.2" opacity=".45" cx="' + f1(gx) + '" cy="' + f1(gy) + '" rx="' + f1(gr * Math.cos(i * Math.PI / 8)) + '" ry="' + gr + '"/>');
      for (i = -2; i <= 2; i++) { var yy = gy + i * gr * 0.38, half = Math.sqrt(Math.max(0, gr * gr - (i * gr * 0.38) * (i * gr * 0.38))); g.push('<path class="ln" stroke-width="1.2" opacity=".45" d="M' + f1(gx - half) + " " + f1(yy) + " H" + f1(gx + half) + '"/>'); }
      for (i = 0; i < 3; i++) { var ax = gx + (r() - 0.5) * 140, ay = gy + (r() - 0.5) * 120, bx = gx + (r() - 0.5) * 140, by = gy + (r() - 0.5) * 120; g.push('<path class="ln" stroke-width="2" stroke-dasharray="4 4" d="M' + f1(ax) + " " + f1(ay) + " Q" + f1((ax + bx) / 2) + " " + f1(Math.min(ay, by) - 50) + " " + f1(bx) + " " + f1(by) + '"/><circle class="fl" cx="' + f1(bx) + '" cy="' + f1(by) + '" r="3.5"/>'); }
    }
    return '<svg class="art" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect class="' + (night ? "night" : "bg") + '" width="' + W + '" height="' + H + '"/>' + g.join("") + '<text class="sym" x="18" y="' + (H - 18) + '" font-size="56">' + esc(it.simbolo) + "</text></svg>";
  }
  function pic(it, eager) {
    var im = it.imagem;
    if (im && im.arquivo) {
      var tall = im.altura && im.largura && im.altura > im.largura * 0.9;
      return '<span class="ph"><img src="' + esc(im.arquivo) + '" alt="' + esc(im.legenda || it.titulo) + '"' + (im.largura ? ' width="' + im.largura + '" height="' + im.altura + '"' : "") + (tall ? ' style="object-position:50% 22%"' : "") + (eager ? "" : ' loading="lazy"') + ' decoding="async"></span>';
    }
    return '<span class="ph">' + art(it) + "</span>";
  }
  function credit(it) {
    var im = it.imagem;

    if (on) document.getElementById("q").focus(); else { state.q = ""; document.getElementById("q").value = ""; renderFeed(); }
  });
  document.getElementById("btn-hide").addEventListener("click", function () { state.hideRead = !state.hideRead; this.setAttribute("aria-pressed", String(state.hideRead)); renderFeed(); });
  document.getElementById("q").addEventListener("input", function (e) { state.q = e.target.value; renderFeed(); });

  /* ---------- quiz ---------- */
  function renderQuiz() {
    var sec = document.getElementById("quiz-sec");
    if (!QZ.length) { sec.hidden = true; return; }
    var right = 0, done = 0;
    document.getElementById("quiz").innerHTML = QZ.map(function (q, qi) {
      var key = String(hash(q.pergunta)), ans = answers[key], it = byId[q.id];
      if (ans != null) { done++; if (ans === q.certa) right++; }
      var opts = q.opcoes.map(function (o, oi) {
        var cls = ans == null ? "" : oi === q.certa ? " ok" : oi === ans ? " no" : "";
        return '<button type="button" class="opt cut' + cls + '" data-q="' + qi + '" data-o="' + oi + '"' + (ans != null ? " disabled" : "") + ">" + esc(o) + "</button>";
      }).join("");
      var res = ans == null ? "" : '<div class="res">' + (ans === q.certa ? "Acertou! +25 XP." : "Era: " + esc(q.opcoes[q.certa]) + ". +5 XP pela tentativa.") + (it ? ' <a href="#n-' + esc(it.id) + '" data-go="' + esc(it.id) + '">Ver a notícia</a>' : "") + "</div>";
      return '<div class="q cut"' + (it ? ' data-cat="' + it.categoria + '"' : "") + "><p>" + esc(q.pergunta) + '</p><div class="opts">' + opts + "</div>" + res + "</div>";
    }).join("");
    document.getElementById("score").textContent = done ? right + " de " + done + " certas" + (done < QZ.length ? " · faltam " + (QZ.length - done) : right === QZ.length ? " · gabaritou!" : "") : QZ.length + " perguntas · vale XP";
  }
  document.getElementById("quiz").addEventListener("click", function (e) {
    var b = e.target.closest(".opt"); if (!b || b.disabled) return;
    var q = QZ[+b.getAttribute("data-q")], o = +b.getAttribute("data-o");
    answers[String(hash(q.pergunta))] = o; save("tpn:quiz", answers);
    renderQuiz(); renderHud(o === q.certa ? 25 : 5);
  });

  /* ---------- agenda ---------- */
  var tdy = todayNum();
  var ag = (D.agenda || []).filter(function (a) { return dayNum(a.data) >= tdy; }).sort(function (a, b) { return a.data.localeCompare(b.data); });
  document.getElementById("agenda").innerHTML = ag.map(function (a) {
    var p = parts(a.data), dd = dayNum(a.data) - tdy;
    var cd = dd === 0 ? "Hoje" : dd === 1 ? "Amanhã" : "Em " + dd + " dias";
    var src = a.fonte && a.fonte.url ? '<a href="' + esc(a.fonte.url) + '" target="_blank" rel="noopener noreferrer">' + esc(a.fonte.nome) + "</a>" : "";
    return '<li class="cut" data-cat="' + esc(a.categoria) + '"><div class="when"><b>' + p.d + "</b><span>" + MESES[p.m - 1] + '</span></div><div><span class="cd">' + cd + " · " + weekday(a.data) + "</span><h3>" + esc(a.titulo) + "</h3><p>" + esc(a.descricao) + "</p>" + src + "</div></li>";
  }).join("") || '<li class="cut"><div class="when"><b>–</b></div><div><h3>Nada marcado por enquanto</h3></div></li>';

  /* ---------- stars ---------- */
  var cv = document.getElementById("stars");
  function drawStars() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2), w = window.innerWidth, h = window.innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    var ctx = cv.getContext("2d"); if (!ctx) return;
    ctx.scale(dpr, dpr);
    var r = rng(99), n = Math.min(380, Math.round(w * h / 4200));
    for (var i = 0; i < n; i++) {
      var x = r() * w, y = r() * h, s = r() < 0.92 ? 0.3 + r() * 0.8 : 1.1 + r() * 0.8;
      ctx.globalAlpha = 0.25 + r() * 0.6;
      ctx.fillStyle = r() < 0.1 ? "#9AD9FF" : r() < 0.06 ? "#FFC9F0" : "#E8ECF8";
      ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
    }
  }
  var rsT; window.addEventListener("resize", function () { clearTimeout(rsT); rsT = setTimeout(drawStars, 200); });
  drawStars();

  /* ---------- boot ---------- */
  renderHud(0);
  renderFeed();
  renderQuiz();
  var h0 = (location.hash || "").slice(1);
  if (h0.indexOf("n-") === 0 && byId[h0.slice(2)]) openSheet(h0.slice(2), null, null);
  else if (CAT[h0] || (h0 === "novas" && newCount)) { state.cat = h0; renderFeed(); }
})();
</script>
