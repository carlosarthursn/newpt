e onda p no siliceto de európio (EuSi). Entre cerca de 33 e 62 K, os momentos magnéticos do európio formam uma espiral sem magnetização líquida, e elétrons que andam em sentidos opostos têm spins opostos. O efeito foi grande, com separações de energia acima de 100 meV, medidas com fotoemissão resolvida em spin, difração de nêutrons e outras técnicas. Aplicações como correntes de spin sem dissipação ainda não foram demonstradas no material.","angulo_quimico":"O charme é a simplicidade química: um composto estequiométrico de dois elementos, com cristais crescidos no próprio instituto, em que a textura de spin vem da simetria da espiral magnética, e não do acoplamento spin-órbita.","relevancia":3,"fontes":[{"nome":"ScienceDaily (Max Planck CPfS)","url":"https://www.sciencedaily.com/releases/2026/11/261123005341.htm"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Alchemist-hp (www.pse-mendelejew.de)","licenca":"CC BY-SA 3.0 de","fonte":"https://commons.wikimedia.org/wiki/File:Eu-Block.jpg","legenda":"Lingote de európio metálico de alta pureza; o estudo usou cristais de siliceto de európio (EuSi), não esta peça","arquivo":"img/eusi-magnetismo-onda-p.webp","largura":960,"altura":637}},{"id":"shenzhou24-paquistanes-tiangong","categoria":"espaco","data":"2026-11-24","simbolo":"Sz","nome":"Shenzhou-24","corpo":"Terra","titulo":"Shenzhou-24 decola e leva o primeiro estrangeiro à estação chinesa","resumo":"Um Longa Marcha 2F decolou de Jiuquan às 8h18 de quarta no horário de Pequim (21h18 de terça, 24, em Brasília) com o comandante Tang Hongbo, o engenheiro de voo Wu Yi e o paquistanês Zeeshan Ali, piloto de 40 anos e primeiro astronauta estrangeiro a embarcar na Tiangong. Cerca de seis horas depois, a tripulação já estava dentro da estação, segundo a RTÉ. Ali, que treinou sete meses em Pequim (com direito a aulas de chinês e pingue-pongue), fica de 5 a 10 dias e volta com o resto da tripulação da Shenzhou-23. Já o comandante da Shenzhou-23, Zhu Yangzhu, fica cerca de um ano e vai bater o recorde chinês de permanência em órbita.","angulo_quimico":"Um dos experimentos de Ali, segundo a RTÉ, testa compósitos de fibra de carbono autorreparáveis, que fecham sozinhos pequenas trincas na estrutura de naves.","relevancia":5,"fontes":[{"nome":"The Korea Herald","url":"https://www.koreaherald.com/article/10948946"},{"nome":"RTÉ","url":"https://www.rte.ie/news/world/2026/1125/1600554-china-space-world/"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Created by ForrestXYC, photoshopped by Ib","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Launch_of_Shenzhou_13.jpg","legenda":"Um Longa Marcha 2F decolando de Jiuquan, mas na missão Shenzhou-13 (2021), não na de agora","arquivo":"img/shenzhou24-paquistanes-tiangong.webp","largura":640,"altura":960}},{"id":"dragonfly-ganha-cameras","categoria":"espaco","data":"2026-11-24","simbolo":"Df","nome":"Dragonfly","corpo":"Titã","titulo":"O helicóptero da NASA para Titã ganha suas sete câmeras científicas","resumo":"No laboratório APL, da Johns Hopkins, a equipe do Dragonfly instalou e testou as sete câmeras científicas do conjunto DragonCam, feitas pela Malin Space Science Systems, que se somam a duas câmeras de navegação. Na frente vão uma grande-angular de 90° e uma de ângulo médio, que juntas dão visão estéreo; dos lados, câmeras para panoramas; embaixo, câmeras para checar se o pouso é seguro; e um imageador microscópico mira a broca DrACO, capaz de distinguir grãos de areia milimétricos. Outros instrumentos ainda chegam nos próximos meses, e o lançamento está marcado para julho de 2028, com chegada a Titã no fim de 2034.","angulo_quimico":"Um painel de LEDs do infravermelho ao ultravioleta vai iluminar o chão nas noites de quase oito dias terrestres de Titã: a cor ajuda a inferir a composição, e moléculas orgânicas que fluorescem no UV podem se entregar.","relevancia":4,"fontes":[{"nome":"NASA Science","url":"https://science.nasa.gov/missions/dragonfly/nasas-titan-bound-dragonfly-rotorcraft-gets-its-eyes/"}],"adicionado_em":"2026-11-25","imagem":{"credito":"NASA/JHU-APL","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Dragonfly-landing.png","legenda":"Ilustração da NASA: o Dragonfly chegando a um ponto de pouso em Titã (arte conceitual, não foto)","arquivo":"img/dragonfly-ganha-cameras.webp","largura":960,"altura":540}},{"id":"bepicolombo-teste-cego-mercurio","categoria":"espaco","data":"2026-11-24","simbolo":"Hg","nome":"Mercury Y","corpo":"Mercúrio","titulo":"Teste às cegas: a BepiColombo vai precisar de três instrumentos para ler Mercúrio","resumo":"Enquanto a BepiColombo se acomoda em Mercúrio, um estudo liderado por Océane Barraud, do DLR alemão, mandou para laboratórios de vários países uma amostra que imita a superfície do planeta, a 'Mercury Y', sem revelar a receita. As medidas do tipo MIXS (raios X) acertaram a composição elementar, inclusive o pouco ferro; as do SIMBIO-SYS (visível e infravermelho próximo) não deram assinaturas definitivas, mas a refletância e a inclinação do espectro estreitaram as opções; e as do MERTIS (infravermelho médio) identificaram os minerais principais. Conclusão do trabalho, publicado na Planetary and Space Science: nenhum instrumento sozinho resolve a química da superfície de Mercúrio.","angulo_quimico":"A mistura, desenhada a partir dos dados da MESSENGER, tinha cinco componentes: plagioclásio, piroxênio, olivina, vidro vulcânico e grafite. É a velha prova de 'identifique a amostra desconhecida', só que com espectroscopia planetária.","relevancia":4,"fontes":[{"nome":"Phys.org (Planetary Science Institute)","url":"https://phys.org/news/2026-11-sample-reveals-bepicolombo-decode-mercury.html"}],"adicionado_em":"2026-11-25","imagem":{"credito":"NASA / GSFC","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/GSFC_20171208_Archive_e001870","legenda":"Mercúrio em imagem colorida da sonda MESSENGER, da NASA (arquivo), cujos dados serviram de base para a amostra do teste","arquivo":"img/bepicolombo-teste-cego-mercurio.webp","largura":960,"altura":743}},{"id":"cinturoes-radiacao-quatro","categoria":"espaco","data":"2026-11-24","simbolo":"Va","nome":"Cinturões","corpo":"Terra","titulo":"Supertempestade de 2024 deu à Terra quatro cinturões de radiação por semanas","resumo":"A Terra costuma ter dois cinturões de Van Allen, mas um estudo liderado por Viviane Pierrard, do Instituto Real Belga de Aeronomia Espacial, mostra que depois da tempestade geomagnética de 11 de maio de 2024, a mais forte em uns 20 anos, os elétrons energéticos se reorganizaram em quatro cinturões. Eles se formaram em junho, duraram mais de quatro semanas, e o arranjo normal só voltou em agosto; estruturas com três cinturões reapareceram depois de outras tempestades até 2026. Os dados vêm do telescópio de partículas do satélite PROBA-V, da ESA, a 820 km de altitude. A hipótese é que a tempestade encheu a lacuna habitual e ondas eletromagnéticas abriram novas ao jogar elétrons na atmosfera, mas a causa exata ainda está em aberto (estudo na npj Space Exploration).","relevancia":3,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-belts-earth-weeks-solar-superstorm.html"}],"adicionado_em":"2026-11-25","imagem":{"credito":"W.carter","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:G5_aurora_over_Tuntorp,_Lysekil_Municipality_15.jpg","legenda":"Aurora sobre a Suécia durante a tempestade solar G5 de maio de 2024, a mesma que reorganizou os cinturões","arquivo":"img/cinturoes-radiacao-quatro.webp","largura":960,"altura":640}},{"id":"reator-lunar-lr1","categoria":"espaco","data":"2026-11-23","simbolo":"Lr","nome":"LR-1","corpo":"Lua","titulo":"NASA abre concorrência para o primeiro reator nuclear que vai gerar energia na Lua","resumo":"A NASA publicou o pedido de propostas para o Lunar Reactor-1 (LR-1), que deve fornecer 20 kW elétricos na superfície lunar, o suficiente, segundo a agência, para cerca de 16 casas americanas. A meta é ter um sistema pronto para lançamento até 2030 e operá-lo por pelo menos cinco anos, cumprindo as normas de segurança nuclear do Departamento de Energia, parceiro do programa. A vantagem sobre painéis solares é atravessar as noites lunares de cerca de duas semanas. As propostas vão até 21 de dezembro.","relevancia":3,"fontes":[{"nome":"NASA","url":"https://www.nasa.gov/directorates/rtmd/nasa-seeks-partners-to-design-first-nuclear-reactor-for-the-moon/"}],"adicionado_em":"2026-11-25","imagem":{"credito":"NASA","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Kilopower_moon_render_1_2018.jpg","legenda":"Conceito artístico da NASA (2018) de um reator de fissão na superfície da Lua; não é o desenho do LR-1","arquivo":"img/reator-lunar-lr1.webp","largura":960,"altura":960}},{"id":"major-cs2-singapura-imperial-dia1","categoria":"games","data":"2026-11-24","simbolo":"Mj","nome":"Major CS2","titulo":"Major de CS2 começa com a Imperial 2-0 e o time do s1mple no chão","resumo":"O PGL Major de Singapura começou na terça (24) e a brasileira Imperial fechou o primeiro dia invicta: 13-6 na HEROIC (Mirage) e 13-11 na 100 Thieves (Nuke), com saadzin puxando o time. Hoje (25), às 5h de Brasília, ela pega a FlyQuest numa MD3 valendo vaga no Stage 2. Já o time do s1mple, que joga como GOSH por restrições locais, levou 13-1 da Liquid e 13-3 da FaZe e venceu só 4 de 30 rounds. MIBR e FUT só entram no Stage 2, a partir de sábado, e a FURIA, no último Major da carreira do FalleN, só no Stage 3, em 2 de dezembro.","relevancia":4,"fontes":[{"nome":"Strafe","url":"https://www.strafe.com/br/news/read/major-de-singapura-2026-dia-1-tem-surpresas-e-time-de-s1mple-vence-apenas-quatro-rounds/"},{"nome":"Pichau Arena","url":"https://www.pichauarena.com.br/csgo/cs2/imperial-stage-2-pgl-major/"},{"nome":"Yardbarker","url":"https://www.yardbarker.com/entertainment/articles/action_underway_at_125m_pgl_major_singapore_2026/s1_17061_44612225"}],"adicionado_em":"2026-11-25","imagem":{"credito":"European Parliament","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:PGL_CS2_Major_Copenhagen_2024_stage_-_01.jpg","legenda":"Palco do Major de CS2 da PGL em Copenhague, 2024 (não é o de Singapura)","arquivo":"img/major-cs2-singapura-imperial-dia1.webp","largura":960,"altura":640}},{"id":"gta6-port-pc-leonida-some","categoria":"games","data":"2026-11-24","simbolo":"Ln","nome":"Port Leonida","titulo":"Maior port não oficial do GTA VI para PC some da noite para o dia","resumo":"O Leonida, maior projeto para rodar o GTA VI no PC por conta própria (recompilação estática com Vulkan), sumiu na madrugada de 23 para 24/11: repositório, Discord com uns 179 mil membros, tudo. O fundador, NotRexed, diz que a Rockstar derrubou os servidores dele, mas a PC Games Hardware não achou sinal de DMCA, e o 404 do GitHub aponta mais para exclusão pelos próprios donos; Rockstar e Take-Two seguem caladas. Mais de 3 mil forks e backups continuam por aí, e os rivais VIctory e XCL já chegam perto do mundo do jogo, mas nenhum é jogável, e a versão oficial para PC segue sem data.","relevancia":4,"fontes":[{"nome":"PC Games Hardware","url":"https://www.pcgameshardware.de/GTA-6-Spiel-55239/News/GTA-6-PC-ports-Leonida-offline-VIctory-leads-XCL-1560947/"},{"nome":"GamesRadar+","url":"https://www.gamesradar.com/games/grand-theft-auto/unofficial-gta-6-pc-port-scrapped-as-rockstar-allegedly-takes-down-discord-server-hours-after-devs-managed-to-get-the-game-booting/"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Discott no zjzmm,","licenca":"CC0","fonte":"https://commons.wikimedia.org/wiki/File:20231022_Rockstar_North.jpg","legenda":"Sede da Rockstar North, em Edimburgo, estúdio do GTA (foto de 2023)","arquivo":"img/gta6-port-pc-leonida-some.webp","largura":960,"altura":582}},{"id":"hacker-gta6-condenado-solto","categoria":"games","data":"2026-11-23","simbolo":"Hk","nome":"Hacker do GTA","titulo":"Hacker que vazou o GTA VI pega 7 anos e sai livre no mesmo dia","resumo":"Arion Kurtaj, do grupo Lapsus$, que vazou 90 vídeos do GTA VI em 2022, foi condenado na segunda (23) a sete anos de prisão, depois de se declarar culpado na semana anterior no Woolwich Crown Court, em Londres. Como já tinha passado tempo detido num hospital psiquiátrico (antes ele havia sido considerado inapto para ser julgado), saiu no mesmo dia em liberdade condicional. Segundo a BBC, citada pelo The Record, uma ordem de cinco anos o proíbe de usar Telegram e Discord; além da Rockstar, ele invadiu sistemas da Uber e da Revolut em 2022, quando estava em liberdade sob fiança.","relevancia":4,"fontes":[{"nome":"The Record","url":"https://therecord.media/gta-vi-hacker-arion-kurtaj-released-on-license"},{"nome":"Anadolu","url":"https://aa.com.tr/en/world/gta-vi-hacker-released-despite-being-sentenced-to-7-years-in-uk-prison/4135205"}],"adicionado_em":"2026-11-25","imagem":{"credito":"N Chadwick","licenca":"CC BY-SA 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Woolwich_Crown_Court_-_geograph.org.uk_-_7717781.jpg","legenda":"Fachada do Woolwich Crown Court, em Londres, onde saiu a sentença","arquivo":"img/hacker-gta6-condenado-solto.webp","largura":960,"altura":641}},{"id":"gta6-missao-secreta-diabo","categoria":"games","data":"2026-11-24","simbolo":"Dv","nome":"Missão do Diabo","titulo":"GTA VI esconde uma missão em que você encara o Diabo no Inferno","resumo":"No capítulo 2, à meia-noite, no norte de Port Gellhorn, tem uma casa chamada Circles of Hell com dois NPCs ouvindo heavy metal na garagem. Responda 'Having fun?' e depois 'It's good', entre na van e encare a fogueira no acampamento, que a viagem acaba numa briga contra o Diabo e seu exército de demônios. Dá para fazer com Jason ou Lucia, e a recompensa inclui a escopeta Hellspawn Comshot 12 (ao lado do trono de Satã), uma tatuagem nova e aumento permanente de vida, segundo o ComicBook.","relevancia":3,"fontes":[{"nome":"ComicBook","url":"https://comicbook.com/gaming/news/gta-6-players-find-a-new-mission-that-lets-you-fight-the-devil-heres-how-its-unlocked/"}],"adicionado_em":"2026-11-25"},{"id":"deepmind-agentes-algoritmos-quanticos","categoria":"tecnologia","data":"2026-11-23","simbolo":"Dm","nome":"Agentes quânticos","titulo":"Times de agentes do Gemini turbinam algoritmos quânticos, com prova em Lean","resumo":"A DeepMind pôs equipes independentes de agentes Gemini 4 para otimizar algoritmos quânticos, com uma 'conferência virtual' a cada quatro horas para trocar ideias e cada resultado provado no Lean. No circuito para simular fusão por confinamento inercial, o custo caiu 11,8 vezes (a memória foi de 5.650 para 4.338 qubits com correção de erro). Na química, o ganho foi de cerca de 8x para uma molécula fotossensível e de 2,5x para a enzima citocromo P450 (de 481 para 333 qubits), e a biblioteca em Lean saiu em código aberto no GitHub.","angulo_quimico":"Simular moléculas como a citocromo P450 e reações fotoquímicas é uma das grandes promessas do computador quântico; cada qubit a menos que o algoritmo exige aproxima o dia em que isso roda numa máquina real.","relevancia":5,"fontes":[{"nome":"Google DeepMind","url":"https://deepmind.google/blog/finding-faster-quantum-algorithms-with-agents-and-formal-verification/"},{"nome":"The Neuron","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-november-24-2026/"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Deposition authors: Sevrioukova, I.; visualization author: User:Astrojan","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:6bd7.jpg","legenda":"Estrutura de uma enzima da família citocromo P450 (a CYP3A4), com o grupo heme","arquivo":"img/deepmind-agentes-algoritmos-quanticos.webp","largura":960,"altura":765}},{"id":"ibm-vantagem-quantica-70-qubits-logicos","categoria":"tecnologia","data":"2026-11-23","simbolo":"Qb","nome":"Vantagem quântica","titulo":"IBM e UChicago rodam 70 qubits lógicos e falam em 'era da vantagem quântica'","resumo":"Pesquisadores da IBM e da Universidade de Chicago rodaram em cerca de 15 minutos uma versão estruturada da amostragem de circuitos aleatórios, com 70 qubits lógicos protegidos, 2.415 operações de dois qubits e erro lógico uns 10 vezes menor que o físico. Segundo eles, os melhores métodos clássicos levariam um tempo impraticável para repetir a conta, e o formato permite verificar o resultado, o grande calcanhar de aquiles dessas demonstrações; mas é um teste de força, não um problema útil. 'Estamos firmemente na era da vantagem quântica', disse Jay Gambetta, da IBM. No mesmo dia, a Rotonium apresentou um processador fotônico de 4 qubits efetivos que funciona em temperatura ambiente, num chip de 18 x 4 mm.","relevancia":4,"fontes":[{"nome":"ScienceDaily","url":"https://www.sciencedaily.com/releases/2026/11/261123231244.htm"},{"nome":"The Quantum Insider","url":"https://thequantuminsider.com/2026/11/23/rotonium-unveils-a-quantum-computer-that-operates-at-room-temperature"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Irekia / Eusko Jaurlaritza","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:IBM_Q_System_Two_Ikerbasque_03.jpg","legenda":"Um IBM Quantum System Two no País Basco, Espanha (não é a máquina do experimento)","arquivo":"img/ibm-vantagem-quantica-70-qubits-logicos.webp","largura":960,"altura":578}},{"id":"shirudo-openai-cisco-escudo-linux","categoria":"tecnologia","data":"2026-11-23","simbolo":"Sh","nome":"Shirudo","titulo":"OpenAI e Cisco lançam 'escudos' que tapam falhas no Linux sem reiniciar","resumo":"O Shirudo é um runtime de código aberto (licença BSD) que usa eBPF para bloquear o trecho vulnerável de um Linux em produção enquanto o patch de verdade não chega, sem reiniciar nada. Os 'escudos' podem ser escritos e testados por agentes de IA, mas quem decide colocá-los no ar é o time de segurança, e cada um é assinado e registrado com TPM. No teste da OpenAI, um escudo gerado pelo Codex barrou um exploit Java4Shell num Elasticsearch em funcionamento, que seguiu rodando normalmente.","relevancia":3,"fontes":[{"nome":"OpenAI","url":"https://openai.com/index/introducing-shirudo/"}],"adicionado_em":"2026-11-25","imagem":{"credito":"eBPF Foundation / The Linux Foundation","licenca":"CC0","fonte":"https://commons.wikimedia.org/wiki/File:Ebpf_logo_color_on_dark.png","legenda":"Logo do eBPF, a tecnologia do Linux em que o Shirudo se apoia","arquivo":"img/shirudo-openai-cisco-escudo-linux.webp","largura":960,"altura":351}},{"id":"foo-fighters-pausa-2027","categoria":"rock","data":"2026-11-24","simbolo":"Ff","nome":"Foo Fighters","titulo":"Dave Grohl diz que o Foo Fighters vai dar um tempo depois da turnê de 2027","resumo":"'Não sei por quanto tempo será, mas podemos dar um tempo', disse Grohl ao canal Quoteable, em fala transcrita pela Consequence, completando que parece 'a coisa certa a fazer'. À Mojo, ele contou que precisou 'reavaliar ambições e intenções'. Antes da pausa vem a Take Cover Tour, com cerca de 28 shows até setembro de 2027, incluindo o Brasil: 18 de fevereiro na Arena MRV, em BH, e 20 no MorumBIS, em SP, com abertura de Karen Dió e Deb and The Mentals.","ouvir":"Your Favorite Toy (2026), o disco mais recente","relevancia":4,"fontes":[{"nome":"Igor Miranda","url":"https://igormiranda.com.br/2026/11/foo-fighters-dara-um-tempo-apos-turne-de-2027-segundo-dave-grohl/"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Roger Woolman","licenca":"CC BY 3.0","fonte":"https://commons.wikimedia.org/wiki/File:Dave_Grohl_(132997591).jpeg","legenda":"Dave Grohl ao vivo com o Foo Fighters (foto de arquivo)","arquivo":"img/foo-fighters-pausa-2027.webp","largura":960,"altura":637}},{"id":"arch-enemy-architects-epica-brasil","categoria":"rock","data":"2026-11-24","simbolo":"Ae","nome":"Metal no Brasil","titulo":"Arch Enemy, Architects e Epica marcam shows no Brasil","resumo":"A Arch Enemy, agora com Lauren Hart nos vocais, traz a turnê 'Back for More' a cinco cidades em março de 2027: Curitiba (11), Porto Alegre (12), São Paulo (14, no Audio), Brasília (16) e BH (18), com ingressos à venda a partir de hoje (25), às 10h. O Architects toca com os franceses do Novelists em Curitiba (16/4) e São Paulo (18/4, no Vibra), ainda divulgando 'The Sky, The Earth & All Between'. E o Epica esgotou a noite com orquestra e coral no Vibra em 20/11/2027 e abriu uma segunda data, no dia 21, dentro da festa de 25 anos da banda.","ouvir":"The Sky, The Earth & All Between, do Architects (2025)","relevancia":4,"fontes":[{"nome":"Igor Miranda","url":"https://igormiranda.com.br/2026/11/arch-enemy-shows-brasil-marco-2027/"},{"nome":"Igor Miranda","url":"https://igormiranda.com.br/2026/11/architects-anuncia-2-shows-no-brasil-junto-do-novelists/"},{"nome":"Igor Miranda","url":"https://igormiranda.com.br/2026/11/epica-anuncia-show-extra-com-orquestra-e-coral-em-sao-paulo/"}],"adicionado_em":"2026-11-25","imagem":{"credito":"dario.demarco01","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Arch_Enemy_-_Wacken_2026_-_Day_4-1.jpg","legenda":"Arch Enemy no Wacken Open Air, Alemanha, em agosto de 2026","arquivo":"img/arch-enemy-architects-epica-brasil.webp","largura":960,"altura":641}},{"id":"sex-pistols-frank-carter-fim","categoria":"rock","data":"2026-11-24","simbolo":"Sp","nome":"Sex Pistols","titulo":"Sex Pistols encerram a fase com Frank Carter numa 'volta olímpica'","resumo":"Steve Jones, Paul Cook e Glen Matlock anunciaram as últimas 11 datas com Frank Carter no microfone, uma 'Lap of Honour' por Reino Unido e Irlanda em dezembro, fechando em 20/12 no Eventim Apollo, em Londres. A parceria nasceu em 2024 com três shows beneficentes para salvar o Bush Hall e rendeu boas críticas, enquanto John Lydon chamava tudo de 'karaokê'. 'Todas as coisas boas chegam ao fim', disse Carter; Jones avisou que 'isso não é o fim dos Pistols… mas vamos ver o que acontece'. Pelo Brasil, nada.","ouvir":"Never Mind the Bollocks, Here's the Sex Pistols (1977)","relevancia":3,"fontes":[{"nome":"Blabbermouth","url":"https://blabbermouth.net/news/sex-pistols-and-frank-carter-to-end-collaboration-after-final-run-of-shows-in-december-2026"},{"nome":"Igor Miranda","url":"https://igormiranda.com.br/2026/11/sex-pistols-anuncia-shows-finais-com-frank-carter-sem-vir-ao-brasil/"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Birgit Fostervold","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Frank_Carter_-_Sex_Pistols_2025-2.jpg","legenda":"Frank Carter cantando com os Sex Pistols no Tons of Rock, em Oslo, em 2025","arquivo":"img/sex-pistols-frank-carter-fim.webp","largura":960,"altura":639}},{"id":"paradise-lost-final-ascension","categoria":"rock","data":"2026-11-24","simbolo":"Pl","nome":"Paradise Lost","titulo":"Paradise Lost faz 40 anos com a turnê 'The Final Ascension'","resumo":"A banda de Nick Holmes e Gregor Mackintosh vai comemorar quatro décadas com 11 datas na Europa em novembro de 2027 (uma ainda a anunciar), de Dublin (4/11) a Munique (28/11), com Voivod e Dool abrindo. O anúncio fala em 'fechar um capítulo' e subir 'uma última vez', mas não diz com todas as letras que é despedida. O repertório mistura clássicos com faixas de 'Ascension', o 17º disco, de 2025.","ouvir":"Ascension (2025)","relevancia":3,"fontes":[{"nome":"Blabbermouth","url":"https://blabbermouth.net/news/paradise-lost-to-celebrate-40th-anniversary-on-the-final-ascension-november-2027-european-tour"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Frank Schwichtenberg","licenca":"CC BY-SA 3.0","fonte":"https://commons.wikimedia.org/wiki/File:Paradise_Lost_-_Elbriot_2016_09.jpg","legenda":"O vocalista Nick Holmes com o Paradise Lost no festival Elbriot, em Hamburgo, em 2016","arquivo":"img/paradise-lost-final-ascension.webp","largura":663,"altura":960}},{"id":"huawei-condenada-eua","categoria":"mundo","data":"2026-11-24","simbolo":"Hw","nome":"Huawei condenada","titulo":"Júri em Nova York condena a Huawei em 10 de 12 acusações","resumo":"Depois de mais de dois meses de julgamento no Brooklyn, um júri federal considerou a Huawei e três afiliadas culpadas de 10 das 12 acusações, entre elas conspiração para roubar segredos comerciais, lavagem de dinheiro e fraude bancária para esconder negócios no Irã e na Coreia do Norte. A gigante chinesa escapou das duas mais pesadas: conspiração de crime organizado (a lei RICO) e obstrução de justiça. Segundo a Bloomberg, a pena (multas, confisco e restituição) só sai em setembro de 2027; a empresa diz que vai avaliar recursos, e Pequim acusou Washington de 'reprimir e conter' empresas chinesas.","relevancia":4,"fontes":[{"nome":"Bloomberg","url":"https://bloomberg.com/news/articles/2026-11-24/huawei-found-guilty-of-us-criminal-charges-in-landmark-case"},{"nome":"ThePrint (Bloomberg)","url":"https://theprint.in/tech/huawei-found-guilty-of-multiple-us-criminal-charges-includes-conspiracy-to-steal-trade-secrets/3108351/"},{"nome":"A News","url":"https://www.anews.com.tr/world/2026/11/25/beijing-accuses-us-of-suppressing-chinese-firms-after-huawei-convicted-of-fraud"}],"adicionado_em":"2026-11-25","imagem":{"credito":"RG72","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Sidejo_de_Huawei_en_%C5%9Cen%C4%B5eno_09.jpg","legenda":"Showroom de tecnologia na sede da Huawei em Shenzhen, na China (foto de arquivo)","arquivo":"img/huawei-condenada-eua.webp","largura":960,"altura":720}},{"id":"ira-ormuz-sete-condicoes","categoria":"mundo","data":"2026-11-24","simbolo":"Hz","nome":"Ormuz","titulo":"Irã manda fechar Ormuz 'mais a cada dia' e só negocia com 7 condições","resumo":"O comandante do Exército iraniano, Amir Hatami, mandou a Marinha apertar o fechamento do Estreito de Ormuz até os EUA aceitarem as sete condições de Teerã, e o negociador-chefe Mohammad Bagher Qalibaf repetiu que sem isso não há conversa. A lista nunca foi publicada, mas a mídia estatal fala em fim das sanções, fim do bloqueio naval americano e devolução de ativos congelados. Do outro lado, o premiê do Catar foi a Washington falar com Marco Rubio e JD Vance para tentar reabrir o diálogo. No mercado, segundo o Nation Thailand, o Brent chegou a US$ 88,10 durante a terça e fechou em US$ 91,40, alta de US$ 2,03, depois de relatos de ataques a navios na região.","relevancia":4,"fontes":[{"nome":"Euronews","url":"https://www.euronews.com/2026/11/24/iran-orders-hormuz-closed-further-day-by-day-as-qatar-seeks-to-revive-peace-talks"},{"nome":"AP (via WTOP)","url":"https://wtop.com/national/2026/11/iran-insists-no-talks-with-the-us-until-its-7-conditions-are-met-and-other-mideast-news"},{"nome":"Nation Thailand","url":"https://www.nationthailand.com/news/world/40073886"}],"adicionado_em":"2026-11-25","imagem":{"credito":"MODIS Land Rapid Response Team, NASA GSFC","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Strait_of_Hormuz_(MODIS_2020-12-04).jpg","legenda":"O Estreito de Ormuz visto pelo sensor MODIS, da NASA, em dezembro de 2020 (imagem de arquivo)","arquivo":"img/ira-ormuz-sete-condicoes.webp","largura":960,"altura":748}},{"id":"lula-sanciona-ajuste-carta-pt","categoria":"brasil","data":"2026-11-24","simbolo":"Lc","nome":"Lula 4","titulo":"Lula sanciona o ajuste fiscal sem vetos e o PT lança nova 'Carta ao Povo'","resumo":"Um dia depois da votação final na Câmara, Lula sancionou sem vetos a Lei Complementar 239, publicada em edição extra do Diário Oficial na terça (24). Ela baixa de 2,5% para 2% o limite de crescimento real dos gastos, dobra o corte linear de benefícios tributários e aperta a compensação de créditos de PIS/Cofins; segundo O Liberal, o impacto estimado caiu para R$ 50 bilhões em 2027 depois das mudanças no Senado. Na mesma noite, o PT soltou uma nova 'Carta ao Povo Brasileiro', eco da de 2002, dizendo que 'nenhum interesse econômico' pode ficar acima da vontade das urnas e citando bandeiras como a isenção do IR até R$ 5 mil e o fim da escala 6x1. Como notou o Metrópoles, o texto não traz nenhuma meta fiscal para o novo mandato.","relevancia":4,"fontes":[{"nome":"O Liberal","url":"https://www.oliberal.com/economia/lula-sanciona-integralmente-projeto-de-lei-complementar-do-ajuste-fiscal-1.1197822"},{"nome":"Metrópoles","url":"https://www.metropoles.com/brasil/pt-lanca-nova-carta-ao-povo-e-diz-que-urnas-valem-mais-que-poder-economico"},{"nome":"CartaCapital","url":"https://www.cartacapital.com.br/politica/em-nova-carta-ao-povo-brasileiro-pt-diz-que-interesses-economicos-urnas/"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Lula Oficial","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Foto_oficial_do_primeiro_mandato_do_presidente_Luiz_In%C3%A1cio_Lula_da_Silva_-_53155275756.jpg","legenda":"Lula em retrato oficial da Presidência (foto de arquivo)","arquivo":"img/lula-sanciona-ajuste-carta-pt.webp","largura":726,"altura":960}},{"id":"cvm-suspende-brb","categoria":"brasil","data":"2026-11-23","simbolo":"Bb","nome":"BRB suspenso","titulo":"CVM suspende o registro do BRB, e as ações do banco saem da bolsa","resumo":"A CVM suspendeu na segunda (23) o registro de companhia aberta do BRB, que está há mais de 12 meses sem entregar balanços trimestrais; enquanto durar a suspensão, as ações BSLI3 e BSLI4 não podem ser negociadas. O sumiço dos balanços está ligado à crise com o Banco Master, em liquidação: segundo a Gazeta do Povo, o BRB pôs R$ 16,7 bilhões no Master entre 2024 e 2025, e a Polícia Federal vê indícios de irregularidade em pelo menos R$ 12,2 bilhões. A mesma medida pegou Ambipar, Refit (a Refinaria de Manguinhos) e outras duas empresas. A suspensão vale para o mercado de capitais, não para a operação do banco: conta e serviços seguem normais.","relevancia":3,"fontes":[{"nome":"Exame","url":"https://exame.com/invest/mercados/brb-tem-registro-suspenso-pela-cvm-e-acoes-ficam-impedidas-de-ser-negociadas-na-bolsa/"},{"nome":"Gazeta do Povo","url":"https://www.gazetadopovo.com.br/economia/cvm-suspende-registro-brb-impede-negociacao-acoes-bolsa/"},{"nome":"ClicRDC","url":"https://clicrdc.com.br/fique-bem-informado/cafe-com-noticias-de-terca-feira-24-de-novembro-de-2026/"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Agência Brasília from Brasília, Brasil","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Edif%C3%ADcio_sede_do_BRB_(48991026626).jpg","legenda":"Edifício-sede do BRB em Brasília (foto de arquivo da Agência Brasília)","arquivo":"img/cvm-suspende-brb.webp","largura":960,"altura":638}},{"id":"chape-vence-palmeiras-reserva","categoria":"brasil","data":"2026-11-24","simbolo":"Ch","nome":"Chape x Verdão","titulo":"Palmeiras poupa titulares e leva 3 a 0 da Chape antes da final","resumo":"Com a cabeça na final da Libertadores de sábado (28) contra o Estudiantes, em Montevidéu, Abel Ferreira deixou os titulares em São Paulo e mandou reservas e garotos do sub-20 para Chapecó. A Chapecoense, já rebaixada, aproveitou: Camilo, Max Alves e Miguel Carvalho fizeram 3 a 0 na Arena Condá, pela 37ª rodada do Brasileirão, e a Chape encerrou uma sequência de quatro derrotas.","relevancia":2,"fontes":[{"nome":"A Crítica","url":"https://acritica.net/noticias/chapecoense-faz-3-a-0-no-palmeiras-reserva-antes-da-final-da-libertadores/"},{"nome":"Gazeta Esportiva","url":"https://gazetaesportiva.com/times/palmeiras/veja-os-melhores-momentos-de-chapecoense-3-x-0-palmeiras-pelo-brasileirao"},{"nome":"Lance!","url":"https://www.lance.com.br/videos/chapecoense-3-x-0-palmeiras-melhores-momentos-campeonato-brasileiro-37a-rodada"}],"adicionado_em":"2026-11-25"},{"id":"erupcao-explosiva-challenger-deep","categoria":"misterios","data":"2026-11-23","simbolo":"Cd","nome":"Erupção abissal","titulo":"Erupção 'impossível': rochas explosivas a 6 km de fundo na Challenger Deep","resumo":"O robô submarino Jason/Medea achou, a cerca de 6.150 metros de profundidade perto da Challenger Deep (o ponto mais fundo do oceano), as rochas piroclásticas mais profundas já documentadas, sinal de erupções explosivas num lugar onde a pressão deveria impedir isso. O estudo, liderado por Robert Stern (Universidade do Texas em Dallas), saiu na segunda (23) na Frontiers in Earth Science.","teoria":"Pelo manual, isso não deveria existir: a mais de 600 bar, os gases do magma não teriam como se expandir e explodir, e a lava só escorreria. Por isso o achado foi tratado como 'impossível' e 'surpresa completa', e a equipe sugere que esse vulcanismo pode até ajudar a explicar por que a Challenger Deep é tão funda.","fatos":"As amostras saíram de sete mergulhos ao longo de cerca de 300 km do antearco da fossa. A explicação proposta: a água liberada pelo magma estaria em estado supercrítico e, ao virar vapor de repente, fragmentaria a lava, numa explosão bem mais fraca que as de terra firme. Os pontos de erupção ainda não foram achados ('ainda não identificamos onde foram as erupções', diz Stern) e falta datação radiométrica para saber quando aconteceram.","angulo_quimico":"Acima de cerca de 374 °C e 221 bar, a água vira fluido supercrítico, nem líquido nem gás. Segundo a Physics World, esse fluido ocupa só 3% do volume da mesma massa de água em forma de vapor, e é por isso que a 'explosão' lá embaixo é tão contida.","relevancia":4,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-robot-submarine-exploring-world-deepest.html"},{"nome":"Physics World","url":"https://physicsworld.com/a/traces-of-deepest-known-explosive-volcanism-found-near-the-challenger-deep/"},{"nome":"Live Science","url":"https://www.livescience.com/planet-earth/impossible-volcanic-eruption-spotted-in-deepest-part-of-the-ocean-perplexing-scientists"},{"nome":"National Geographic","url":"https://www.nationalgeographic.com/science/article/challenger-deep-explosive-volcanic-eruption-discovery"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Vlvescovo","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Challenger_Deep_Dive_071222_by_V_Vescovo_in_DSV_Limiting_Factor_-_Southern_Wall_of_Western_Pool.jpg","legenda":"Parede sul da Challenger Deep, fotografada do submersível Limiting Factor em 2022 (não é imagem do novo estudo)","arquivo":"img/erupcao-explosiva-challenger-deep.webp","largura":720,"altura":960}},{"id":"deputado-lagarto-video-viral","categoria":"misterios","data":"2026-11-24","simbolo":"Rp","nome":"Olho de réptil","titulo":"O deputado 'reptiliano' de Nova York: o vídeo é real, a teoria não","resumo":"Um vídeo do deputado estadual Jordan Wright revirando os olhos (só o branco aparece) atrás do prefeito Zohran Mamdani, numa coletiva em 20/11, viralizou como 'prova' de reptilianos. O Snopes checou na terça (24): o vídeo é autêntico, e o deputado diz que é 'obviamente' humano.","teoria":"Para quem compra a ideia, o revirar de olhos seria uma 'falha no disfarce' de um reptiliano, a velha teoria de que lagartos metamorfos ocupam cargos de poder, popularizada pelo britânico David Icke.","fatos":"O momento aparece em várias transmissões ao vivo da coletiva, inclusive a do próprio gabinete do prefeito e a do USA Today, sem sinal de edição por IA. Wright disse ao New York Post que não faz ideia do que houve no vídeo e brincou: 'não posso falar por répteis ou alienígenas'. Não existe nenhuma evidência de uma raça secreta de reptilianos, e o grupo antifascista britânico HOPE not hate aponta que a narrativa de Icke promove velhos estereótipos antissemitas.","relevancia":3,"fontes":[{"nome":"Snopes","url":"https://www.snopes.com/fact-check/nyc-assemblyman-eye-roll-lizard/"}],"adicionado_em":"2026-11-25"},{"id":"hera-dimorphos-cratera-estadio","categoria":"espaco","data":"2026-11-25","simbolo":"Dm","nome":"Dimorphos","corpo":"Dimorphos","titulo":"Hera revela Dimorphos com cratera de estádio e girando sem rumo","resumo":"A ESA mostrou na quarta (25), em Berlim, as primeiras imagens de perto de Dimorphos, a lua de 151 m que a DART acertou em 2022: a face atingida virou uma cratera do tamanho de um estádio que, segundo o investigador principal Patrick Michel, atravessa toda a largura do asteroide. Entre 'fez cratera', 'mudou de forma' ou 'ficou igual', a resposta foi as três ao mesmo tempo, já que o lado que não levou a pancada continua como em 2022. Dimorphos, que antes mantinha sempre a mesma face virada para Didymos, agora rodopia de forma caótica (a cientista Sabina Raducan comparou a um barril rolando escada abaixo), e centenas de pedregulhos de poucos metros, até então desconhecidos, orbitam a dupla. A Hera, hoje a uns 30 km, deve descer para cerca de 13 km e soltar os cubesats Juventas e Milani no início de 2027.","angulo_quimico":"O cubesat Milani vai estudar o material e a poeira em volta do sistema, e a Planetary Society diz que os cubesats vão medir a química da superfície. É a parte da perícia que olha a composição.","relevancia":5,"fontes":[{"nome":"Space.com","url":"https://space.com/astronomy/asteroids/hera-spacecraft-gets-1st-up-close-look-at-stadium-sized-hole-punched-in-asteroid-by-nasa-dart-mission"},{"nome":"The Planetary Society","url":"https://www.planetary.org/articles/heras-first-close-up-images-of-didymos-and-dimorphos"},{"nome":"CNN","url":"https://www.cnn.com/2026/11/25/science/hera-mission-dimorphos-asteroid-arrival-images"}],"adicionado_em":"2026-11-26","imagem":{"credito":"ESA Operations","licenca":"CC BY-SA 3.0 igo","fonte":"https://commons.wikimedia.org/wiki/File:Hera_spies_a_half-hidden_asteroid_moonlet.jpg","legenda":"Prévia da Hera, anterior à revelação de 25/11: o asteroide Didymos, com a pequena Dimorphos parcialmente escondida","arquivo":"img/hera-dimorphos-cratera-estadio.webp","largura":960,"altura":960}},{"id":"fcc-starmind-milhao-satelites","categoria":"espaco","data":"2026-11-25","simbolo":"Sx","nome":"Starmind","corpo":"Terra","titulo":"EUA liberam a SpaceX para pôr 1 milhão de satélites-datacenter em órbita","resumo":"A FCC, a agência de telecomunicações dos EUA, autorizou na quarta (25) a SpaceX a lançar até 1 milhão de satélites, os 'módulos de computação orbital' da constelação Starmind, uma rede de data centers de IA no espaço. Pela decisão, a empresa tem até 2033 para pôr o primeiro no ar e pode completar o resto aos poucos até 2040. A Sociedade Astronômica Americana se disse 'desanimada e consternada', porque os satélites apareceriam como pontos muito brilhantes no céu noturno, e Amazon (Kuiper) e Viasat também se opuseram. O astrofísico Adam Becker chamou o plano de 'fantasia': lembrou que dissipar calor no vácuo é um limite físico básico e alertou para colisões em cascata de lixo espacial.","relevancia":4,"fontes":[{"nome":"CNBC","url":"https://www.cnbc.com/2026/11/25/spacex-fcc-satellite-approval.html"},{"nome":"NBC News","url":"https://www.nbcnews.com/science/space/spacex-fcc-authorizes-1-million-satellites-data-centers-space-rcna611341"},{"nome":"Phys.org (AP)","url":"https://phys.org/news/2026-11-fcc-spacex-deploy-million-satellites.html"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Torsten Hansen/IAU OAE","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Light_pollution,_Third_Place.jpg","legenda":"Rastros de satélites Starlink cruzando Vênus e as Plêiades em foto de longa exposição (ilustrativa, de 2021)","arquivo":"img/fcc-starmind-milhao-satelites.webp","largura":640,"altura":960}},{"id":"lupex-rover-pernas-jaxa","categoria":"espaco","data":"2026-11-25","simbolo":"Lx","nome":"LUPEX","corpo":"Lua","titulo":"Japão mostra rover com pernas que vai caçar água no polo sul da Lua","resumo":"A JAXA apresentou na quarta (25), em Tóquio, um modelo de teste de quatro pernas que vai fazer parte do rover da LUPEX, missão conjunta com a Índia (o Japão faz o rover, a Índia o módulo de pouso) prevista para 2028. Segundo o gerente do projeto, Takeshi Hoshino, já foram testadas a subida de rampa usando uma perna só, o deslocamento contínuo com duas e a mobilidade em vácuo. O destino é o polo sul lunar, onde áreas que nunca recebem sol devem guardar água perto da superfície, e o rover vai procurar essas fontes, perfurar e medir quanta água há e de que qualidade.","angulo_quimico":"A meta declarada é transformar água lunar em combustível de foguete. Na prática isso significa eletrólise da água em H2 e O2, o mesmo par de propelentes de vários foguetes.","relevancia":3,"fontes":[{"nome":"Phys.org (AFP)","url":"https://phys.org/news/2026-11-japan-unveils-rover-prototype-moon.html"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Artem.G","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:LUPEX_1.jpg","legenda":"Maquete em escala 1/4 da missão LUPEX no pavilhão da JAXA na Expo 2025 (não é o protótipo apresentado agora)","arquivo":"img/lupex-rover-pernas-jaxa.webp","largura":672,"altura":960}},{"id":"urano-oposicao-2026","categoria":"espaco","data":"2026-11-25","simbolo":"Ur","nome":"Urano","corpo":"Urano","titulo":"Urano chegou à oposição, mas a Lua cheia roubou a cena","resumo":"Urano ficou em oposição no dia 25, com a Terra entre ele e o Sol. É a época do ano em que ele aparece mais brilhante: magnitude +5,6, segundo a BBC Sky at Night, no limite do olho nu em céu bem escuro. Ele está em Touro, entre as Híades e as Plêiades, mas a Lua cheia estava a só 6° dele, o que atrapalhou a observação. No telescópio aparece como um disquinho esverdeado de uns 4 segundos de arco, e com 200 mm ou mais dá para tentar ver as luas Titânia e Oberon.","angulo_quimico":"O tom verde-azulado vem do metano da atmosfera, que absorve a parte vermelha da luz do Sol.","relevancia":2,"fontes":[{"nome":"BBC Sky at Night Magazine","url":"https://www.skyatnightmagazine.com/news/uranus-november-2026"},{"nome":"Universe Today","url":"https://universetoday.com/articles/feast-your-eyes-on-uranus-at-opposition-this-thanksgiving-2026"}],"adicionado_em":"2026-11-26","imagem":{"credito":"NASA / JPL / NASA/JPL/USGS","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA00346","legenda":"Urano em forma de crescente, fotografado pela Voyager 2 em 1986 (não é do dia da oposição)","arquivo":"img/urano-oposicao-2026.webp","largura":540,"altura":800}},{"id":"fungo-co2-proteina","categoria":"quimica","data":"2026-11-25","simbolo":"Fg","nome":"Fungo de CO₂","titulo":"CO₂ vira comida: catalisador de cobre-ouro alimenta fungo rico em proteína","resumo":"Na Universidade Washington em St. Louis, o grupo de Joshua Yuan usou um catalisador tandem de cobre e ouro para transformar CO₂ por eletrocatálise em moléculas que alimentam o fungo comestível Neurospora intermedia, parecido com o oncom indonésio. Como o fungo cresce bem com etanol e acetato mas é inibido por formato, o catalisador foi desenhado em torno disso. Segundo o estudo, na One Earth, a biomassa fica pronta em 7 dias (a soja leva 122) e tem 48,5% de proteína, contra cerca de 36% da soja e 20,4% da carne bovina. Os autores calculam uns 794 L de água por kg de proteína (5.970 L na soja) e eficiência de luz solar em biomassa de 4,35%, cerca de nove vezes a da soja, e já planejam uma startup.","angulo_quimico":"O pulo do gato é a seletividade da eletrorredução de CO₂: o par Cu/Au em tandem foi ajustado para entregar o que o fungo metaboliza e evitar o formato, que o envenena.","relevancia":4,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-artificial-photosynthesis-protein-rich-edible.html"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Midori","licenca":"CC BY-SA 3.0","fonte":"https://commons.wikimedia.org/wiki/File:Oncom_merah.JPG","legenda":"Oncom vermelho, alimento fermentado da Indonésia ao qual o fungo do estudo é comparado (ilustrativa)","arquivo":"img/fungo-co2-proteina.webp","largura":960,"altura":720}},{"id":"bulvaleno-semicondutor-esticavel","categoria":"quimica","data":"2026-11-25","simbolo":"Bv","nome":"Bulvaleno","titulo":"Molécula 'cubo mágico' deixa plástico semicondutor esticar o dobro sem rachar","resumo":"Na Universidade de Toronto, a doutoranda Shine H. Huang, do grupo de Helen Tran, pôs bulvaleno, uma molécula orgânica que muda de forma, num polímero conjugado semicondutor do tipo dicetopirrolopirrol-co-tienotiofeno. O material passou a esticar mais que o dobro antes de trincar e continuou conduzindo 'quase tão bem quanto antes', segundo o estudo na Angewandte Chemie. Análises com luz síncrotron no Canadian Light Source mostraram que os cristalitos continuam lá, só que bem menores, e isso parece deixar o filme deformar sem cortar o caminho das cargas.","angulo_quimico":"O bulvaleno (C10H10) é o exemplo de livro de molécula fluxional: rearranjos de Cope degenerados embaralham suas ligações o tempo todo, e daí vem o apelido de 'cubo mágico'.","relevancia":4,"fontes":[{"nome":"Phys.org (Canadian Light Source)","url":"https://phys.org/news/2026-11-rubik-cube-molecule-gen-semiconductors.html"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Ben Mills","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Bullvalene-from-xtal-3D-balls.png","legenda":"Modelo de bolas e varetas do bulvaleno (C10H10), a molécula 'que muda de forma' usada no estudo","arquivo":"img/bulvaleno-semicondutor-esticavel.webp","largura":960,"altura":956}},{"id":"fosfato-nitrato-amonia","categoria":"quimica","data":"2026-11-25","simbolo":"Fs","nome":"Nitrato a NH₃","titulo":"Tampão fosfato faz cobre transformar nitrato em amônia 10 vezes mais rápido","resumo":"Um time internacional liderado pela Universidade de Osaka deixou o catalisador de lado e mexeu no eletrólito: com tampão fosfato neutro (pH 7), a redução de nitrato em cobre ficou cerca de 10 vezes mais rápida e mais de duas vezes mais seletiva para amônia do que em solução alcalina de pH 13, com a mesma força motriz. O gargalo era o nitrito intermediário, difícil de levar até o fim. Medidas de pH local mostraram que o pH na superfície não explicava o ganho, e IR operando com cálculos teóricos apontaram o fosfato adsorvido como 'lançadeira de prótons', que tira H+ da água e entrega aos intermediários (o trabalho saiu no JACS).","angulo_quimico":"A lição de eletroquímica: o ambiente do eletrodo pode pesar tanto quanto o material do catalisador. Ainda abre caminho para tirar o nitrato de efluentes e transformá-lo em amônia com baixo impacto.","relevancia":3,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-phosphate-boosts-nitrate-conversion-tenfold.html"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Apotashg","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Nitrate-elpot-transparent-3D-balls.png","legenda":"Modelo do íon nitrato (NO3−) com o mapa de potencial eletrostático: é ele que o catalisador de cobre reduz até amônia","arquivo":"img/fosfato-nitrato-amonia.webp","largura":960,"altura":911}},{"id":"shaheen-aramco-ulsan","categoria":"quimica","data":"2026-11-25","simbolo":"Sh","nome":"Shaheen","titulo":"Aramco inaugura na Coreia complexo de US$ 7 bi que leva cru direto a químicos","resumo":"A Aramco e a S-OIL, da qual a saudita tem mais de 63%, inauguraram o complexo Shaheen, em Ulsan, na Coreia do Sul. São US$ 7 bilhões, o maior investimento da Aramco no país, e cerca de 3,2 milhões de t/ano de capacidade petroquímica nova. É a primeira aplicação comercial de grande porte da tecnologia TC2C (thermal crude-to-chemicals), desenvolvida com a Lummus, e o complexo inclui o que a Aramco chama de maior steam cracker de trem único do mundo, além de uma fracionadora de propeno e unidades de polímeros. A operação comercial começa em 2027, e a fatia petroquímica do negócio da S-OIL deve subir de 12% para 25%.","angulo_quimico":"A ideia do crude-to-chemicals é tirar mais química e menos combustível de cada barril, levando o cru mais direto ao craqueamento térmico e às olefinas.","relevancia":3,"fontes":[{"nome":"IndexBox","url":"https://www.indexbox.io/blog/aramco-and-s-oil-launch-7-billion-shaheen-petrochemical-project-in-ulsan/"},{"nome":"Egypt Oil & Gas","url":"https://egyptoil-gas.com/news/aramco-inaugurates-7bn-shaheen-petrochemicals-project-in-south-korea/"}],"adicionado_em":"2026-11-26"},{"id":"neotuberostemonina-sintese","categoria":"quimica","data":"2026-11-24","simbolo":"Nt","nome":"Neotuberostemonina","titulo":"Alcaloide de planta com potencial antitosse ganha a 1ª síntese total","resumo":"Takeo Sakai, Ryu Tadano e Yuji Mori, da Universidade Meijo (Japão), publicaram no JACS a primeira síntese total da neotuberostemonina, alcaloide das raízes de Stemona tuberosa com potencial para suprimir a tosse, cuja estrutura foi descrita em 1994. No caminho saiu também a neostenina, em 13 etapas e 6,4% de rendimento global. A rota passa por um sal de amônio quaternário espirocíclico, um rearranjo 3-aza-Cope seguido de ciclização de Mannich (aminocetona tricíclica com 70% de rendimento e er 95:5), uma expansão de anel radicalar e uma inserção C–H catalisada por ródio que fecha a butirolactona. A neotuberostemonina sai no fim, de uma reação de Polonovski com 2-siloxifurano.","angulo_quimico":"A sequência aza-Cope/Mannich é um clássico para montar esqueletos de alcaloides. Já a Polonovski ativa o N-óxido e gera o íon imínio que deixa acoplar o furano no final.","relevancia":3,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-chemical-route-synthesis-compound-suppressing.html"}],"adicionado_em":"2026-11-26","imagem":{"credito":"阿橋 HQ","licenca":"CC BY-SA 2.0","fonte":"https://commons.wikimedia.org/wiki/File:%E5%A4%A7%E7%99%BE%E9%83%A8(%E5%B0%8D%E8%91%89%E7%99%BE%E9%83%A8)_Stemona_tuberosa_-%E9%A6%99%E6%B8%AF%E8%A5%BF%E8%B2%A2%E7%8D%85%E5%AD%90%E6%9C%83%E8%87%AA%E7%84%B6%E6%95%99%E8%82%B2%E4%B8%AD%E5%BF%83_Saikung,_Hong_Kong-_(9259214181).jpg","legenda":"Flor da Stemona tuberosa, planta de cujas raízes vêm os alcaloides sintetizados no estudo (foto em Hong Kong)","arquivo":"img/neotuberostemonina-sintese.webp","largura":960,"altura":937}},{"id":"major-cs2-singapura-dia2-s1mple-fora","categoria":"games","data":"2026-11-25","simbolo":"Cs","nome":"Major CS2","titulo":"Major de CS2: Imperial tropeça e o time do s1mple já está fora","resumo":"O segundo dia do Major de Singapura não foi gentil com a Imperial: a FlyQuest ganhou por 2-0 (13-11 na Dust2, com um clutch de 1v4 do jks, e 13-9 na Cache, depois de a Imperial ir para o intervalo vencendo por 7-5) e garantiu vaga direta no Stage 2. Os brasileiros caíram para a chave de 2-1 e encaram a Liquid nesta quinta (26), às 8h de Brasília, com a classificação em jogo. Já o time do s1mple, que no torneio aparece como GOSH por causa das restrições a apostas em Singapura, perdeu por 2-1 para a Chinggis Warriors e saiu com 0-3; segundo a Strafe, é a pior campanha dele em 15 Majors.","relevancia":4,"fontes":[{"nome":"HLTV","url":"https://www.hltv.org/news/46053/chinggis-warriors-condemn-bcgame-to-0-3-exit-in-singapore"},{"nome":"Insider Gaming","url":"https://insider-gaming.com/pgl-singapore-major-day-2-recap-gosh-what-a-humiliation-for-bc-game/"},{"nome":"Strafe","url":"https://www.strafe.com/news/read/singapore-major-2026-day-2-recap-s1mple-eliminated-as-flyquest-and-nip-advance/"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Esports Kingdom","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:IEM_Katowice_2019_s1mple_IMG_1716_(46485173115).jpg","legenda":"s1mple na IEM Katowice 2019 (imagem de arquivo, não é do Major de Singapura)","arquivo":"img/major-cs2-singapura-dia2-s1mple-fora.webp","largura":960,"altura":640}},{"id":"gpt-6-2-proteinas-laboratorio","categoria":"tecnologia","data":"2026-11-24","simbolo":"Pr","nome":"Proteínas","titulo":"GPT-6.2 desenha proteínas que grudam no alvo de verdade no laboratório","resumo":"A OpenAI publicou na terça (24) um trabalho em que o GPT-6.2, sem chamar modelos especializados de biologia, projeta formas 3D de proteínas usando raciocínio e código. No laboratório da parceira Onava, 322 'minibinders' foram testados contra cinco alvos e 35 (10,9%) se ligaram ao alvo certo, com pelo menos um acerto em cada um dos cinco. Em outra rodada, 179 de 272 fragmentos derivados de anticorpos (66%) se ligaram ao PD-1 ou PD-L1. A própria OpenAI faz as ressalvas: modelos especializados ainda foram usados para filtrar candidatos, o RFdiffusion já relatou taxas de acerto maiores, prever a estrutura completa continua sendo o ponto fraco (TM-score médio de 0,38 contra 0,93 do ESMFold2) e grudar no alvo é só o primeiro passo.","angulo_quimico":"É química de proteína na veia: desenhar a geometria que encaixa no alvo e depois escolher a sequência de aminoácidos que dobra naquela forma. O 'hit' aqui é só afinidade de ligação — especificidade, estabilidade e atividade biológica ficam para depois.","relevancia":4,"fontes":[{"nome":"OpenAI","url":"https://openai.com/index/gpt-6-models-demonstrate-intrinsic-protein-design-capabilities/"},{"nome":"The Neuron","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-november-25-2026/"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Authors of the study: Joseph L. Watson, David Juergens, Nathaniel R. Bennett, Brian L. Trippe, Jason Yim, Helen E. Eisenach, Woody Ahern, Andrew J. Borst, Robert J. Ragotte, Lukas F. Milles, Basile I. M. Wicky, Nikita Hanikel, Samuel J. Pellock, Alexis Courbet, William Sheffler, Jue Wang, Preetham Venkatesh, Isaac Sappington, Susana Vázquez Torres, Anna Lauko, Valentin De Bortoli, Emile Mathieu, Sergey Ovchinnikov, Regina Barzilay, Tommi S. Jaakkola, Frank DiMaio, Minkyung Baek & David Baker","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:De_novo_design_of_protein-binding_proteins.webp","legenda":"Proteínas ligantes desenhadas do zero no estudo do RFdiffusion, a referência com que a OpenAI se compara (não é do trabalho do GPT-6.2)","arquivo":"img/gpt-6-2-proteinas-laboratorio.webp","largura":960,"altura":905}},{"id":"openai-multiplicacao-matrizes-9-4","categoria":"tecnologia","data":"2026-11-24","simbolo":"Mx","nome":"Expoente 9/4","titulo":"OpenAI afirma ter fechado o expoente da multiplicação de matrizes em 9/4","resumo":"Num preprint posto no repositório público openai/math no dia 24, a OpenAI afirma que o expoente da multiplicação de matrizes (o tal do ômega) é exatamente 9/4, ou seja 2,25, em qualquer corpo — e não só um limite superior, mas também um limite inferior que bate com ele. O melhor limite conhecido até então era de cerca de 2,371, e um preprint da própria OpenAI, de outubro, já tinha proposto o 2,25 por cima nos complexos. O material foi produzido por um modelo interno da OpenAI, e o próprio repositório o chama de 'dados brutos de pesquisa' e avisa que resultados não formalizados podem ter problemas; nada passou por revisão por pares, e a formalização em Lean cobre o modelo de circuitos sem divisão, não o argumento inteiro. E não espere sua GPU ficar mais rápida: o resultado é assintótico e não muda nada na prática hoje.","relevancia":3,"fontes":[{"nome":"openai/math (README do preprint)","url":"https://github.com/openai/math/tree/main/preprints/The-matrix-multiplication-exponent-is-nine-fourths-November-24-2026"},{"nome":"openai/math (preprint)","url":"https://github.com/openai/math/blob/main/preprints/The-matrix-multiplication-exponent-is-nine-fourths-November-24-2026/paper.pdf"},{"nome":"Let's Data Science","url":"https://letsdatascience.com/news/openai-preprint-claims-matrix-multiplication-exponent-is-exa-7997d3b1"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Jochen Burghardt","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:MatrixMultComplexity_svg.svg","legenda":"Como o melhor limite conhecido para o expoente ω foi caindo ao longo das décadas (gráfico de referência, anterior ao novo preprint)","arquivo":"img/openai-multiplicacao-matrizes-9-4.webp","largura":960,"altura":554}},{"id":"tidal-apaga-musicas-ia","categoria":"tecnologia","data":"2026-11-24","simbolo":"Td","nome":"Tidal","titulo":"Tidal vai apagar 29 milhões de músicas feitas 100% por IA","resumo":"O Tidal anunciou na terça (24) que vai banir e remover faixas inteiramente geradas por IA. A faxina começa em 9 de dezembro e a empresa espera deletar mais de 29 milhões de músicas até o fim do ano, além de rejeitar entre 80 mil e 85 mil faixas novas por dia. Música feita com ajuda de IA continua liberada; o corte é para o que é 100% máquina. Os números que o serviço dá explicam a decisão: nos últimos 90 dias, mais de 43% dos uploads eram gerados por IA, e 27 milhões de faixas do catálogo (6,3%) são totalmente sintéticas — 96% delas sem nenhum play. Desmonetizar isso em junho não resolveu; nas palavras do chefe do Tidal Music, Robert Anderson, 'algo mais drástico precisa ser feito'.","relevancia":3,"fontes":[{"nome":"TechCrunch","url":"https://techcrunch.com/2026/11/24/tidal-to-ban-and-remove-millions-of-ai-generated-tracks-as-ai-slop-inundates-music-streaming/"}],"adicionado_em":"2026-11-26"},{"id":"andy-taylor-duran-duran-morre","categoria":"rock","data":"2026-11-25","simbolo":"At","nome":"Andy Taylor","titulo":"Morre Andy Taylor, o guitarrista que deu a garra do Duran Duran","resumo":"Andy Taylor, guitarrista original do Duran Duran, morreu em casa na segunda (23), aos 65 anos, cercado pela família; a banda e a família anunciaram na quarta (25). Ele vinha lutando contra um câncer de próstata diagnosticado em estágio 4 em 2018 — foi por isso que não subiu ao palco na entrada da banda no Rock and Roll Hall of Fame, em 2022. Taylor chegou a Birmingham em 1980 e tocou nos três primeiros discos, os de 'Girls On Film', 'Rio', 'Hungry Like The Wolf' e 'The Reflex'; em 1985 montou o supergrupo The Power Station com John Taylor, Robert Palmer e Tony Thompson. Saiu em 1986, voltou no começo dos anos 2000 e ainda participou do 'Danse Macabre', de 2023. Em nota, os companheiros de banda disseram que ele estava 'lá no começo da nossa história' e trouxe 'um fogo e uma malandragem que não saem mais'.","ouvir":"Duran Duran - 'Rio' (1982); e o primeiro disco do The Power Station (1985)","relevancia":4,"fontes":[{"nome":"RTÉ","url":"https://www.rte.ie/entertainment/2026/1125/1600695-andy-taylor-former-duran-duran-guitarist-dies-aged-65/"},{"nome":"Stereogum","url":"https://stereogum.com/2521680/duran-durans-andy-taylor-dead-at-65/news"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Brian Aris; Distributed by Capitol Records","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Duran_Duran_1983.jpg","legenda":"O Duran Duran por volta de 1983, com Andy Taylor na formação clássica (foto de divulgação)","arquivo":"img/andy-taylor-duran-duran-morre.webp","largura":960,"altura":529}},{"id":"anthrax-turne-europa-kerry-king","categoria":"rock","data":"2026-11-25","simbolo":"Ax","nome":"Anthrax","titulo":"Anthrax marca 19 shows na Europa em 2027 com Kerry King de abertura","resumo":"O Anthrax anunciou na quarta (25) a turnê europeia de 2027 do 'Cursum Perficio', o primeiro disco da banda em mais de uma década. São 19 datas entre 14 de março e 10 de abril, de Dublin a Londres (OVO Arena Wembley), passando por Paris, Madri, Milão, Berlim, Budapeste, Praga e Bruxelas. A abertura fica com Kerry King e o Sacred Reich — o mesmo Kerry King que, mais cedo em 2027, abre para o Megadeth na turnê de despedida. Os ingressos saem nesta sexta (27), às 10h do horário local, pelo site da banda. América do Sul não entrou nessa leva.","ouvir":"Anthrax - 'Cursum Perficio'","relevancia":3,"fontes":[{"nome":"Loudwire","url":"https://loudwire.com/anthrax-2027-european-tour-dates/"}],"adicionado_em":"2026-11-26"},{"id":"slipknot-dr-martens-black-friday","categoria":"rock","data":"2026-11-24","simbolo":"Sk","nome":"Slipknot","titulo":"Slipknot e Dr. Martens lançam coleção de coturno na Black Friday","resumo":"O Slipknot fechou com a Dr. Martens uma coleção limitada de nove peças: as botas 1460 Jungle Zip e Jadon, o sapato 1461 Zip, a 1490 Slipknot 10 Eye Boot em couro cáqui desgastado, mochila, três modelos de meia de algodão orgânico e porta-cartões, tudo com a costura vermelha da banda e a simbologia de sempre. Segundo a SPIN, a coleção chega no dia 27, e a 1490 sai só pela loja da banda. O pano de fundo é a volta grande: o Slipknot soltou 'Arsenal' em setembro, a primeira faixa nova desde 2023, e abre a turnê de estádios em 3 de julho de 2027, no Wembley.","ouvir":"Slipknot - 'Arsenal' (2026)","relevancia":2,"fontes":[{"nome":"SPIN (via Yahoo)","url":"https://yahoo.com/entertainment/music/articles/slipknot-dr-martens-unite-footwear-150300685.html"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Nick-D","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Pair_of_brown_Dr_Martens_1460_boots.jpg","legenda":"Um par de coturnos Dr. Martens 1460 comuns, bem gastos (não é a coleção do Slipknot)","arquivo":"img/slipknot-dr-martens-black-friday.webp","largura":960,"altura":719}},{"id":"trump-ira-guerra-paga-janeiro","categoria":"mundo","data":"2026-11-25","simbolo":"Ir","nome":"Guerra do Irã","titulo":"Trump diz que a guerra com o Irã tem verba até janeiro; Houthis miram Ras Tanura","resumo":"Numa entrevista ao New York Post na terça (24), Trump disse que os EUA têm dinheiro para manter as operações contra o Irã até mais ou menos o fim de janeiro. É justamente quando os democratas assumem as duas casas do Congresso, e eles já tentam cortar a verba para ataques no orçamento que vence em 11/12. Trump também disse que derrubar o governo iraniano não é objetivo dos EUA. Na quarta (25), os Houthis do Iêmen disseram ter causado incêndios em Ras Tanura, a maior refinaria saudita (550 mil barris por dia); a coalizão saudita afirma ter derrubado quatro drones e não confirmou dano. Para completar, o ministro da Defesa interino de Israel, Israel Katz, acusa o Irã de desenvolver armas químicas, e Teerã nega.","relevancia":4,"fontes":[{"nome":"The National News Desk","url":"https://thenationaldesk.com/news/politics/trump-says-iran-war-funded-through-january-as-israel-warns-of-chemical-weapons-development-strait-hormuz"},{"nome":"NBC News","url":"https://www.nbcnews.com/world/saudi-arabia/yemen-houthi-rebels-attack-saudi-arabia-largest-oil-refinery-rcna611319"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Paul Palmer","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Ras_Tanura_Refinery_by_Paul_Palmer_2487098008.jpg","legenda":"Vista aérea da refinaria de Ras Tanura, na Arábia Saudita (foto de arquivo, não é do ataque)","arquivo":"img/trump-ira-guerra-paga-janeiro.webp","largura":500,"altura":294}},{"id":"argentina-recessao-tecnica","categoria":"mundo","data":"2026-11-24","simbolo":"Ar","nome":"Argentina","titulo":"Argentina entra em recessão técnica, mas o governo Milei diz que é cedo","resumo":"O Indec soltou na terça (24) o índice de atividade de setembro: alta de 1,1% sobre agosto, mas queda de 1,2% contra setembro de 2025. Com isso a economia fecha dois trimestres seguidos de queda, a definição mais usada de recessão técnica, e consultorias como a Equilibra estimam um tombo de cerca de 1,8% no terceiro trimestre. O porta-voz da Presidência, Adrián Ravier, diz que não dá para confirmar e que é preciso esperar o PIB oficial, em dezembro. Dez dos 15 setores caíram no ano, com a pesca (-48,6%) e a intermediação financeira (-11,5%) puxando para baixo; a mineração subiu 11,1%.","relevancia":3,"fontes":[{"nome":"Bloomberg Línea","url":"https://www.bloomberglinea.com/latinoamerica/argentina/emae-la-economia-argentina-crece-en-septiembre-pero-no-logra-eludir-la-recesion-tecnica-segun-el-indec/"},{"nome":"Noticias Argentinas","url":"https://noticiasargentinas.com/economia/cayo-la-actividad-economica-en-septiembre-y-se-confirmo-la-recesion-tecnica_a6b05d271f5d9d6250779c5e4"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Diego Delso","licenca":"CC BY-SA 3.0","fonte":"https://commons.wikimedia.org/wiki/File:Casa_Rosada,_Buenos_Aires,_Argentina.jpg","legenda":"A Casa Rosada, sede do governo argentino, em Buenos Aires (foto ilustrativa)","arquivo":"img/argentina-recessao-tecnica.webp","largura":960,"altura":557}},{"id":"cartel-perfumes-multa-ue","categoria":"mundo","data":"2026-11-25","simbolo":"Pf","nome":"Cartel do perfume","titulo":"UE multa Givaudan, Firmenich e IFF em € 471,9 milhões por cartel de fragrâncias","resumo":"A Comissão Europeia multou na quarta (25) três gigantes das fragrâncias por trocarem informações sigilosas de preços e custos entre março de 2019 e março de 2023, inclusive sobre as negociações com a Unilever, a principal cliente. A Givaudan levou a maior multa (€ 252,4 milhões), seguida da Firmenich (€ 137,7 milhões) e da IFF (€ 81,9 milhões), com desconto porque as empresas admitiram a culpa e cooperaram. A investigação teve ajuda das autoridades do Reino Unido e da Suíça e do Departamento de Justiça dos EUA. 'Consumidores em toda a Europa podem ter pago mais', disse a comissária Teresa Ribera.","angulo_quimico":"As três estão entre as maiores casas de fragrâncias do mundo: criam e fabricam as misturas de moléculas aromáticas que vão em perfume, sabonete e produto de limpeza. Ou seja, o cartel mexia no preço de um insumo químico que está em boa parte do que a Unilever vende.","relevancia":3,"fontes":[{"nome":"FashionUnited","url":"https://fashionunited.uk/news/business/eu-imposes-nearly-500-million-euros-in-fines-on-three-fragrance-companies/2026112691575"},{"nome":"The Business of Fashion","url":"https://www.businessoffashion.com/news/beauty/firmenich-givaudan-iff-cartel-unilever/"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Europäische Kommission - Audiovisueller Dienst, Bogdan Hoyaux, Yügen, CE - Service audiovisuel, EC - Audiovisual Service","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Teresa_Ribera,_Executive_Vice-President_of_the_European_Commission_(P-064562-00-01).jpg","legenda":"Teresa Ribera, vice-presidente da Comissão Europeia e responsável pela concorrência (foto de arquivo)","arquivo":"img/cartel-perfumes-multa-ue.webp","largura":960,"altura":640}},{"id":"salomao-australia-tratado","categoria":"mundo","data":"2026-11-25","simbolo":"Sb","nome":"Pacífico","titulo":"Ilhas Salomão assinam tratado com a Austrália e esfriam o pacto com a China","resumo":"Na quarta (25), em Canberra, o premiê das Ilhas Salomão, Matthew Wale, e o australiano Anthony Albanese assinaram um tratado que faz da Austrália o 'principal parceiro de segurança' do arquipélago e garante que não haverá base militar estrangeira por lá. O acordo também prevê investimento australiano em infraestrutura, educação, energia renovável e esporte. O pacto de segurança que o governo anterior assinou com a China em 2022 vence no início de 2027; há relatos de que não será renovado, mas Wale não confirmou nem negou.","relevancia":2,"fontes":[{"nome":"NBC News","url":"https://www.nbcnews.com/world/asia/solomon-islands-signs-treaty-australia-checks-chinas-influence-pacific-rcna611254"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Andrew Kelly/DFAT","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Matthew_Wale_shakes_hands_with_Anthony_Albanese.jpg","legenda":"Matthew Wale, das Ilhas Salomão, cumprimenta Anthony Albanese num encontro anterior (foto do governo australiano)","arquivo":"img/salomao-australia-tratado.webp","largura":960,"altura":640}},{"id":"lula-milei-posse-sem-convite","categoria":"brasil","data":"2026-11-24","simbolo":"Mi","nome":"Brasil x Argentina","titulo":"Lula deixa Milei fora da posse, e o Brasil segue sem embaixador em Buenos Aires","resumo":"Segundo reportagens de terça (24) com base em fontes do governo, Milei não será convidado para a posse de 5 de janeiro, e o embaixador Julio Bitelli, chamado de volta em julho, não volta ao posto. O estopim foi o chanceler argentino, Pablo Quirno, dizer na TV que houve 'situações' no processo eleitoral brasileiro que colocavam 'tudo em dúvida', sem apontar nenhuma irregularidade. Não é rompimento formal: o comércio segue normal, e Lula e Milei devem se cruzar na cúpula do Mercosul em Montevidéu, no mês que vem.","relevancia":4,"fontes":[{"nome":"Buenos Aires Times","url":"https://www.batimes.com.ar/news/latin-america/lula-wont-invite-milei-to-inauguration-after-foreign-ministers-remarks.phtml"},{"nome":"CartaCapital","url":"https://www.cartacapital.com.br/mundo/lula-deixara-milei-fora-da-posse-apos-chanceler-argentino-questionar-eleicao-diz-jornal/"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Gobierno argentino","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Lulamilei.jpg","legenda":"Milei e Lula em dezembro de 2025, num dos raros encontros entre os dois (foto do governo argentino)","arquivo":"img/lula-milei-posse-sem-convite.webp","largura":960,"altura":640}},{"id":"lula-ministerio-seguranca-reuniao","categoria":"brasil","data":"2026-11-25","simbolo":"Se","nome":"Lula 4","titulo":"Lula chama Dino e ex-ministros para desenhar o Ministério da Segurança","resumo":"Na quarta (25), no Alvorada, Lula ouviu Flávio Dino (hoje no STF), Ricardo Lewandowski e Tarso Genro, junto com Alckmin, o ministro da Justiça e a Casa Civil, sobre a nova pasta da Segurança Pública, que deve herdar PF, PRF, Polícia Penal Federal e Força Nacional. Segundo Tarso, não se falou em nomes nem em prazos; a TV Sim Brasil diz que o anúncio do ministro deve sair na primeira semana de dezembro, e a pasta só vira oficial depois da promulgação da PEC da Segurança, já aprovada no Senado. Na mesma toada, a coluna Aparte relata que Lula sinalizou ao mercado que dirá até 2 de dezembro quem será o novo ministro da Fazenda.","relevancia":4,"fontes":[{"nome":"O Tempo","url":"https://www.otempo.com.br/politica/governo/2026/11/25/lula-reune-ex-ministros-da-justica-para-tratar-da-criacao-do-ministerio-da-seguranca-publica"},{"nome":"TV Sim Brasil","url":"https://tvsimbrasil.com.br/brasil/politica/noticia/2026/11/26/lula-discute-dino-ex-ministros-estrutura-ministerio-seguranca"},{"nome":"ParaibaOnline","url":"https://paraibaonline.com.br/brasil/2026/11/25/presidente-lula-devera-divulgar-novo-ministro-da-fazenda-na-proxima-semana/"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Palácio do Planalto from Brasilia, Brasil","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:01.01.2023_-_Posse_de_Fl%C3%A1vio_Dino,_Ministro_de_Estado_da_Justi%C3%A7a_(52626565184).jpg","legenda":"Arquivo: Lula dá posse a Flávio Dino na Justiça em 1º/1/2023; hoje Dino é ministro do STF","arquivo":"img/lula-ministerio-seguranca-reuniao.webp","largura":960,"altura":639}},{"id":"amazonia-rosa-cagarras","categoria":"brasil","data":"2026-11-24","simbolo":"Ca","nome":"Amazônia rosa","titulo":"Biólogo acha uma 'Amazônia rosa' a 4 km da praia de Ipanema","resumo":"O biólogo Ricardo Gomes, do Instituto Mar Urbano, encontrou em abril dois bancos de rodolitos perto das Ilhas Cagarras, no Rio. O achado foi confirmado por Rodrigo Moura, da UFRJ, e divulgado pela Mongabay em 24/11. Rodolitos são nódulos de algas calcárias com cara de pedra que abrigam muita vida, daí o apelido, e crescem só 1 a 1,5 mm por ano. Os pescadores já conheciam o lugar como 'Cangulândia', e o instituto quer mapear tudo com robô submarino e sonar; 'não conhecemos nem o quintal de casa', resumiu Moura.","angulo_quimico":"As algas calcárias depositam carbonato camada por camada, e essas camadas guardam um registro de séculos das condições do mar. Esse mesmo calcário é o que faz os bancos serem explorados para fertilizante e corretivo de solo, uma das ameaças citadas.","relevancia":3,"fontes":[{"nome":"Mongabay Brasil","url":"https://brasil.mongabay.com/2026/11/biologo-descobre-uma-amazonia-rosa-no-mar-de-ipanema/"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Beatriz Naranjo, UCR","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Rhodoliths_(10.3897-zookeys.1032.63431)_Figure_4.jpg","legenda":"Banco de rodolitos a 22 m de fundo na Ilha do Coco, Costa Rica: é assim que eles são (não é o banco do Rio)","arquivo":"img/amazonia-rosa-cagarras.webp","largura":960,"altura":540}},{"id":"boato-urnas-destruidas-tse","categoria":"misterios","data":"2026-11-24","simbolo":"Ur","nome":"Urnas","titulo":"Não, o TSE não está destruindo as urnas de 2026 para evitar um 'terceiro turno'","resumo":"Posts nas redes da Meta diziam que a Justiça Eleitoral destruiu todas as urnas usadas em outubro. O TSE e a checagem do Aos Fatos (24/11) mostram que só modelos antigos estão indo para a reciclagem.","teoria":"Um vídeo viral dizia que o governo e Alexandre de Moraes estavam 'juntando provas contra eles mesmos' ao sumir com as urnas, que a eleição poderia ser anulada até 18 de dezembro e que a destruição serviria para impedir um 'terceiro turno'.","fatos":"Os aparelhos descartados são dos modelos UE2010 e UE2011, que nem foram usados em 2026; o recolhimento começou em fevereiro e vai até março de 2027, com trituração e reciclagem acompanhadas pelo TSE. As urnas de outubro seguem lacradas por 100 dias depois do 1º turno e, se não houver ação judicial, só podem ser abertas após 12/1/2027. E 18/12 é o prazo da diplomação dos eleitos, não de anulação; segundo o TSE, mesmo uma anulação de votos não criaria terceiro turno.","relevancia":3,"fontes":[{"nome":"Aos Fatos","url":"https://www.aosfatos.org/noticias/tse-urnas-eleicoes-2026/"}],"adicionado_em":"2026-11-26","imagem":{"credito":"TSE - Tribunal Superior Eleitoral","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Urna_eletr%C3%B4nica_brasileira_UE2020.jpg","legenda":"Urna eletrônica modelo UE2020, mais nova que as UE2010 e UE2011 que estão sendo descartadas (foto do TSE)","arquivo":"img/boato-urnas-destruidas-tse.webp","largura":960,"altura":640}},{"id":"atc-baltimore-alienigenas","categoria":"misterios","data":"2026-11-24","simbolo":"Et","nome":"Rádio da torre","titulo":"Controlador de voo a piloto: 'já tivemos avistamentos de alienígenas por aqui'","resumo":"Um áudio de sábado (21) que circula no X mostra um controlador de Baltimore respondendo assim a um piloto da American Eagle, num voo de Washington para a Filadélfia, que estranhou um alerta de tráfego sem identificação. O caso foi noticiado pelo IBTimes UK.","teoria":"Nas redes, a frase virou sinal de que controladores lidam com OVNIs o tempo todo. O próprio controlador lembrou de outro piloto que teria visto um objeto em zigue-zague perto do aeroporto Martin State, sem aparecer no radar.","fatos":"O clima da conversa foi de brincadeira: o piloto levou na esportiva e disse que aquilo daria uma boa história para a família. Não se sabe o que disparou o alerta, não há confirmação de relatório formal de UAP e a FAA não comentou o caso. Alerta de tráfego serve para avisar de possível conflito e não quer dizer que a tripulação viu alguma coisa.","relevancia":2,"fontes":[{"nome":"IBTimes UK","url":"https://ibtimes.co.uk/audio-captures-baltimore-atc-telling-american-airlines-flight-5432-we-have-had-alien-sightings-out-1834383"}],"adicionado_em":"2026-11-26","imagem":{"credito":"Acroterion","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:PSA_American_Eagle_Bombardier_CRJ-900_N633NN_DCA_VA1.jpg","legenda":"Um CRJ-900 da PSA/American Eagle decola do aeroporto Reagan, em Washington, em 2015 (mesmo modelo, não é o avião do áudio)","arquivo":"img/atc-baltimore-alienigenas.webp","largura":960,"altura":469}},{"id":"tumulo-romano-rocha-cogumelo","categoria":"misterios","data":"2026-11-25","simbolo":"Tu","nome":"Túmulo no alto","titulo":"Túmulo romano escavado no topo de uma rocha-cogumelo de 5 metros na Turquia","resumo":"Dois pesquisadores locais, Nezir Ötegen e Yılmaz Çelik, acharam em 21/11, perto do reservatório de Gümüşören (Develi, Kayseri), uma cavidade em forma de caixão cavada no alto de uma rocha em formato de cogumelo. A história saiu na Daily Galaxy (25/11), que cita a imprensa turca.","teoria":"Quem enterraria alguém a 5 metros do chão, em cima de uma pedra? A aposta de Ötegen é que o lugar foi escolhido para ser visto de longe pelos povoados antigos ao redor.","fatos":"A identificação como túmulo romano de uns 2.000 anos é provisória: a cova já estava aberta e sem tampa, e não foram divulgados ossos, objetos nem inscrições. A formação da rocha também ainda não foi estudada. Ötegen avisou as autoridades e pediu proteção oficial e análise de especialistas.","relevancia":2,"fontes":[{"nome":"The Daily Galaxy","url":"https://dailygalaxy.com/2026/11/ancient-roman-tomb-16-foot-mushroom-rock/"}],"adicionado_em":"2026-11-26"}],"agenda":[{"data":"2026-11-26","titulo":"Termina a votação do sindicato da Rockstar no Reino Unido","descricao":"Mais de 1.600 funcionários da Rockstar no Reino Unido votam até 26/11 se reconhecem o sindicato IWGB, que quer voz sobre salário, hora extra, demissões e uso de IA generativa.","categoria":"games","fonte":{"nome":"Insider Gaming","url":"https://insider-gaming.com/rockstar-uk-union-vote-1600-workers/"}},{"data":"2026-11-26","titulo":"Imperial x Liquid no Major de CS2","descricao":"MD3 valendo vaga no Stage 2, às 8h de Brasília (19h em Singapura).","categoria":"games","fonte":{"nome":"Strafe","url":"https://www.strafe.com/news/read/singapore-major-2026-day-2-recap-s1mple-eliminated-as-flyquest-and-nip-advance/"}},{"data":"2026-11-27","titulo":"Peter Gabriel lança o álbum 'o\\i'","descricao":"Disco novo do ex-Genesis, que sai no mesmo dia da Black Friday do Record Store Day.","categoria":"rock","fonte":{"nome":"Ultimate Classic Rock","url":"https://ultimateclassicrock.com/november-2026-new-music-releases/"}},{"data":"2026-11-27","titulo":"Black Friday 2026","descricao":"A CNC projeta R$ 11,52 bilhões em vendas, o maior valor desde 2014, mas com crescimento real de só 1,8%, abaixo dos 3,2% do ano passado.","categoria":"brasil","fonte":{"nome":"CNN Brasil","url":"https://www.cnnbrasil.com.br/economia/money/macroeconomia/black-friday-pode-ter-melhor-faturamento-desde-2014-projeta-cnc/"}},{"data":"2026-11-27","titulo":"Abrem as vendas da turnê europeia do Anthrax","descricao":"Ingressos das 19 datas de 2027, com Kerry King e Sacred Reich,
