 chamou de 'o videogame mais impressionante que já joguei'. Versão de PC ainda não tem data. No Brasil custa R$ 449,90 (Standard) e R$ 549,90 (Ultimate), e a 'mídia física' é uma caixa com código de download, sem disco.","relevancia":5,"fontes":[{"nome":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/11/19/grand-theft-auto-vi-launches-to-rave-reviews-after-13-year-wait"},{"nome":"Legião dos Heróis","url":"https://www.legiaodosherois.com.br/2026/gta-6-jogo-chega-custando-ate-r-550-no-brasil-veja-precos-das-edicoes.html"}],"nome":"GTA VI chegou","imagem":{"credito":"Wilfredor","licenca":"CC0","fonte":"https://commons.wikimedia.org/wiki/File:Miami,_Florida_skyline.jpg","legenda":"Miami, inspiração de Vice City, cenário do GTA VI (foto ilustrativa)","arquivo":"img/gta-vi-chegou.webp","largura":960,"altura":405}},{"id":"gta-vi-bilhoes","categoria":"games","data":"2026-11-19","simbolo":"Bn","titulo":"US$ 1,84 bi até o dia do lançamento: GTA VI dobrou o recorde do GTA V","resumo":"Pela estimativa da Sensor Tower, GTA VI já tinha vendido cerca de 19 milhões de cópias e faturado uns US$ 1,84 bilhão até a manhã do lançamento, contando a pré-venda. Pra comparar, o GTA V fez US$ 815,7 milhões e 11,21 milhões de cópias nas primeiras 24 horas. Cerca de 75% das vendas foram no PlayStation. A Take-Two ainda não divulgou número oficial: no balanço do começo de novembro, o CEO Strauss Zelnick só disse que a pré-venda estava 'muito acima' do esperado, e a empresa subiu a previsão de receita do ano fiscal para US$ 7,98 a 8,18 bilhões.","relevancia":5,"fontes":[{"nome":"FOX 5 New York","url":"https://www.fox5ny.com/news/gta-vi-pulls-estimated-1-84-billion-release-day-more-than-double-gta-vs-launch-record"},{"nome":"Stocktwits","url":"https://stocktwits.com/news-articles/markets/equity/gta-vi-preorders-far-in-excess-of-expectations-numbers-will-speak-soon-ceo-boosts-expectations-as-ttwo-lifts-annual-forecasts/cNGuacWR978"}],"nome":"US$ 1,84 bi","imagem":{"credito":"Matthew T Rader","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Miami_skyline_from_the_ocean.jpg","legenda":"Miami vista do mar, cidade que inspira o cenário de GTA VI (foto ilustrativa)","arquivo":"img/gta-vi-bilhoes.webp","largura":960,"altura":600}},{"id":"tga-2026-indicados","categoria":"games","data":"2026-11-17","simbolo":"Tg","titulo":"Game Awards 2026: GTA VI lidera com 8 indicações","resumo":"Saíram os indicados do The Game Awards, que acontece em 10/12 no Peacock Theater, em Los Angeles. GTA VI lidera com 8 indicações, seguido por Control Resonant e Resident Evil Requiem, com 6 cada. Os indicados a Jogo do Ano são 007 First Light, Control Resonant, GTA VI, o remake de Zelda: Ocarina of Time, Phantom Blade Zero e Resident Evil Requiem. Em Melhor RPG estão The Blood of Dawnwalker, Final Fantasy Resonance, Fire Emblem: Fortune's Weave, Monster Hunter Stories 3 e Trails in the Sky 2nd Chapter. A brasileira LOUD (Valorant) concorre a Melhor Time de eSports.","relevancia":4,"fontes":[{"nome":"Gematsu","url":"https://www.gematsu.com/2026/11/the-game-awards-2026-nominees-announced"},{"nome":"GosuGamers","url":"https://www.gosugamers.net/entertainment/news/79505-the-game-awards-2026-nominees-revealed-gta-vi-leads-with-eight-nominations"}],"nome":"Game Awards","imagem":{"credito":"Benoît Prieur","licenca":"CC0","fonte":"https://commons.wikimedia.org/wiki/File:Microsoft_Theater_(Los_Angeles)_July_2022.JPG","legenda":"O teatro do LA Live, em Los Angeles (hoje Peacock Theater), palco do The Game Awards","arquivo":"img/tga-2026-indicados.webp","largura":960,"altura":584}},{"id":"worlds-2026-blg","categoria":"games","data":"2026-11-14","simbolo":"Bl","titulo":"Mundial de LoL: BLG passa por cima da Coreia e leva o primeiro título","resumo":"A Bilibili Gaming venceu a Gen.G por 3 a 1 na final do Worlds, no Barclays Center, em Nova York, e o mid Knight foi o MVP da final. É o primeiro título mundial de um time chinês desde a EDG em 2021, e acabou com a sequência de quatro títulos seguidos da LCK. A BLG derrubou todos os quatro times coreanos que enfrentou, inclusive o T1 do Faker na semi (3 a 1). O Viper chegou ao segundo título da carreira, e o Bin finalmente ganhou o troféu que faltava.","relevancia":4,"fontes":[{"nome":"Inven Global","url":"https://www.invenglobal.com/articles/28661/bilibili-gaming-win-worlds-2026-beating-geng-3-1-in-the-final"},{"nome":"KeenGamer","url":"https://www.keengamer.com/articles/features/reportages/bilibili-gaming-beat-gen-g-3-1-to-win-worlds-2026/"},{"nome":"GosuGamers","url":"https://www.gosugamers.net/lol/news/79501-bilibili-gaming-defeat-gen-g-to-be-crowned-worlds-2026-champions"}],"nome":"Mundial de LoL","imagem":{"credito":"Richard Ye","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:League_of_Legends_World_Championship_Finals_2018.jpg","legenda":"Final do Mundial de League of Legends de 2018 (foto de arquivo, não da edição de 2026)","arquivo":"img/worlds-2026-blg.webp","largura":960,"altura":448}},{"id":"zelda-ocarina-remake","categoria":"games","data":"2026-11-05","simbolo":"Ze","titulo":"Remake de Ocarina of Time foi o jogo mais bem avaliado do ano (até o GTA chegar)","resumo":"O remake de Zelda: Ocarina of Time saiu em 5/11, exclusivo do Switch 2, com 96 no Metacritic em mais de 80 análises, todas positivas. Foi a maior nota de 2026 até o GTA VI aparecer. Mesmo assim não supera o original de 1998, que continua com 99, a maior nota do site. A crítica elogiou a fidelidade, e a ressalva mais comum é que as dungeons ficaram mais simplificadas (o IGN deu 9/10 e reclamou justamente disso).","relevancia":4,"fontes":[{"nome":"GG Recon","url":"https://www.ggrecon.com/articles/ocarina-of-time-remake-reviews-metacritic/"},{"nome":"GamesRadar+","url":"https://www.gamesradar.com/games/the-legend-of-zelda/the-legend-of-zelda-ocarina-of-time-remakes-metacritic-score-makes-it-the-highest-rated-game-of-2026-but-even-it-cant-reach-the-originals-near-perfect-score/"}],"nome":"Ocarina remake","imagem":{"credito":"Evan-Amos","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:N64-Console-Set.png","legenda":"Nintendo 64, console do Ocarina of Time original (foto ilustrativa, não do remake)","arquivo":"img/zelda-ocarina-remake.webp","largura":960,"altura":517}},{"id":"gta-vi-30fps","categoria":"games","data":"2026-11-11","simbolo":"Fp","titulo":"30 fps até no PS5 Pro: a treta do frame rate do GTA VI","resumo":"A Rockstar confirmou que GTA VI roda travado em 30 quadros por segundo em todos os consoles, inclusive no PS5 Pro, sem modo performance no lançamento, mas sem descartar um modo 60 fps no futuro. Teve gente pedindo reembolso do PS5 Pro e comparando com a polêmica do Starfield, que depois ganhou modo 60 fps. Outros argumentaram que, num jogo-vitrine desses, a fluidez pesa menos. O próprio Kotaku duvida que a falta de 60 fps estrague a experiência.","relevancia":3,"fontes":[{"nome":"Kotaku","url":"https://kotaku.com/some-players-are-crashing-out-about-gta-6-only-being-30-fps-starfield-got-assaulted-for-being-locked-to-30-fps-2000755892"}],"imagem":{"credito":"Osh33m","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:PlayStation_5_and_DualSense.jpg","legenda":"Console PlayStation 5 com o controle DualSense (foto ilustrativa)","arquivo":"img/gta-vi-30fps.webp","largura":797,"altura":960}},{"id":"psn-caiu-vespera-gta","categoria":"games","data":"2026-11-18","simbolo":"Ps","titulo":"A PSN caiu horas antes de o GTA VI liberar. Coincidência?","resumo":"Na tarde de 18/11, horas antes de o jogo destravar nos EUA, milhares de jogadores ficaram presos no login da PlayStation Network, e o Downdetector passou de 4 mil reclamações. A Sony confirmou a instabilidade e normalizou em poucas horas, mas não disse a causa, e oficialmente nada liga uma coisa à outra. O Notebookcheck atribuiu o problema ao tráfego de milhões de consoles baixando um jogo de cerca de 212 GB ao mesmo tempo. Usuários de Xbox também relataram quedas.","relevancia":3,"fontes":[{"nome":"Newsweek","url":"https://newsweek.com/playstation-users-report-access-issues-hours-before-gta-vi-launch-12736310"},{"nome":"Notebookcheck","url":"https://www.notebookcheck.net/GTA-6-causes-PlayStation-Network-outages.1453653.0.html"}],"imagem":{"credito":"Alex Cochrane","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Playstation_DualSense_Controller.png","legenda":"Controle DualSense do PlayStation 5 (foto ilustrativa, não do dia da queda)","arquivo":"img/psn-caiu-vespera-gta.webp","largura":960,"altura":849}},{"id":"wow-forever","categoria":"games","data":"2026-11-04","simbolo":"Wo","titulo":"WoW: Forever reinventa a Azeroth clássica e traz raça nova","resumo":"A Blizzard lançou World of Warcraft: Forever em 4/11, uma versão nova e permanente do WoW numa Azeroth original reimaginada. A história se passa antes de Molten Core e o nível máximo é 60, o famoso 'Classic+' que a comunidade pedia havia anos. Tem uma raça jogável inédita, os Skyborne, e mais de mil quests novas. Já vem incluso na assinatura do WoW, sem custo extra.","relevancia":3,"fontes":[{"nome":"Blizzard","url":"https://worldofwarcraft.blizzard.com/en-us/news/24302093"},{"nome":"TechSpot","url":"https://www.techspot.com/news/113832-world-warcraft-forever-launches-november-4-new-race.html"}],"imagem":{"credito":"玄史生","licenca":"CC0","fonte":"https://commons.wikimedia.org/wiki/File:World-of-Warcraft_weapons_wall_20210314a.jpg","legenda":"Armas de World of Warcraft em exposição em Taiwan, em 2021 (foto ilustrativa)","arquivo":"img/wow-forever.webp","largura":960,"altura":636}},{"id":"balanco-nintendo-sony","categoria":"games","data":"2026-11-05","simbolo":"Lc","titulo":"Nintendo e Sony vendem menos console, mas lucram mais","resumo":"No trimestre até setembro, o Switch 2 vendeu cerca de 2,67 milhões de unidades e chegou a 26,35 milhões no total. No semestre o hardware caiu 37,4%, mas o lucro operacional da Nintendo subiu, puxado por software, e o console segue mais de 6 milhões à frente do Switch 1 no mesmo ponto de vida. A Sony vendeu 2,6 milhões de PS5, contra 4 milhões um ano antes, e chegou a 97,9 milhões, mas o lucro operacional da divisão de games subiu 83% (Wolverine passou de 2,4 milhões de cópias). A Sony também disse que já garantiu a memória de que precisa para o próximo ano fiscal, em plena crise de preço de RAM.","angulo_quimico":"A crise de memória que encareceu os consoles é, no fundo, falta de capacidade nas fábricas de semicondutores. Esse processo é engenharia química pura: reagentes e gases ultrapuros, deposição e gravação de camadas em escala nanométrica.","relevancia":3,"fontes":[{"nome":"Video Games Chronicle","url":"https://www.videogameschronicle.com/news/nintendo-switch-2-sales-have-dropped-37-but-its-still-comfortably-beating-the-original-console"},{"nome":"Shacknews","url":"https://shacknews.com/article/151284/nintendo-switch-2-sells-2-67-million-units-q2-fy27"},{"nome":"Gaming.net","url":"https://gaming.net/nintendo-reports-switch-2-hardware-decline-and-higher-profit"},{"nome":"PlayDay","url":"https://playday.one/2026/11/05/sony-financial-results-ps5-approaches-100-million-console-sold/"}],"imagem":{"credito":"Crisco 1492","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Nintendo_Switch_2_in_Docking_Console.jpg","legenda":"O Nintendo Switch 2 no dock (foto ilustrativa)","arquivo":"img/balanco-nintendo-sony.webp","largura":960,"altura":515}},{"id":"consoles-vendas-despencam","categoria":"games","data":"2026-11-19","simbolo":"Hw","titulo":"Vendas de consoles caem 36,5%, e o preço é o vilão","resumo":"Dados da S&P Global, repercutidos pelo GamesIndustry.biz, mostram vendas de consoles 36,5% menores no 3º trimestre de 2026, com 6,4 milhões de unidades. O Switch 2 caiu 59% (a base de comparação é o pico do lançamento), o PS5 caiu 35,3% depois de subir para US$ 649,99 em abril e o Xbox Series caiu 14,2%. O analista Neil Barbour diz que as margens apertadas impedem bundles agressivos com GTA VI e prevê vendas anuais estáveis. Aqui no Brasil, o PS5 com disco tem preço sugerido de R$ 5.099,90 desde o reajuste de abril.","relevancia":3,"fontes":[{"nome":"Canaltech","url":"https://canaltech.com.br/games/nem-gta-6-e-zelda-salvaram-vendas-de-consoles-caem-e-acende-alerta/"},{"nome":"Tecnoblog","url":"https://tecnoblog.net/noticias/sony-aumenta-precos-do-ps5-e-ps5-pro-em-varios-paises/"}],"imagem":{"credito":"Evan-Amos","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Nintendo-Switch-Console-Docked-wJoyConRB.jpg","legenda":"Console Nintendo Switch com Joy-Con (foto ilustrativa)","arquivo":"img/consoles-vendas-despencam.webp","largura":960,"altura":549}},{"id":"firaxis-demissoes","categoria":"games","data":"2026-11-17","simbolo":"Fx","titulo":"Firaxis, de Civilization e XCOM, demite um terço da equipe","resumo":"Dois dias antes de o GTA VI faturar bilhões, outro estúdio da mesma dona, a Take-Two, cortou cerca de 60 pessoas na Firaxis, mais ou menos um terço do time. O estúdio falou em 'reestruturação' para se concentrar no que faz de melhor. Segundo a Bloomberg, um novo XCOM está em desenvolvimento. É o contraste da indústria em 2026: recorde de faturamento de um lado, demissão do outro.","relevancia":3,"fontes":[{"nome":"Insider Gaming","url":"https://insider-gaming.com/civilization-and-xcom-studio-firaxis-lays-off-a-third-of-staff/"}],"imagem":{"credito":"Official GDC","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Sid_Meier_-_Game_Developers_Conference_2017_-_02.jpg","legenda":"Sid Meier, criador de Civilization e cofundador da Firaxis, em 2017","arquivo":"img/firaxis-demissoes.webp","largura":960,"altura":640}},{"id":"xbox-25-anos","categoria":"games","data":"2026-11-13","simbolo":"Xb","titulo":"Xbox faz 25 anos com foco no PC e RPGs clássicos de volta","resumo":"Para os 25 anos da marca, completados em 15/11, a Microsoft lançou o Xbox Playback, uma retrospectiva da sua história na plataforma. Também trouxe 25 jogos do Xbox original para PC, entre eles Knights of the Old Republic 1 e 2 e Morrowind, alguns ganhando conquistas pela primeira vez. Mostrou ainda gameplay de Fable e anunciou um modo Firefight gratuito para Halo: Campaign Evolved. Na avaliação da NoobFeed, quem joga no console ficou meio a ver navios, porque quase tudo foi pensado para o PC.","relevancia":2,"fontes":[{"nome":"NoobFeed","url":"https://www.noobfeed.com/news/xbox-25th-anniversary-highlights-console"},{"nome":"Xbox Wire","url":"https://news.xbox.com/en-us/2026/08/24/xbox-anniversary-x25-fanfest-gear-community-designs/"}],"imagem":{"credito":"Evan-Amos","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Xbox-console.jpg","legenda":"O Xbox original, lançado em 2001, que completa 25 anos","arquivo":"img/xbox-25-anos.webp","largura":960,"altura":441}},{"id":"pikmin-day","categoria":"games","data":"2026-10-31","simbolo":"Pk","titulo":"Nintendo cria o Dia do Pikmin e lança Pikmin 4 turbinado no Switch 2","resumo":"Num Nintendo Direct curtinho, a Nintendo oficializou 1º de novembro como o Pikmin Day. O destaque foi a Pikmin 4 Nintendo Switch 2 Edition + Dandori Academy, lançada em 12/11, que teve demo gratuita antes, com os dois primeiros estágios e progresso aproveitado no jogo completo. Também estreou uma série de vídeos de Pikmin feita com a Nintendo Pictures, com episódios mensais. Jogo inédito não apareceu.","relevancia":2,"fontes":[{"nome":"Nintendo World Report","url":"https://nintendoworldreport.com/news/77969/nintendo-declares-november-1-pikmin-day-airs-dedicated-direct"}],"imagem":{"credito":"PantheraLeo1359531","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Nintendo_Switch_2_%E2%80%93_Tischmodus_20250606.png","legenda":"Nintendo Switch 2 em modo de mesa, com os Joy-Con 2 (foto ilustrativa)","arquivo":"img/pikmin-day.webp","largura":960,"altura":629}},{"id":"huang-renuncia-nvidia","categoria":"tecnologia","data":"2026-11-12","simbolo":"Hu","titulo":"Jensen Huang cai: CEO da Nvidia renuncia em meio a suspeita de espionagem","resumo":"O cara da jaqueta de couro saiu. O New York Times noticiou que a inteligência americana suspeitava que Alice Huang, executiva da Megaspeed com quem ele tinha um caso, teria sido recrutada pelo serviço secreto chinês para espioná-lo; depois apareceu um segundo relacionamento, com uma diretora da própria Nvidia, e ele admitiu a infidelidade num memorando aos funcionários. O conselho abriu investigação em 8/11 e Huang renunciou em 12/11, após 33 anos no comando: a CFO Colette Kress virou CEO interina e a empresa perdeu cerca de US$ 600 bilhões em valor desde o início da investigação. A China chamou as acusações de infundadas, e o comunicado do conselho nem cita o caso. Teoria da conspiração da vida real, com documento na SEC e tudo. Atualização: em 23/11 o conselho voltou atrás e reconduziu o Huang ao cargo (veja a notícia nova).","relevancia":5,"fontes":[{"nome":"The Next Web","url":"https://thenextweb.com/news/jensen-huang-resigns-as-nvidia-ceo-after-33-years-effective-immediately"},{"nome":"SEC (Form 8-K da Nvidia)","url":"https://www.sec.gov/Archives/edgar/data/0001045810/000104581026000082/nvidiaannouncesceotransiti.htm"},{"nome":"Al Jazeera","url":"https://aljazeera.com/economy/2026/11/17/us-moves-to-block-chinas-remote-access-to-ai-chips-amid-nvidia-scandal"}],"nome":"Huang sai","imagem":{"credito":"Anders Eidesvik","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Jensen_huang_stanford_2026-04-30_011.jpg","legenda":"Jensen Huang, ex-CEO da Nvidia, em palestra em Stanford, em abril de 2026","arquivo":"img/huang-renuncia-nvidia.webp","largura":720,"altura":960}},{"id":"anthropic-ipo-recorde","categoria":"tecnologia","data":"2026-11-19","simbolo":"An","titulo":"Anthropic estreia na Nasdaq com o maior IPO da história","resumo":"A dona do Claude abriu capital em 19/11 com o ticker ANT: vendeu 980 milhões de ações a US$ 83 (acima da faixa prevista de US$ 70 a 78) e levantou cerca de US$ 81,3 bilhões, passando o IPO da SpaceX de junho como o maior já feito. A ação abriu a US$ 111,50 (+34%) e fechou o dia a US$ 97,17 (+17%), com a empresa chegando a valer cerca de US$ 2 trilhões durante o pregão. Tudo isso numa semana em que as ações de IA estavam apanhando feio.","relevancia":5,"fontes":[{"nome":"Al Jazeera","url":"https://www.aljazeera.com/economy/2026/11/19/anthropic-starts-trading-in-the-us-after-blockbuster-ipo"},{"nome":"Anchorage Daily News (AP)","url":"https://www.adn.com/business-economy/2026/11/19/anthropic-begins-trading-as-a-15-trillion-company-in-the-biggest-ipo-on-record/"},{"nome":"Anthropic","url":"https://anthropic.com/news/roadshow-launch"}],"nome":"IPO Anthropic","imagem":{"credito":"ajay_suresh","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Nasdaq_MarketSite_(51494550508).jpg","legenda":"O Nasdaq MarketSite, na Times Square, em Nova York (foto de arquivo)","arquivo":"img/anthropic-ipo-recorde.webp","largura":960,"altura":960}},{"id":"nvidia-resultado-q3","categoria":"tecnologia","data":"2026-11-17","simbolo":"Nv","titulo":"Nvidia fatura US$ 115,8 bi no primeiro balanço sem Huang","resumo":"Mesmo no meio do caos, a máquina não parou: receita de US$ 115,8 bilhões no trimestre (+103% em um ano), sendo US$ 107,6 bi só de data centers, e previsão de US$ 130 bi para o próximo trimestre, sem contar nenhuma venda de chips de data center para a China. A nova plataforma Vera Rubin começou a ser entregue no ramp de produção mais rápido da história da empresa e já roda em Google Cloud, Azure, Oracle e CoreWeave. No comunicado, quem assina como CEO é Colette Kress: o Vera Rubin começou explosivo, disse ela.","angulo_quimico":"Por trás desse número está a cadeia de semicondutores mais avançada do planeta: fotolitografia, deposição de filmes finos e reagentes de pureza extrema. A demanda por IA é, no fundo, demanda por processo químico de altíssimo nível.","relevancia":4,"fontes":[{"nome":"Nvidia (comunicado oficial)","url":"https://investor.nvidia.com/news/press-release-details/2026/NVIDIA-Announces-Financial-Results-for-Third-Quarter-Fiscal-2027/default.aspx"},{"nome":"Guru3D","url":"https://www.guru3d.com/story/nvidia-q3-fy2027-usd-1158-billion-revenue-data-center-usd-1076-billion-usd-130-billion-q4/"}],"nome":"Nvidia US$ 115 bi","imagem":{"credito":"Coolcaesar","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:NVIDIA_Headquarters.jpg","legenda":"Sede da Nvidia, em Santa Clara, na Califórnia (foto de arquivo)","arquivo":"img/nvidia-resultado-q3.webp","largura":960,"altura":587}},{"id":"gpt-6-2-astra-sol","categoria":"tecnologia","data":"2026-11-17","simbolo":"Gp","titulo":"OpenAI lança GPT-6.2 Astra e Sol, e acende o alerta de autoaperfeiçoamento","resumo":"A OpenAI soltou o GPT-6.2 Astra (topo de linha, para pesquisa científica e código pesado) e o GPT-6.2 Sol (o eficiente do dia a dia), já no ChatGPT e na API. Segundo a ARC Prize, o Astra é o primeiro modelo a cravar 100% no ARC-AGI-3, e pelo próprio system card é o primeiro modelo público da OpenAI a atingir o nível High de risco de autoaperfeiçoamento de IA, frase que parece saída de roteiro de ficção científica. Veio cerca de sete semanas depois de a empresa engavetar o 6.1 Astra, e parte dos usuários achou o salto na prática menor do que os benchmarks sugerem.","angulo_quimico":"Os dois modelos bateram o limiar High de risco biológico e químico do framework de segurança da OpenAI, ou seja, a empresa avalia que eles já poderiam dar ajuda relevante nessa área sensível e por isso saem com travas extras.","relevancia":4,"fontes":[{"nome":"OpenAI","url":"https://openai.com/index/introducing-gpt-6-2-astra-sol"},{"nome":"TestingCatalog","url":"https://www.testingcatalog.com/openai-launches-gpt-6-2-astra-and-sol-on-chatgpt-and-apis/"},{"nome":"Wccftech","url":"https://wccftech.com/openais-gpt-6-2-astra-becomes-the-first-model-to-achieve-a-100-score-on-arc-agi-3-while-being-8x-cheaper-than-anthropics-fable-5-2-but-actual-users-are-not-impressed/"}],"nome":"GPT-6.2","imagem":{"credito":"HaeB","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Pioneer_Building,_San_Francisco_(2019)_-1.jpg","legenda":"Pioneer Building, em San Francisco, antiga sede da OpenAI (foto de 2019)","arquivo":"img/gpt-6-2-astra-sol.webp","largura":960,"altura":482}},{"id":"eua-chips-ia-brasil","categoria":"tecnologia","data":"2026-11-16","simbolo":"Ci","titulo":"EUA passam a exigir licença para vender chips de IA a data centers no Brasil","resumo":"O Departamento de Comércio americano colocou o Brasil, junto com Singapura, Malásia, Indonésia e Tailândia, numa lista de países com risco de desvio de tecnologia: exportar chips avançados de IA para data centers daqui agora exige licença extra. O alvo é a China, que usa acesso remoto a data centers em outros países para driblar o embargo; quem fornece muito poder computacional a empresas chinesas tem 90 dias para conseguir a licença. Não é proibição, os pedidos são analisados caso a caso, mas a Abes alerta para desvantagem dos data centers de capital nacional e dificuldade para atrair investimento.","relevancia":4,"fontes":[{"nome":"Teletime","url":"https://teletime.com.br/16/11/2026/eua-chips-ia-data-centers-brasil/"},{"nome":"Al Jazeera","url":"https://aljazeera.com/economy/2026/11/17/us-moves-to-block-chinas-remote-access-to-ai-chips-amid-nvidia-scandal"}],"imagem":{"credito":"Carl Lender from Sunrise, USA","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Datacenter_Server_Racks_(22370909788).jpg","legenda":"Racks de servidores em um data center (foto ilustrativa)","arquivo":"img/eua-chips-ia-brasil.webp","largura":960,"altura":640}},{"id":"bolha-ia-selloff","categoria":"tecnologia","data":"2026-11-05","simbolo":"Bo","titulo":"Bolha? Ações de IA derretem e S&P 500 tem o pior dia desde abril de 2025","resumo":"Logo depois das eleições de meio de mandato nos EUA, o S&P 500 caiu 4,4% em 5/11 (pior dia desde o tarifaço de abril de 2025), a Nasdaq 5,5% e a Nvidia 9,3%. Os medos: juros altos encarecendo a construção de data centers, avaliações infladas e a chance de vitórias democratas levarem governos a frear novos data centers por causa da conta de luz. A pressão continuou nas semanas seguintes, turbinada pelo caso Huang, e a Nasdaq entrou em correção.","relevancia":4,"fontes":[{"nome":"AJC (AP)","url":"https://www.ajc.com/news/2026/11/a-wipeout-for-ai-stocks-sends-wall-street-reeling-and-the-sp-500-tumbles-more-than-35/"},{"nome":"Wealth Professional","url":"https://www.wealthprofessional.ca/investments/equity-markets/nasdaq-slides-into-correction-as-ai-selloff-hits-third-day/394028"},{"nome":"KPTV (AP)","url":"https://www.kptv.com/2026/11/17/another-wipeout-hits-wall-street-nvidia-other-jittery-ai-stocks-swing-lower/?outputType=amp"}],"imagem":{"credito":"Arild Vågen","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:New_York_Stock_Exchange_August_2017_02.jpg","legenda":"A Bolsa de Nova York, em Wall Street (foto de arquivo)","arquivo":"img/bolha-ia-selloff.webp","largura":960,"altura":641}},{"id":"google-exploit-agent","categoria":"tecnologia","data":"2026-11-16","simbolo":"Ex","titulo":"Google flagra a primeira IA hacker que acha e explora falhas sozinha","resumo":"O grupo de inteligência de ameaças do Google, junto com a Mandiant, revelou o exploit_agent: um sistema multiagente, ligado a vários LLMs, que lê patches de segurança recém-publicados, descobre qual falha foi corrigida, escreve o exploit e o executa sem humano no meio. Foi encontrado num servidor exposto e mirava sites franceses de mídia, entretenimento e educação (o Google não conseguiu confirmar se os dados roubados achados lá vieram das operações autônomas). A previsão do Google é de ataques com pouca ou nenhuma interação humana em questão de meses: a corrida entre o patch e o ataque ficou bem mais curta.","relevancia":4,"fontes":[{"nome":"CSO Online","url":"https://www.csoonline.com/article/4249595/google-spots-the-first-hacker-ai-system-that-finds-and-exploits-flaws-autonomously.html"},{"nome":"Unite.AI","url":"https://unite.ai/google-finds-attackers-using-fully-autonomous-exploit-pipelines"}],"imagem":{"credito":"David Nagle","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Outside_Googleplex_in_Mountain_View,_California.jpg","legenda":"Sede do Google, o Googleplex, em Mountain View, na Califórnia (foto de arquivo)","arquivo":"img/google-exploit-agent.webp","largura":960,"altura":640}},{"id":"claude-fable-mythos-5-2","categoria":"tecnologia","data":"2026-11-09","simbolo":"Fa","titulo":"Anthropic solta Claude Fable 5.2 e Mythos 5.2 às vésperas da bolsa","resumo":"A Anthropic lançou o Claude Fable 5.2, focado em programação, raciocínio e agentes, e o Mythos 5.2, voltado a cibersegurança e pesquisa em ciências da vida, este com acesso restrito a organizações aprovadas. Segundo a Reuters, os dois geram respostas até 30% mais rápido que a geração 5.1 e saem a US$ 8 por milhão de tokens de entrada e US$ 40 de saída, mais baratos que os antecessores. Foi a cartada de produto dez dias antes da estreia na Nasdaq, e oito dias antes de a OpenAI responder com o GPT-6.2.","relevancia":3,"fontes":[{"nome":"The Star (Reuters)","url":"https://www.thestar.com.my/tech/tech-news/2026/11/10/anthropic-unveils-new-fable-mythos-models-as-competition-heats-up-ahead-of-ipo"},{"nome":"Bloomberg Tax","url":"https://news.bloombergtax.com/private-equity/anthropic-unveils-new-fable-mythos-ai-models-ahead-of-ipo"}],"imagem":{"credito":"Software: Anthropic PBC Screenshot: VulcanSphere","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Claude_AI_website_screenshot.webp","legenda":"Captura do site do Claude, da Anthropic (imagem ilustrativa, não dos novos modelos)","arquivo":"img/claude-fable-mythos-5-2.webp","largura":960,"altura":457}},{"id":"macbook-pro-oled-touch","categoria":"tecnologia","data":"2026-10-28","simbolo":"Ol","titulo":"Apple se rende: primeiro MacBook Pro com tela OLED sensível ao toque","resumo":"A Apple anunciou o MacBook Pro com tela PROLED XDR: OLED tandem com até 2.000 nits, touch embutido no painel e Dynamic Island no lugar do notch, num corpo mais fino e leve. Vem com M5 Pro ou M5 Max, custa a partir de US$ 2.899 (14 polegadas) ou US$ 3.399 (16 polegadas) e chegou às lojas em 6/11. Depois de anos resistindo, a Apple finalmente colocou tela touch num Mac.","angulo_quimico":"OLED tandem empilha duas camadas emissoras de semicondutores orgânicos, o que dá mais brilho e vida útil ao painel: química orgânica de materiais virando produto de consumo.","relevancia":3,"fontes":[{"nome":"MacRumors","url":"https://macrumors.com/2026/10/28/apple-new-macbook-pro/"},{"nome":"PetaPixel","url":"https://petapixel.com/2026/10/28/apple-unveils-its-first-ever-macbook-pro-with-a-touchscreen-oled/"}],"imagem":{"credito":"Premeditated","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:MacBook_Pro_16_(M1_Pro,_2021)_-_Wikipedia.jpg","legenda":"MacBook Pro de 16 polegadas (modelo 2021, foto ilustrativa; o novo OLED é outro)","arquivo":"img/macbook-pro-oled-touch.webp","largura":960,"altura":720}},{"id":"apagoes-microsoft-365","categoria":"tecnologia","data":"2026-11-12","simbolo":"Ms","titulo":"Semana dos apagões: Microsoft 365 fica fora do ar por quase um dia","resumo":"Outlook, Teams, SharePoint e Copilot caíram no mundo todo em 12/11; a Microsoft culpou um problema de uma atualização anterior de capacidade de rede, descartou ataque hacker e passou de 23 horas sem normalizar tudo. Na mesma semana, a FAA parou voos nos EUA por pane em equipamento de telecom (13/11), a AWS teve falhas na região US-East (15/11) e iCloud e Apple Pay caíram por causa de uma atualização interna (17/11). Lembrete de que a nuvem é só o computador de outra pessoa, e às vezes ele trava.","relevancia":3,"fontes":[{"nome":"BleepingComputer","url":"https://bleepingcomputer.com/news/microsoft/massive-microsoft-365-outage-disrupts-outlook-teams-copilot-worldwide"},{"nome":"IBTimes UK","url":"https://www.ibtimes.co.uk/us-businesses-hit-cyber-incidents-outages-1832974"}],"imagem":{"credito":"Coolcaesar","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Building92microsoft.jpg","legenda":"Sede da Microsoft, em Redmond, nos EUA (foto de arquivo)","arquivo":"img/apagoes-microsoft-365.webp","largura":960,"altura":640}},{"id":"ibm-quantum-nighthawk","categoria":"tecnologia","data":"2026-11-06","simbolo":"Qb","titulo":"IBM liga computador quântico em Chicago e mira sistema de 1.040 qubits","resumo":"A IBM inaugurou um Quantum System Two na Universidade de Chicago, com o processador Nighthawk r2 de 120 qubits, seu primeiro computador quântico em Illinois. Na conferência de desenvolvedores, em meados de novembro, mostrou o Nighthawk r3 para 2027 (mais de 520 qubits) e o plano de ligar dois deles num sistema de 1.040 qubits, rumo ao Starling, máquina tolerante a falhas com 200 qubits lógicos prevista para 2029. A estratégia agora é modular: juntar chips menores em vez de construir um monstro único.","angulo_quimico":"Simular moléculas e reações é uma das aplicações mais esperadas da computação quântica; e o Nighthawk r3 vai ser fabricado na fundição de wafers supercondutores de 300 mm da IBM em Albany.","relevancia":3,"fontes":[{"nome":"Quantum Zeitgeist","url":"https://www.quantumzeitgeist.com/ibm-quantum-system-two-chicago-computer/"},{"nome":"The Next Platform","url":"https://www.nextplatform.com/compute/2026/11/17/ibm-links-two-nighthawk-r3-chips-to-make-a-1040-qubit-quantum-system/5310545"}],"imagem":{"credito":"Irekia / Eusko Jaurlaritza","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:IBM_Q_System_Two_Ikerbasque_03.jpg","legenda":"IBM Quantum System Two, instalado em San Sebastián, na Espanha (não é o de Chicago)","arquivo":"img/ibm-quantum-nighthawk.webp","largura":960,"altura":578}},{"id":"gemini-controla-mac","categoria":"tecnologia","data":"2026-11-19","simbolo":"Ge","titulo":"Gemini agora mexe no seu Mac por você","resumo":"O Google liberou o computer use no app do Gemini para Mac: você escreve @Computer use, descreve a tarefa e ele clica, digita, navega em menus e preenche formulários em apps e sites, numa janela isolada em segundo plano enquanto você continua usando a máquina. Por enquanto só nos EUA, em inglês, para assinantes AI Plus, Pro e Ultra com Mac Apple Silicon. É a corrida dos agentes saindo da caixa de chat e indo para o desktop.","relevancia":3,"fontes":[{"nome":"Google (blog oficial)","url":"https://blog.google/innovation-and-ai/products/gemini-app/computer-use-mac/"},{"nome":"MacRumors","url":"https://macrumors.com/2026/11/19/google-gemini-mac-app-control"}],"imagem":{"credito":"Padgriffin","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:MacBook_Air_M1.png","legenda":"MacBook Air com chip M1 (foto ilustrativa de um Mac)","arquivo":"img/gemini-controla-mac.webp","largura":960,"altura":774}},{"id":"apple-recorde-ternus","categoria":"tecnologia","data":"2026-11-02","simbolo":"Ap","titulo":"Apple bate recorde no primeiro balanço de John Ternus como CEO","resumo":"A Apple reportou receita de US$ 114,5 bilhões no trimestre de setembro (+12%), com iPhone a US$ 57,6 bi (+17%, recorde para o período), Mac subindo 24% e serviços em recorde de US$ 31,6 bi. Foi a estreia de Ternus, que substituiu Tim Cook em setembro, na divulgação de resultados; ele chamou o iPhone Duo, o dobrável lançado em outubro, de o iPhone mais transformador desde o original.","relevancia":2,"fontes":[{"nome":"iPhone in Canada","url":"https://www.iphoneincanada.ca/2026/11/02/apple-record-revenue-john-ternus-first-report-ceo/"},{"nome":"iDrop News","url":"https://idropnews.com/news/apple-q4-2026-financial-results-iphone-mac-growth/270514/"}],"imagem":{"credito":"Arne Müseler","licenca":"CC BY-SA 3.0 de","fonte":"https://commons.wikimedia.org/wiki/File:Apple_park_cupertino_2019.jpg","legenda":"Vista aérea do Apple Park, sede da Apple, em Cupertino (foto de arquivo)","arquivo":"img/apple-recorde-ternus.webp","largura":960,"altura":539}},{"id":"microsoft-ignite-agentes","categoria":"tecnologia","data":"2026-11-17","simbolo":"Ig","titulo":"Microsoft Ignite: a nova aposta é dar crachá e chefe para agentes de IA","resumo":"Na Ignite, aberta em 17/11 em San Francisco, a Microsoft lançou o Agent 365, para gerenciar e controlar os agentes de IA dentro das empresas, e liberou o Entra Agent Identity, que dá identidade própria a cada agente. Também anunciou máquinas virtuais com o chip Cobalt 200 (até 50% mais desempenho de CPU, segundo ela) e o banco de dados HorizonDB. A mensagem: agentes vão trabalhar ao lado das equipes, e alguém precisa fazer o papel de RH deles.","relevancia":2,"fontes":[{"nome":"TechRepublic","url":"https://www.techrepublic.com/article/news-microsoft-ignite-2026-announcements/"},{"nome":"Redmond Channel Partner","url":"https://rcpmag.com/articles/2026/11/17/microsoft-ignite-2026-nadella-makes-the-case.aspx"}],"imagem":{"credito":"Brian Smale and Microsoft","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Satya_smiling-print.jpg","legenda":"Satya Nadella, CEO da Microsoft (foto de arquivo)","arquivo":"img/microsoft-ignite-agentes.webp","largura":960,"altura":640}},{"id":"tesla-robotaxi-san-antonio","categoria":"tecnologia","data":"2026-11-09","simbolo":"Rt","titulo":"Robotáxi da Tesla sem ninguém ao volante chega à 8ª cidade","resumo":"A Tesla começou corridas sem supervisão em San Antonio, seu oitavo mercado nos EUA (cinco cidades no Texas e três na Flórida), e ampliou a área atendida em Austin para cerca de 443 milhas quadradas. O porém de sempre: a frota não é divulgada, e rastreadores estimaram só uns sete carros na cidade no primeiro dia, enquanto a Waymo, que abriu serviço em San Antonio em outubro, segue bem à frente em escala.","relevancia":2,"fontes":[{"nome":"GCN","url":"https://gcn.com/?p=23199"},{"nome":"GCN (expansão da Waymo)","url":"https://gcn.com/waymo-expands-driverless-service-five-cities/22846/"}],"imagem":{"credito":"Alexander Migl","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Tesla_Model_Y_1X7A6211.jpg","legenda":"Tesla Model Y, o modelo usado nos robotáxis da empresa (foto ilustrativa)","arquivo":"img/tesla-robotaxi-san-antonio.webp","largura":960,"altura":519}},{"id":"pentagono-ufo-lote-8","categoria":"misterios","data":"2026-11-20","simbolo":"Ua","titulo":"Pentágono solta o 8º lote de arquivos de OVNI, com direito a plano de 'cofre' para tecido","resumo":"O Departamento de Guerra (o novo nome do Pentágono) publicou o oitavo lote do PURSUE, o programa de liberação de arquivos de UAP: dezenas de documentos, imagens e vídeos. Os destaques são um clipe infravermelho de 20 segundos, gravado por um navio no Oriente Médio em 2020, em que uma luz circular passa pelo navio; um relatório de 1953 do lendário engenheiro da Lockheed Kelly Johnson sobre um disco azul-escuro; e o plano de uma instalação subterrânea para guardar 'material exótico ou tecido'.","teoria":"Pra turma da divulgação, um projeto de bunker pra guardar 'tecido' é a prova de que o governo tem (ou esperava ter) material biológico não humano. O conta-gotas mensal de arquivos seria uma 'aclimatação' do público antes da grande revelação.","fatos":"Não existe registro de que a instalação tenha sido construída. O Pentágono disse que 'não vai fazer nenhum comentário ou avaliação sobre os arquivos' e deixou o público tirar as próprias conclusões, mas repete que muitos avistamentos têm explicação banal, como aeronave confundida ou artefato de câmera. O porta-voz Sean Parnell disse que mais arquivos vão sair 'de forma contínua'.","relevancia":5,"fontes":[{"nome":"Euronews","url":"https://www.euronews.com/video/2026/11/21/pentagon-declassifies-new-ufo-footage-filmed-by-us-military"},{"nome":"UNILAD","url":"https://www.unilad.com/news/us-news/pentagon-new-ufo-footage-477389-20261121"},{"nome":"iHeart","url":"https://www.iheart.com/content/2026-11-20-pentagon-publishes-more-ufo-files-amid-growing-public-curiosity/"}],"nome":"Arquivos OVNI","imagem":{"credito":"\"DoD photo by Master Sgt. Ken Hammond, U.S. Air Force.\"","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:The_Pentagon_US_Department_of_Defense_building.jpg","legenda":"O Pentágono, sede do Departamento de Defesa dos EUA (foto de arquivo)","arquivo":"img/pentagono-ufo-lote-8.webp","largura":960,"altura":606}},{"id":"ky26-sonda-sovietica","categoria":"misterios","data":"2026-11-15","simbolo":"Ph","titulo":"Avi Loeb x chefe da NASA: a 'rocha' 1998 KY26 seria uma sonda soviética perdida?","resumo":"O 1998 KY26 é um objeto próximo da Terra com uns 11 metros, e ele acelera de um jeito que a gravidade sozinha não explica. Avi Loeb e colegas testaram a hipótese de que ele seja a Phobos 1, sonda soviética que perdeu contato a caminho de Marte em 1988. O administrador da NASA, Jared Isaacman, rebateu na TV.","teoria":"Pra Loeb, o objeto 'não é um asteroide'. A trajetória bate com a da missão, ele é muito refletivo, gira uma vez a cada uns 5 minutos, e a luz do Sol batendo num casco de nave explicaria o empurrão extra. Ou seja: lixo espacial humano disfarçado de rocha.","fatos":"Isaacman disse que não viu nenhuma evidência de que seja outra coisa além de um asteroide. A NASA citou um estudo de 2025 do seu centro de objetos próximos da Terra que explica a trajetória pela radiação solar agindo num corpo de formato irregular, sem atividade de cometa escondida. O próprio Loeb admite que é hipótese não comprovada: a sonda japonesa Hayabusa2 chega ao KY26 em 2031, e se for rocha ou gelo, ele mesmo diz que a teoria acabou. Plot twist: dois dias depois, a JAXA anunciou que a Hayabusa2 não vai mais ao KY26 (veja em Espaço), então o teste definitivo ficou sem data.","angulo_quimico":"A alternativa do 'cometa escuro' (gelo sublimando sem cauda visível) também balança: uma pesquisa da Georgia Tech questiona se o objeto conseguiria reter gelo suficiente pra gerar esse empurrão.","relevancia":5,"fontes":[{"nome":"Fox News","url":"https://www.foxnews.com/us/harvard-scientist-pushes-back-nasa-chief-mystery-space-object-not-asteroid.print"}],"nome":"KY26: sonda?","imagem":{"credito":"NASA / JPL / NASA/JPL-Caltech/NRAO","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA19644","legenda":"Radar mostra outro asteroide próximo da Terra (2011 UW158), só para ilustrar","arquivo":"img/ky26-sonda-sovietica.webp","largura":593,"altura":717}},{"id":"drones-lakenheath","categoria":"misterios","data":"2026-11-13","simbolo":"Dr","titulo":"Sirenes e ordem de abrigo: drones não identificados sobre base dos EUA na Inglaterra","resumo":"Na noite de 13/11, um alarme soou na RAF Lakenheath, a maior base da Força Aérea dos EUA no Reino Unido, e o pessoal recebeu ordem de se abrigar. A USAF confirmou que a segurança da base respondeu a 'suspeita de atividade não autorizada de drones'.","teoria":"Nas redes, virou reprise da onda de 'drones misteriosos' de 2024, que também passou por Lakenheath: objetos que ninguém derruba, ninguém identifica e ninguém explica. Logo, UAP.","fatos":"Número, tipo e operadores dos drones não foram divulgados. A USAF disse que nenhuma pessoa, aeronave ou estrutura foi afetada, e o Ministério da Defesa britânico deu o caso por resolvido. O contexto aponta pra uma ameaça bem terrestre: dias antes, as bases tinham subido o alerta para FPCON Charlie e tirado aviões-tanque de Mildenhall, e o Wall Street Journal ligou essas mudanças a uma ameaça iraniana (segundo a Newsweek). Quanto a 2024, registros policiais obtidos via lei de acesso mostram patrulhas anotando que não conseguiram localizar os drones 'nem saber se eram drones'.","relevancia":4,"fontes":[{"nome":"The Aviationist","url":"https://theaviationist.com/2026/11/13/raf-lakenheath-sounds-alarm-drone-activity/"},{"nome":"Newsweek","url":"https://newsweek.com/us-air-force-responds-to-drone-activity-at-base-in-uk-after-iran-threat-12713848"},{"nome":"sUAS News","url":"https://www.suasnews.com/2026/11/seven-drones-five-drones-and-not-one-confirmed-the-lakenheath-drone-panic/"}],"nome":"Drones na base","imagem":{"credito":"US Air Force from USA Tech. Sgt. Matthew Plew/48th Fighter Wing Public Affairs","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:F-35A_Lightning_II%27s_land_at_Royal_Air_Force_Lakenheath_(33333775974).jpg","legenda":"Caças F-35A pousam na base RAF Lakenheath, na Inglaterra (foto de arquivo)","arquivo":"img/drones-lakenheath.webp","largura":960,"altura":641}},{"id":"apagao-17-novembro","categoria":"misterios","data":"2026-11-17","simbolo":"Ap","titulo":"O 'apagão mundial de 90 dias' de 17/11 que nunca veio","resumo":"Viralizou no mundo todo, Brasil incluso, que em 17 de novembro o planeta ia ficar sem luz, internet e bancos por até 90 dias. Teve até 'previsão' dos Simpsons e vídeo do Trump anunciando o apagão.","teoria":"Um teste de alerta nos EUA seria o ensaio de um ciberataque planejado contra os bancos (contas de cripto aproveitaram pra mandar todo mundo sacar a poupança e comprar moeda digital). A 'profecia' estaria num episódio de 2023 dos Simpsons em que Springfield fica no escuro num 17 de novembro.","fatos":"A data veio de um teste nacional de rotina do Sistema de Alerta de Emergência (FEMA/FCC), às 14h20 no horário de Nova York, com cerca de 1 minuto de interrupção só em TV e rádio. Os '90 dias' são uma distorção do programa FORTRESS America, do Pentágono, que quer que as bases militares consigam funcionar 90 dias fora da rede elétrica civil. O blecaute dos Simpsons é causado por uma tempestade e não cita 2026. O PolitiFact classificou o boato como falso, e o vídeo do Trump é manipulado: o original, de 9 de novembro, não tinha anúncio nenhum.","relevancia":4,"fontes":[{"nome":"France 24","url":"https://www.france24.com/en/tv-shows/truth-or-fake/20261116-november-17-blackout-hoax-how-a-conspiracy-theory-went-viral-around-the-world"},{"nome":"Spotmedia","url":"https://spotmedia.ro/en/news/news/november-17-blackout-the-viral-conspiracy-the-real-story-and-how-the-rumor-began"},{"nome":"The American Bazaar","url":"https://americanbazaaronline.com/2026/11/17/digital-apocalypse-november-17-us-blackout-rumors-492530/"},{"nome":"Concursos no Brasil","url":"https://concursosnobrasil.com/noticia/2026/11/14/apagao-mundial-do-dia-17-11-veja-o-que-a-ciencia-diz-sobre-o-boato/"}],"nome":"Apagão fake","imagem":{"credito":"NASA / JSC","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/iss025e015176","legenda":"A Terra à noite vista da Estação Espacial Internacional (foto de arquivo)","arquivo":"img/apagao-17-novembro.webp","largura":960,"altura":657}},{"id":"epstein-relatorio-camara","categoria":"misterios","data":"2026-11-10","simbolo":"Ep","titulo":"Caso Epstein: comissão republicana diz que governo escondeu nomes de supostos cúmplices","resumo":"A Comissão de Supervisão da Câmara dos EUA, de maioria republicana, soltou um relatório de 137 páginas criticando duramente o governo Trump e o Departamento de Justiça pelo jeito como liberaram milhões de páginas dos arquivos de Jeffrey Epstein.","teoria":"É o combustível perfeito pra tese do acobertamento: se até os aliados do governo admitem que nomes de supostos cúmplices foram tarjados, a tal 'lista' de poderosos estaria sendo protegida.","fatos":"O relatório diz que o governo perdeu prazos de divulgação, escondeu nomes de supostos cúmplices e errou nas duas pontas: algumas tarjas falharam e expuseram dados das vítimas, outras foram exageradas e ocultaram gente do círculo de Epstein. O mesmo documento afirma que depoimentos confirmaram que Trump não se envolveu na condução das investigações criminais. Os democratas acusam os republicanos de blindar gente bem conectada, e o tema virou munição nas campanhas das eleições de meio de mandato.","relevancia":4,"fontes":[{"nome":"Associated Press (via MyNorthwest)","url":"https://mynorthwest.com/?p=4297879"}]},{"id":"semana-das-panes","categoria":"misterios","data":"2026-11-13","simbolo":"Pn","titulo":"Microsoft, FAA e bancos caem na mesma semana: ataque coordenado?","resumo":"Em poucos dias caíram serviços do Microsoft 365 (12/11), a FAA parou o tráfego aéreo dos EUA por problemas de telecomunicação (13/11), e clientes de JPMorgan Chase, Bank of America, Wells Fargo e U.S. Bank tiveram problemas no banco online (16/11).","teoria":"Pra muita gente era o 'aquecimento' do apagão de 17/11: um ciberataque coordenado, talvez feito com IA, testando a infraestrutura antes do grande desligamento.","fatos":"A FAA disse que 17 dos 22 centros regionais de controle de tráfego foram afetados, e cerca de 12.462 voos foram cancelados (nem todos por causa da parada). A pane foi atribuída a problemas em equipamentos legados de telecomunicação e a uma atualização tecnológica que falhou, não a um ataque. O JPMorgan culpou um bug de software e disse não ver sinal de ciberataque. Até o secretário de Segurança Interna especulou que a IA pode ter contribuído, mas admitiu que não sabia a causa e que não via evidência de ataque coordenado.","relevancia":3,"fontes":[{"nome":"The American Bazaar","url":"https://americanbazaaronline.com/2026/11/17/digital-apocalypse-november-17-us-blackout-rumors-492530/"},{"nome":"France 24","url":"https://www.france24.com/en/tv-shows/truth-or-fake/20261116-november-17-blackout-hoax-how-a-conspiracy-theory-went-viral-around-the-world"}],"imagem":{"credito":"BalticServers.com","licenca":"CC BY-SA 3.0","fonte":"https://commons.wikimedia.org/wiki/File:BalticServers_data_center.jpg","legenda":"Sala de servidores de um data center (imagem ilustrativa)","arquivo":"img/semana-das-panes.webp","largura":960,"altura":637}},{"id":"tribunal-secreto-702","categoria":"misterios","data":"2026-10-29","simbolo":"Fi","titulo":"A decisão secreta sobre espionagem de americanos que o governo não publica","resumo":"Os senadores Ron Wyden e Adam Schiff acusam o governo de segurar ilegalmente uma decisão de 17/3/2026 do tribunal secreto de vigilância (FISC) sobre buscas em dados coletados pela Seção 702. O prazo legal de 180 dias pra liberar uma versão pública venceu em 13/9, e eles deram até 6/11 pra o governo se explicar.","teoria":"Aqui a 'teoria' de que as agências vasculham comunicações de cidadãos sem o devido controle não é tão teoria assim. E o sigilo alimenta a suspeita de que tem coisa pior escondida.","fatos":"Segundo a WIRED (citada pelo YourNews), a corte concluiu que ferramentas usadas pra achar comunicações de americanos, como um 'filtro de participantes' do FBI, violavam as regras, porque essas buscas podiam nem ser registradas como buscas. Um relato no Just Security diz que consultas do FBI, da CIA e da NSA escaparam de auditoria. A Seção 702 expirou em junho, mas a coleta continua até março de 2027 com base numa autorização da própria corte. Não achei registro de que a decisão tenha sido publicada depois do prazo de 6/11.","relevancia":3,"fontes":[{"nome":"YourNews","url":"https://yournews.com/2026/10/29/7243660/senators-accuse-trump-administration-of-illegally-withholding-fisa-court-ruling/"},{"nome":"State of Surveillance","url":"https://stateofsurveillance.org/news/2026-11-01-weekly-surveillance-roundup/"}],"imagem":{"credito":"National Security Agency","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:National_Security_Agency_headquarters,_Fort_Meade,_Maryland.jpg","legenda":"Sede da NSA em Fort Meade, Maryland (foto de arquivo)","arquivo":"img/tribunal-secreto-702.webp","largura":960,"altura":749}},{"id":"gchq-pendrives-sumidos","categoria":"misterios","data":"2026-10-30","simbolo":"Gc","titulo":"Espiões britânicos não sabem onde foram parar 'milhares' de pendrives e HDs","resumo":"O relatório anual do IPCO, órgão que fiscaliza os poderes de investigação no Reino Unido, revelou que o GCHQ (a 'NSA britânica') não consegue localizar até 'milhares' de mídias removíveis: pendrives, HDs externos, CDs e cartões de memória.","teoria":"Material ultrassecreto circulando por aí na mão de sabe-se lá quem, ou um sumiço conveniente de provas.","fatos":"O número é a estimativa do máximo de itens que não puderam ser localizados de imediato, não uma contagem confirmada de perdas, e o GCHQ admite que o sistema de controle dessas mídias 'não era robusto o suficiente'. O IPCO se disse 'muito preocupado' com a demora da investigação. O GCHQ diz que fez uma auditoria completa, mas se recusou a dizer se alguém não autorizado acessou o material.","relevancia":3,"fontes":[{"nome":"The Record","url":"https://therecord.media/gchq-cannot-account-for-thousands-of-data-devices"}],"imagem":{"credito":"User:Matt Crypto","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:GCHQ-doughnut.jpg","legenda":"Maquete da sede do GCHQ, em Cheltenham, conhecida como 'Rosquinha'","arquivo":"img/gchq-pendrives-sumidos.webp","largura":960,"altura":720}},{"id":"stonehenge-pedra-do-altar","categoria":"misterios","data":"2026-11-18","simbolo":"St","titulo":"Stonehenge: a pedra de 6 toneladas continua sem endereço","resumo":"Um novo estudo no Journal of the Geological Society (Universidade de Aberystwyth e Universidade de South Wales) descartou mais alguns candidatos a lugar de origem da Pedra do Altar, o bloco de arenito de umas 6 toneladas e 4,9 m no centro de Stonehenge.","teoria":"Se ela não é do País de Gales e veio de algum canto da Escócia ainda mais longe, como diabos o pessoal do Neolítico arrastou isso? Prato cheio pra 'tecnologia perdida' (e, claro, pros alienígenas).","fatos":"Pesquisas anteriores já tinham derrubado a origem galesa e apontado o nordeste da Escócia, com a bacia Orcadiana como favorita. O novo trabalho comparou a pedra com fragmentos guardados em museus, e nenhuma das localidades examinadas até agora tem a mesma combinação de características. A Escócia continua no páreo; o ponto exato e o método de transporte é que seguem em aberto.","angulo_quimico":"A 'impressão digital' da rocha saiu de composição mineral, química e assinaturas isotópicas: geoquímica de proveniência das boas.","relevancia":3,"fontes":[{"nome":"ScienceDaily","url":"https://www.sciencedaily.com/releases/2026/11/261117033914.htm"}],"imagem":{"credito":"The Stones of Stonehenge","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Stonehenge-Altar-Stone_P1110732.jpg","legenda":"A Pedra do Altar em Stonehenge (foto de arquivo)","arquivo":"img/stonehenge-pedra-do-altar.webp","largura":960,"altura":720}},{"id":"naledi-so-mulheres","categoria":"misterios","data":"2026-11-11","simbolo":"Hn","titulo":"Homo naledi: um 'cemitério' só de mulheres há mais de 240 mil anos?","resumo":"Um estudo na revista Cell analisou proteínas antigas de 23 dentes de pelo menos 20 indivíduos de Homo naledi da caverna Rising Star, na África do Sul, e não achou sinal da amelogenina-Y, uma proteína ligada ao cromossomo Y.","teoria":"Um hominídeo de cérebro pequeno teria mantido uma área de deposição dos mortos só de mulheres, o espaço restrito por sexo mais antigo já atribuído a um parente não sapiens.","fatos":"Ausência de evidência não é prova. Os próprios autores dizem que, numa população isolada, o gene da amelogenina-Y pode ter sofrido mutação ou se perdido, então alguns desses indivíduos poderiam ser homens. E a ideia de que o H. naledi enterrava seus mortos de propósito já é contestada por outros pesquisadores.","angulo_quimico":"Paleoproteômica na veia: peptídeos extraídos do esmalte com um ataque ácido suave, e análise de aminoácidos no laboratório de química de York pra garantir que as proteínas eram antigas e não contaminação moderna.","relevancia":3,"fontes":[{"nome":"ScienceDaily","url":"https://www.sciencedaily.com/releases/2026/11/261110042558.htm"}],"imagem":{"credito":"Lee Roger Berger research team","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Homo_naledi_holotype_specimen_(DH1).jpg","legenda":"Crânio do holótipo de Homo naledi (DH1), encontrado na África do Sul","arquivo":"img/naledi-so-mulheres.webp","largura":960,"altura":731}},{"id":"sinal-k2-155","categoria":"misterios","data":"2026-11-02","simbolo":"Rf","titulo":"O sinal de rádio 'alienígena' de uma super-Terra que quase passou em todos os testes","resumo":"Um time chinês liderado por Zi-Qi Li reanalisou dados do radiotelescópio FAST de 33 sistemas planetários. Um sinal estreitíssimo, batizado de NBS 260108, em 1.148,4167 MHz, sobreviveu aos filtros iniciais, e vinha da anã vermelha K2-155, a 238 anos-luz. O paper saiu em agosto, mas a história voltou a bombar entre outubro e novembro.","teoria":"Banda estreitíssima, aparecendo só no feixe central apontado pra estrela, e vindo de um sistema com uma super-Terra (K2-155 d): é o que todo caçador de tecnoassinaturas sonha em ver.","fatos":"Os próprios autores escrevem que o sinal 'não está confirmado como tecnoassinatura'. A resposta num só canal e sinais parecidos perto de outras três estrelas na mesma noite apontam pra interferência local, de origem terrestre.","relevancia":2,"fontes":[{"nome":"ECOnews","url":"https://www.ecoticias.com/en/?p=53502"}],"imagem":{"credito":"NASA / JPL / NASA/JPL-Caltech","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA22082","legenda":"Ilustração genérica de um exoplaneta gigante, não do K2-155","arquivo":"img/sinal-k2-155.webp","largura":960,"altura":540}},{"id":"abydos-sacrificio","categoria":"misterios","data":"2026-11-13","simbolo":"Eg","titulo":"Os primeiros reis do Egito levavam os servos junto? Crânios reforçam a suspeita","resumo":"Uma pesquisadora da Universidade Purdue reexaminou 46 crânios escavados por Flinders Petrie nos anos 1920 em Abidos, de pessoas enterradas em volta das tumbas dos reis da 1ª Dinastia. Dezoito deles (cerca de 39%) têm fraturas ocorridas por volta da hora da morte.","teoria":"Há mais de um século os arqueólogos suspeitam de 'sacrifício de servos': quando o rei morria, seus assistentes eram mortos e enterrados junto. Petrie tinha atribuído as rachaduras a processos naturais.","fatos":"O estudo, na Frontiers in Environmental Archaeology, reforça a hipótese, e um dos indivíduos tem até um golpe cortante perto do olho. Mas o caso não está fechado: as fraturas lineares não batem com golpes de maça, quedas não podem ser totalmente descartadas, e só os crânios foram examinados, porque os esqueletos foram reenterrados há mais de 100 anos.","relevancia":2,"fontes":[{"nome":"ScienceDaily","url":"https://www.sciencedaily.com/releases/2026/11/261112025540.htm"}],"imagem":{"credito":"vivafox/Francois Galuccio","licenca":"CC BY-SA 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Djer%E2%80%99s_Royal_Bracelet_2018.jpg","legenda":"Pulseira do rei Djer, da 1ª dinastia, achada em Abidos (peça de museu)","arquivo":"img/abydos-sacrificio.webp","largura":960,"altura":468}},{"id":"rock-hall-2026","categoria":"rock","data":"2026-11-14","simbolo":"Hf","titulo":"Iron Maiden finalmente no Rock Hall (e quem tocou foi um supergrupo)","resumo":"A cerimônia do Rock & Roll Hall of Fame rolou em 14/11 em Los Angeles e o Iron Maiden enfim entrou, só que a banda nem foi porque estava em turnê. Quem fez a indução foi o Jack Black, e um supergrupo com Kirk Hammett e Rob Trujillo (Metallica), John 5, Brad Wilk (Rage Against the Machine) e St. Vincent mandou 'The Trooper'. O Phil Collins subiu ao palco de bengala, brincou que 'não está tão mal quanto parece' e disse que ainda dá pra voltar a fazer shows. O Oasis também não apareceu, e o Rick Rubin fez um discurso de uma frase só: 'You can't kill rock 'n' roll'.","ouvir":"The Trooper (Iron Maiden)","relevancia":5,"fontes":[{"nome":"Louder","url":"https://www.loudersound.com/bands-artists/iron-maiden-are-inducted-into-the-rock-and-roll-hall-of-fame-and-a-wild-supergroup-paid-tribute-to-them"},{"nome":"Louder","url":"https://www.loudersound.com/bands-artists/phil-collins-rock-roll-hall-fame-induction-2026"},{"nome":"AP (via Boston 25 News)","url":"https://www.boston25news.com/entertainment/look-rock-roll-hall/QO2ABRE65M6JZHJXGFPSCSHA4I/"}],"nome":"Maiden no Hall","imagem":{"credito":"Mike Lawrence","licenca":"CC BY-SA 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Iron_Maiden_in_Hamburg.jpg","legenda":"Iron Maiden em show em Hamburgo, em 2011 (foto de arquivo)","arquivo":"img/rock-hall-2026.webp","largura":960,"altura":720}},{"id":"grammy-2027-rock","categoria":"rock","data":"2026-11-16","simbolo":"Gr","titulo":"Grammy 2027: Foo Fighters, Stones, Muse e Megadeth na briga","resumo":"Saíram as indicações do Grammy 2027. Concorrem a Melhor Álbum de Rock o Foo Fighters ('Your Favorite Toy'), os Rolling Stones ('Foreign Tongues'), o Muse ('The Wow! Signal'), o Jack White ('Frozen Charlotte') e o Angine de Poitrine ('Vol. II'). No metal disputam Megadeth ('Let There Be Shred'), Mastodon, Anthrax, Knocked Loose com Denzel Curry e o trio Poppy, Amy Lee e Courtney LaPlante. Teve até Robert Smith (The Cure) indicado em parceria com a Olivia Rodrigo. A cerimônia é em 7 de fevereiro de 2027, em Los Angeles.","ouvir":"The Wow! Signal (Muse)","angulo_quimico":"O nome do disco do Muse é o mesmo do famoso sinal Wow!, captado em 1977 por um radiotelescópio de Ohio. Ele veio pertinho de 1420 MHz, a 'linha do hidrogênio': a frequência que o átomo de hidrogênio neutro emite quando o spin do elétron se inverte em relação ao do próton. Como o hidrogênio é o elemento mais abundante do universo, os caçadores de ETs apostavam justamente nessa frequência.","relevancia":5,"fontes":[{"nome":"Louder","url":"https://www.loudersound.com/music-industry/award-shows/2027-grammy-nominations-rock-metal"},{"nome":"Metal Injection","url":"https://metalinjection.net/news/2027-grammy-nominees-rock-metal-alternative"},{"nome":"Loudwire","url":"https://loudwire.com/fans-react-2027-rock-metal-alternative-grammy-nominees/"}],"nome":"Grammy 2027","imagem":{"credito":"Jo","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Foo_Fighters_Live_21.jpg","legenda":"Foo Fighters em show (foto de arquivo)","arquivo":"img/grammy-2027-rock.webp","largura":960,"altura":655}},{"id":"sepultura-ultimo-show","categoria":"rock","data":"2026-11-07","simbolo":"Sp","titulo":"Fim de uma era: o Sepultura fez seu último show, em São Paulo","resumo":"Em 7/11 o Sepultura se despediu no Suhai Music Hall, em SP, para umas 9 mil pessoas. O show tinha sido marcado para o Pacaembu (cerca de 26 mil lugares), mas foi transferido em setembro. Foram 30 músicas em quase três horas, com raridades e convidados como Jairo Guedz, João Gordo e o Ratos de Porão, Moyses Kolesne (Krisiun) e Yohan, filho do Andreas Kisser. Max e Iggor Cavalera recusaram o convite, e o bis fechou com 'Ratamahatta' e 'Roots Bloody Roots'.","ouvir":"Roots Bloody Roots (Sepultura)","relevancia":5,"fontes":[{"nome":"Louder","url":"https://www.loudersound.com/bands-artists/this-is-the-epic-setlist-from-sepulturas-emotional-fina-show"},{"nome":"Blabbermouth","url":"https://blabbermouth.net/news/watch-sepultura-plays-final-concert-in-sao-paulo-brazil"},{"nome":"Loudwire","url":"https://loudwire.com/sepultura-final-show-setlist-video/"}],"nome":"Adeus, Sepultura","imagem":{"credito":"Nenea hartia","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Sepultura_-_Rockstadt_Extreme_Fest_2025_(03.08.2025).01.jpg","legenda":"Sepultura em show na Romênia, em agosto de 2025 (foto de arquivo)","arquivo":"img/sepultura-ultimo-show.webp","largura":960,"altura":720}},{"id":"u2-carnaval-de-luz","categoria":"rock","data":"2026-11-13","simbolo":"Cl","titulo":"U2 lança 'Carnaval De Luz' e a crítica fala em clima de Achtung Baby","resumo":"O U2 lançou em 13/11 o 16º álbum, 'Carnaval De Luz', que fecha uma trilogia iniciada com dois EPs lançados em 2026. A Riff deu 9/10 e comparou o disco a 'Achtung Baby', e a NPR disse que é o álbum que deixa o U2 admirável de novo, mesmo que não exatamente 'cool'. Tem Brian Eno no synth da faixa de abertura, participação da Rosalía e um dueto do Bono com a Dolly Parton em 'Torn'.","ouvir":"The Greatest Show on Earth (U2)","relevancia":4,"fontes":[{"nome":"Riff Magazine","url":"https://riffmagazine.com/album-reviews/u2-carnaval-de-luz/"},{"nome":"Ultimate Classic Rock","url":"https://ultimateclassicrock.com/u2-carnaval-de-luz-album/"},{"nome":"NPR (via KUOW)","url":"https://www.kuow.org/npr-news/2026-11-14/men-on-a-mission-u2-is-back-again-are-they-cool-this-time"}],"imagem":{"credito":"Blackcat","licenca":"CC BY-SA 3.0","fonte":"https://commons.wikimedia.org/wiki/File:2010-10-08_U2_Live_at_Stadio_Olimpico_Rome_1.jpg","legenda":"U2 em show no Estádio Olímpico de Roma, em 2010 (foto de arquivo)","arquivo":"img/u2-carnaval-de-luz.webp","largura":960,"altura":720}},{"id":"gta6-radio-metal","categoria":"rock","data":"2026-11-19","simbolo":"Rd","titulo":"GTA VI chegou com rádio de metal comandada pelo Slayer","resumo":"Junto com o lançamento de GTA VI veio a The Chamber 106.6, a primeira rádio só de metal da série, com Tom Araya e Kerry King (Slayer) de locutores. Na playlist tem 'Master of Puppets', 'Raining Blood', 'Sober' (Tool), 'Sugar' (System of a Down) e até 'Territory', do Sepultura. O Power Trip lançou uma faixa nova, 'Mutual Death Warrant', que por enquanto só dá pra ouvir dentro do jogo. A V-Rock completa com Van Halen, Mötley Crüe e KISS.","ouvir":"Mutual Death Warrant (Power Trip), só dentro do jogo na The Chamber 106.6","relevancia":4,"fontes":[{"nome":"Louder","url":"https://www.loudersound.com/culture/gaming/grand-theft-auto-vi-soundtrack"},{"nome":"Louder / Metal Hammer","url":"https://www.loudersound.com/music/tracks-singles/power-trip-new-track-mutual-death-warrant-grand-theft-auto-vi"}],"imagem":{"credito":"Factor Metal","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Slayer_@_Bogot%C3%A1_2017_(33682186503).jpg","legenda":"Slayer em show em Bogotá, em 2017 (foto de arquivo)","arquivo":"img/gta6-radio-metal.webp","largura":960,"altura":640}},{"id":"mcr-black-parade-numero-um","categoria":"rock","data":"2026-11-09","simbolo":"Mc","titulo":"20 anos depois, 'The Black Parade' vira o 1º número 1 do MCR nos EUA","resumo":"A reedição de 20 anos de 'The Black Parade', com seis faixas extras, pulou do 139º para o 1º lugar da Billboard 200 com 78 mil unidades, desbancando a Olivia Rodrigo. Em 2006 o disco tinha parado no 2º lugar, então esse é o primeiro número 1 da história do My Chemical Romance nos EUA. A banda também confirmou que trabalha em 2027 num sucessor de 'Danger Days'.","ouvir":"Welcome to the Black Parade (My Chemical Romance)","relevancia":4,"fontes":[{"nome":"Louder","url":"https://www.loudersound.com/bands-artists/my-chemical-romance-score-first-us-number-one-album"},{"nome":"Louder","url":"https://www.loudersound.com/bands-artists/my-chemical-romance-to-work-on-album-2027"}],"imagem":{"credito":"Hullian111","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:My_Chemical_Romance_@_Wembley_Stadium,_11_July_2026_B-Stage_13.jpg","legenda":"My Chemical Romance toca 'The Black Parade' em Wembley, em julho de 2026","arquivo":"img/mcr-black-parade-numero-um.webp","largura":960,"altura":720}},{"id":"slipknot-eloy-casagrande","categoria":"rock","data":"2026-10-29","simbolo":"Sk","titulo":"Brasileiro Eloy Casagrande termina a bateria do novo disco do Slipknot","resumo":"Eloy Casagrande, ex-Sepultura, terminou de gravar a bateria do 8º álbum do Slipknot, o primeiro dele na banda. Depois o Clown contou que tem tanta música pronta que daria um disco duplo. Já a turnê de 2027 virou polêmica: uma petição para tirar o Marilyn Manson da abertura em Wembley passou de 20 mil assinaturas.","ouvir":"Arsenal (Slipknot)","relevancia":4,"fontes":[{"nome":"Louder","url":"https://www.loudersound.com/news/eloy-casagrande-finished-recording-slipknot-drums-2026"},{"nome":"Louder","url":"https://www.loudersound.com/bands-artists/weve-written-so-many-songs-we-could-have-a-double-album-slipknots-clown-gives-an-update-on-their-new-music"},{"nome":"Louder","url":"https://www.loudersound.com/news/marilyn-manson-petition-drop-from-slipknot-wembley-concert-launched-2026"}],"imagem":{"credito":"Doomed Shadow","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Slipknot_performing_live_in_the_O2_Arena_on_December_21,_2024_-_Pic_1.jpg","legenda":"Slipknot em show na O2 Arena, em Londres, em dezembro de 2024 (foto de arquivo)","arquivo":"img/slipknot-eloy-casagrande.webp","largura":960,"altura":712}},{"id":"faith-no-more-brasil-2027","categoria":"rock","data":"2026-11-17","simbolo":"Fm","titulo":"Faith No More volta ao Brasil com Alice in Chains e Mastodon","resumo":"O Faith No More anunciou dois shows próprios no Brasil em 2027: 29/10 no Nubank Parque (SP) e 31/10 na Arena da Baixada (Curitiba), com Alice in Chains e Mastodon na abertura. A venda geral abriu em 19/11 pela Eventim. Isso fora o show já marcado com o System of a Down no Maracanã em 15/01/2027. A última vinda da banda tinha sido em 2015, e o guitarrista Trey Spruance volta à formação.","ouvir":"Epic (Faith No More)","relevancia":4,"fontes":[{"nome":"Rolling Stone Brasil","url":"https://rollingstone.com.br/?p=329228"},{"nome":"Tribuna PR","url":"https://www.tribunapr.com.br/viva/faith-no-more-anuncia-show-em-curitiba-com-alice-in-chains-mastodon-em-2027/"},{"nome":"Billboard Brasil","url":"https://billboard.com.br/system-of-a-down-anuncia-show-unico-no-maracana/"}],"imagem":{"credito":"Jose Rubio","licenca":"CC BY-SA 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Faith_No_More_2009.jpg","legenda":"Faith No More em show no Festival Sudoeste, em Portugal, em 2009 (foto de arquivo)","arquivo":"img/faith-no-more-brasil-2027.webp","largura":960,"altura":431}},{"id":"sp-vedder-ronnie-wood","categoria":"rock","data":"2026-11-20","simbolo":"Ev","titulo":"Eddie Vedder, Roger Daltrey e Ronnie Wood passaram por SP","resumo":"O Best of Blues and Rock ocupou o Parque Ibirapuera de 20 a 22/11, com Eddie Vedder em duas noites esgotadas (20/11 e hoje, 22/11) e Roger Daltrey, do The Who, no dia 21. Antes disso, em 1º/11, o Ronnie Wood, dos Rolling Stones, fez um show solo único no Brasil, no Espaço Unimed, com a Imelda May no palco.","ouvir":"Society (Eddie Vedder)","relevancia":4,"fontes":[{"nome":"The Rio Times","url":"https://www.riotimesonline.com/best-of-blues-and-rock-2026-sao-paulo-brazil-ibirapuera-november-20-22-eddie-vedder-roger-daltrey/"},{"nome":"Folha de Pernambuco","url":"https://www.folhape.com.br/cultura/ronnie-wood-rolling-stones-show-brasil/502887/"}],"imagem":{"credito":"José Luiz Filho (User:JoseLuizFilho)","licenca":"CC BY-SA 3.0","fonte":"https://commons.wikimedia.org/wiki/File:Eddie_Vedder_2._Pearl_Jam_live_at_Sao_Paulo.jpg","legenda":"Eddie Vedder, do Pearl Jam, em show no Pacaembu, em São Paulo (foto de arquivo)","arquivo":"img/sp-vedder-ronnie-wood.webp","largura":500,"altura":375}},{"id":"bruce-dickinson-psychogod","categoria":"rock","data":"2026-11-18","simbolo":"Bd","titulo":"Bruce Dickinson anuncia 'Psychogod', disco inspirado em Blake e Crowley","resumo":"O vocalista do Iron Maiden confirmou o novo solo, 'Psychogod', para 12 de março de 2027, e soltou o primeiro single, 'Speaking In Tongues'. O álbum mistura William Blake, o ocultista Aleister Crowley e mitologia em cinco histórias interligadas. Foi gravado ao vivo no Studio 606, do Dave Grohl, e teria participação de membros do Sepultura e do Devin Townsend.","ouvir":"Speaking In Tongues (Bruce Dickinson)","relevancia":3,"fontes":[{"nome":"Louder","url":"https://www.loudersound.com/news/iron-maiden-bruce-dickinson-details-psychogod-solo-album-2026"}],"imagem":{"credito":"Dario De Marco","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Bruce_Dickinson_-_The_Mandrake_Project_(12)_(53817871253).jpg","legenda":"Bruce Dickinson em show do The Mandrake Project, na Suíça, em 2023 (foto de arquivo)","arquivo":"img/bruce-dickinson-psychogod.webp","largura":960,"altura":641}},{"id":"sphere-metallica-rush","categoria":"rock","data":"2026-11-22","simbolo":"Mt","titulo":"A Sphere de Vegas virou templo do rock: Metallica doa US$ 200 mil e Rush chega","resumo":"O Metallica, primeira banda de metal a tocar na Sphere de Las Vegas, fechou a primeira leva da residência 'Life Burns Faster' e doou US$ 200 mil para duas ONGs locais, uma de apoio a vítimas de violência doméstica e outra de alimentação. Na mesma onda, o Rush anunciou cinco datas na Sphere e, dias depois, acrescentou mais cinco.","ouvir":"Battery (Metallica)","relevancia":3,"fontes":[{"nome":"Louder","url":"https://www.loudersound.com/bands-artists/metallica-give-200000-dollars-to-charities-following-las-vegas-residency"},{"nome":"Guitar World","url":"https://www.guitarworld.com/artists/bands/metallica-las-vegas-sphere-opening-night"},{"nome":"Louder","url":"https://www.loudersound.com/bands-artists/rush-las-vegas-sphere"}],"imagem":{"credito":"Jeffrey Hayes","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Las_Vegas_2025_(54832105594).jpg","legenda":"A Sphere, em Las Vegas, em 2025 (foto de arquivo)","arquivo":"img/sphere-metallica-rush.webp","largura":960,"altura":720}},{"id":"ghost-mary-bilhao","categoria":"rock","data":"2026-11-05","simbolo":"Gh","titulo":"'Mary On A Cross', do Ghost, passa de 1 bilhão de plays no Spotify","resumo":"A música que era só um lado B de 2019, sem clipe nem lançamento próprio, bateu 1 bilhão de streams no Spotify depois de viralizar no TikTok. Pra ter ideia, a segunda do Ghost mais ouvida lá, 'Square Hammer', está em 299 milhões.","ouvir":"Mary On A Cross (Ghost)","relevancia":3,"fontes":[{"nome":"Louder / Metal Hammer","url":"https://www.loudersound.com/news/ghost-mary-on-a-cross-streamed-one-billion-times-2026"}],"imagem":{"credito":"MatthewHoobin","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Ghost_performing_%22Faith%22_during_Imperatour_at_Yuengling_Center,_Tampa,_Florida,_6_September_2022_(02).jpg","legenda":"Ghost em show em Tampa, na Flórida, em 2022 (foto de arquivo)","arquivo":"img/ghost-mary-bilhao.webp","largura":960,"altura":720}},{"id":"beatles-mccartney-ringo","categoria":"rock","data":"2026-11-10","simbolo":"Be","titulo":"McCartney vira bilionário e marca reencontro com Ringo","resumo":"Segundo a Forbes, Paul McCartney vale US$ 1,4 bilhão e é o terceiro músico mais rico do mundo, atrás só de Jay-Z e Taylor Swift. Boa parte disso vem da MPL, empresa que ele fundou em 1969 e que controla os direitos das músicas dele. Ele também confirmou que vai tocar com o Ringo Starr em 29 de janeiro, no VetsAid, um show beneficente em Las Vegas que também tem The Killers e St. Vincent.","relevancia":3,"fontes":[{"nome":"Louder","url":"https://www.loudersound.com/news/paul-mccartney-details-ringo-starr-reunion-plans-becomes-third-billionaire-musician-2026"}],"imagem":{"credito":"Raph_PH","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Paul_McCartney_and_Ringo_Starr.jpg","legenda":"Paul McCartney e Ringo Starr em show na O2 Arena, em Londres (foto de arquivo)","arquivo":"img/beatles-mccartney-ringo.webp","largura":673,"altura":960}},{"id":"despedidas-novembro","categoria":"rock","data":"2026-11-17","simbolo":"Ad","titulo":"Despedidas: John Christ (Danzig), Richard Lloyd (Television) e mais","resumo":"O guitarrista fundador do Danzig, John Christ, morreu em 15/11, aos 61 anos. Richard Lloyd, guitarrista do Television e do clássico 'Marquee Moon', morreu aos 75, e Tony Richards, primeiro baterista do W.A.S.P., aos 69. Teve também um susto que acabou bem: o Ian Gillan foi parar no hospital na Alemanha, o Deep Purple adiou o resto da turnê europeia, mas ele já está se recuperando de um procedimento bem-sucedido.","ouvir":"Mother (Danzig)","relevancia":3,"fontes":[{"nome":"News Tribune (AP)","url":"https://www.newstribune.com/news/2026/nov/19/john-christ-danzigs-founding-guitarist-dies-at-61/"},{"nome":"Louder","url":"https://www.loudersound.com/bands-artists/television-guitarist-richard-lloyd-dead-at-75"},{"nome":"Louder","url":"https://www.loudersound.com/news/founding-wasp-drummer-tony-richards-dead-2026"},{"nome":"Louder","url":"https://www.loudersound.com/bands-artists/ian-gillan-recovering-from-successful-procedure-following-medical-emergency-that-led-deep-purple-to-postpone-uk-and-european-tour-dates"}],"imagem":{"credito":"liftarn","licenca":"CC BY-SA 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Danzig_at_Sweden_Rock.jpg","legenda":"Danzig, banda de John Christ, em show no Sweden Rock, em 2010 (foto de arquivo)","arquivo":"img/despedidas-novembro.webp","largura":960,"altura":720}},{"id":"midterms-eua-democratas","categoria":"mundo","data":"2026-11-03","simbolo":"Md","titulo":"Midterms nos EUA: democratas tomam a Câmara e o Senado","resumo":"Nas eleições de meio de mandato de 3/11, os democratas viraram o jogo nas duas Casas do Congresso: na manhã seguinte já somavam pelo menos 228 cadeiras na Câmara (+19) e 54 a 44 no Senado, com sete cadeiras tomadas dos republicanos e Alasca e Mississippi ainda em contagem. Teve zebra histórica: James Talarico derrotou Ken Paxton no Texas, primeira vitória democrata estadual por lá em mais de 30 anos. Na prática, Trump passa os dois últimos anos de mandato com o Congresso nas mãos da oposição.","relevancia":5,"fontes":[{"nome":"WSB-TV (Cox Media)","url":"https://www.wsbtv.com/news/trending/election-2026-democrats-capture-both-houses-congress/5ILOWTVABVDPZFYP7VBBCX4EWE/?outputType=amp"},{"nome":"Live 5 News","url":"https://www.live5news.com/2026/11/04/midterm-election-results-three-things-know/?outputType=amp"}],"nome":"Midterms EUA","imagem":{"credito":"Martin Falbisoner","licenca":"CC BY-SA 3.0","fonte":"https://commons.wikimedia.org/wiki/File:US_Capitol_west_side.JPG","legenda":"O Capitólio, em Washington, sede do Congresso dos EUA (foto de arquivo)","arquivo":"img/midterms-eua-democratas.webp","largura":960,"altura":497}},{"id":"copom-selic-1375","categoria":"brasil","data":"2026-11-04","simbolo":"Se","titulo":"Copom segura a Selic em 13,75% e surpreende o mercado","resumo":"Em 4/11, o Banco Central manteve os juros em 13,75% ao ano, por unanimidade, interrompendo a sequência de cinco cortes iniciada em abril; boa parte do mercado apostava em mais 0,25 ponto de queda. O BC citou a instabilidade no câmbio, o El Niño e o agravamento da guerra no Oriente Médio, com a inflação em 12 meses subindo para 4,62%, acima do teto da meta (4,5%). Tradução: crédito caro por mais tempo.","relevancia":4,"fontes":[{"nome":"Folha de Pernambuco / Agência Brasil","url":"https://www.folhape.com.br/economia/banco-central-surpreende-e-mantem-juros-basicos-em-1375-ao-ano/522444/"},{"nome":"Metrópoles","url":"https://www.metropoles.com/brasil/copom-mantem-taxa-selic-e-juros-ficam-em-1375-ao-ano"}],"nome":"Selic 13,75%","imagem":{"credito":"Banco Central do Brasil","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Edif%C3%ADcio_%22Sede%22_do_Banco_Central_do_Brasil_em_Bras%C3%ADlia.jpg","legenda":"Sede do Banco Central, em Brasília, onde o Copom se reúne (foto de arquivo)","arquivo":"img/copom-selic-1375.webp","largura":640,"altura":960}},{"id":"paraguai-impeachment-pena","categoria":"mundo","data":"2026-11-06","simbolo":"Pa","titulo":"Paraguai derruba o presidente Santiago Peña por escândalo bancário","resumo":"Em 6/11, o Senado paraguaio destituiu Santiago Peña por 'mau desempenho' no cargo, após o colapso do Ueno Bank, que sofreu intervenção em 3/11 e congelou depósitos de quase metade da população. Peña é acusado de ter favorecido o banco, do qual já teve participação, com decisões regulatórias e dinheiro público; ele tentou renunciar na véspera, mas o Congresso seguiu com o processo. O vice Pedro Alliana assumiu até 2028, e Peña foi levado para prisão domiciliar, segundo a imprensa.","relevancia":3,"fontes":[{"nome":"Anchorage Daily News (AP)","url":"https://www.adn.com/nation-world/2026/11/06/paraguay-senate-removes-president-santiago-pena-from-office-following-ueno-bank-collapse/"},{"nome":"O Povo","url":"https://mais.opovo.com.br/jornal/mundo/2026/11/07/paraguai-tem-novo-presidente-apos-santiago-pena-sofrer-impeachment.html"}],"imagem":{"credito":"總統府","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Santiago_Pe%C3%B1a_and_William_Lai.jpg","legenda":"Santiago Peña, presidente do Paraguai, com William Lai, em agosto de 2023 (foto de arquivo)","arquivo":"img/paraguai-impeachment-pena.webp","largura":960,"altura":640}},{"id":"f1-antonelli-interlagos","categoria":"brasil","data":"2026-11-08","simbolo":"In","titulo":"F1: Antonelli é o campeão mais jovem da história; Norris vence em Interlagos","resumo":"Kimi Antonelli, da Mercedes, fechou o título no GP do México em 1/11, aos 20 anos e 68 dias: quebrou o recorde de Vettel e encerrou um jejum italiano de 73 anos. Uma semana depois, em Interlagos (8/11), Lando Norris venceu uma corrida bagunçada pela chuva no fim, com Verstappen em 2º depois de largar em 21º e Hadjar em 3º; os pontos de Russell e Antonelli deram à Mercedes também o título de construtores. Bortoleto terminou em 16º e Rafael Câmara em 20º.","relevancia":3,"fontes":[{"nome":"Latin Times","url":"https://www.latintimes.com/kimi-antonelli-2026-f1-youngest-champion-600772"},{"nome":"PlanetF1","url":"https://www.planetf1.com/news/f1-results-sao-paulo-grand-prix-2026-race-brazil"},{"nome":"O Povo","url":"https://mais.opovo.com.br/jornal/farol/2026/11/09/lando-norris-vence-gp-de-sao-paulo-e-mercedes-e-campea-de-construtores.html"}],"imagem":{"credito":"Governo do Estado de São Paulo","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Grande_Pr%C3%AAmio_S%C3%A3o_Paulo_de_F%C3%B3rmula_1_(52497080967).jpg","legenda":"Grande Pr
