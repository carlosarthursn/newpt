êmio de São Paulo de F1, em Interlagos (foto de edição anterior)","arquivo":"img/f1-antonelli-interlagos.webp","largura":960,"altura":640}},{"id":"ucrania-negociacoes-abu-dhabi","categoria":"mundo","data":"2026-11-12","simbolo":"Uc","titulo":"Ucrânia: negociação volta depois de 9 meses, mas sem acordo","resumo":"Rússia e Ucrânia voltaram a sentar à mesa em Abu Dhabi (10 e 11/11), com mediação dos EUA, pela primeira vez em nove meses; saiu a promessa de uma nova troca de prisioneiros, mas nada de acordo. Em 12/11, os enviados de Trump, Witkoff e Kushner, foram a Moscou, onde Putin manteve as exigências: todo o Donbas e nenhuma tropa europeia na Ucrânia. Kiev se recusa a entregar território, e os ataques com mísseis e drones continuaram durante as conversas.","relevancia":4,"fontes":[{"nome":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/11/12/us-envoys-arrive-in-moscow-for-russia-ukraine-talks-with-putin"},{"nome":"PRIO","url":"https://www.prio.org/comments/1933"}],"imagem":{"credito":"Sabithnav","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Abu_Dhabi_skyline_-_corniche_2.jpg","legenda":"Abu Dhabi, nos Emirados Árabes, cidade-sede das negociações (foto de arquivo)","arquivo":"img/ucrania-negociacoes-abu-dhabi.webp","largura":960,"altura":640}},{"id":"ajuste-fiscal-dolar","categoria":"brasil","data":"2026-11-13","simbolo":"Fi","titulo":"Ajuste fiscal passa no Senado, mas o dólar sobe a R$ 5,65","resumo":"Em 12/11, o Senado aprovou por 45 a 31 o texto-base do PLP 299/2026, pacote do governo que junta corte de gastos e aumento de receita para garantir a meta fiscal de 2027. O impacto estimado fica entre R$ 50 bi e R$ 60 bi (o relator, Eduardo Braga, fala em R$ 56,1 bi), e o texto agora vai para a Câmara. O mercado ficou desconfiado de que isso baste para segurar a dívida, e o dólar fechou 13/11 a R$ 5,65, maior patamar desde junho de 2025, com alta de 2,66% na semana.","angulo_quimico":"Tem combustível na conta: até R$ 10,5 bi gastos em 2026 com a subvenção ao diesel podem ficar fora do cálculo da meta de 2027, ou seja, o preço do diesel virou variável fiscal.","relevancia":3,"fontes":[{"nome":"Folha de Pernambuco","url":"https://www.folhape.com.br/economia/por-45-a-31-senado-aprova-texto-base-do-plp-de-ajuste-fiscal/524008/"},{"nome":"Metrópoles","url":"https://www.metropoles.com/brasil/dolar-ibovespa-bolsa-13-novembro"}],"imagem":{"credito":"Senado Federal from Brasilia, Brazil","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Plen%C3%A1rio_do_Senado_(40659294253).jpg","legenda":"Plenário do Senado Federal, em Brasília, em sessão (foto de arquivo)","arquivo":"img/ajuste-fiscal-dolar.webp","largura":960,"altura":640}},{"id":"petroleo-brent-despenca","categoria":"mundo","data":"2026-11-13","simbolo":"Oi","titulo":"Petróleo despenca: Brent sai de mais de US$ 100 para perto de US$ 91","resumo":"O barril, que chegou a subir mais de 50% no ano por causa da guerra de EUA e Israel contra o Irã, desabou em novembro: fechou a US$ 103,60 em 3/11 e rondava US$ 91 em 12/11, com queda de cerca de 16% numa única semana. Os motivos: Trump dizendo que a guerra está 'efetivamente encerrada', a produção saudita disparando (+26% em outubro), o fluxo pelo Estreito de Ormuz quase no nível de antes da guerra e a AIE prevendo excesso de oferta no 4º trimestre. Mas o conflito não acabou no papel: o bloqueio naval americano continua e as negociações seguem travadas.","angulo_quimico":"O petróleo do Golfo está saindo graças a desvios de engenharia, como o oleoduto saudita Leste-Oeste, que contorna Ormuz até o Mar Vermelho. E drones ucranianos atingiram pelo menos sete refinarias russas desde o fim de outubro, o que apertou a oferta global de diesel.","relevancia":4,"fontes":[{"nome":"Energy Connects (Bloomberg)","url":"https://www.energyconnects.com/news/oil/2026/november/oil-falls-toward-two-month-low-as-middle-east-production-rises/"},{"nome":"BOE Report (Reuters)","url":"https://boereport.com/2026/11/15/oil-prices-fall-on-expectations-of-coming-supply-surplus/amp/"},{"nome":"Nation Thailand","url":"https://www.nationthailand.com/news/world/40073076"},{"nome":"Al Jazeera","url":"https://www.aljazeera.com/news/liveblog/2026/11/9/iran-war-live-trump-says-land-blockade-in-effect-drone-cuts-power-in-iraq?update=5136239"}],"imagem":{"credito":"Arne Hückelheim","licenca":"CC BY-SA 3.0","fonte":"https://commons.wikimedia.org/wiki/File:LostHillsPumpjacksSunset.JPG","legenda":"Bombas de petróleo em Lost Hills, na Califórnia (foto ilustrativa)","arquivo":"img/petroleo-brent-despenca.webp","largura":960,"altura":640}},{"id":"lula-4-montagem-governo","categoria":"brasil","data":"2026-11-17","simbolo":"Lu","titulo":"Lula 4: presidente reeleito começa a montar o novo governo","resumo":"Reeleito em 25/10 com 51,79% contra 48,21% de Flávio Bolsonaro, depois de virar no 2º turno e se tornar o primeiro a ganhar quatro eleições presidenciais diretas, Lula voltou em 16/11 de um giro por COP31, Filipinas e Espanha e começou as conversas sobre o ministério. Já se reuniu com Rui Costa, Camilo Santana, Rafael Fonteles e Edinho Silva para discutir a formação do governo, e a ideia é anunciar parte da equipe antes do G20, em meados de dezembro. Ele avisou que 'ninguém vai indicar por mim'. A posse é em 5 de janeiro de 2027.","relevancia":4,"fontes":[{"nome":"Folha de Pernambuco","url":"https://www.folhape.com.br/politica/lula-retorna-ao-brasil-e-inicia-articulacoes-para-definir-novo/524612/"},{"nome":"Folha de Pernambuco","url":"https://www.folhape.com.br/politica/lula-se-reune-com-rui-camilo-fonteles-e-edinho-para-discutir/524858/"},{"nome":"Congresso em Foco","url":"https://www.congressoemfoco.com.br/noticia/131738/lula-critica-rumores-sobre-ministros--ninguem-vai-indicar-por-mim"},{"nome":"Agência Senado","url":"https://www12.senado.leg.br/noticias/materias/2026/10/25/lula-2018vira2019-e-e-reeleito-para-quarto-mandato-de-presidente"}],"nome":"Lula 4","imagem":{"credito":"President Bongbong Marcos / Presidential Communications Office","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:14.11.2026_-_Luiz_In%C3%A1cio_Lula_da_Silva_and_Bongbong_Marcos_in_Manila,_Philippines_15.jpg","legenda":"Lula em Manila, nas Filipinas, em 14 de novembro de 2026, com Bongbong Marcos","arquivo":"img/lula-4-montagem-governo.webp","largura":960,"altura":612}},{"id":"cupula-trump-xi-putin-shenzhen","categoria":"mundo","data":"2026-11-19","simbolo":"Sz","titulo":"Trump, Xi e Putin juntos em Shenzhen: 'maior que Yalta', diz Trump","resumo":"Em 19/11, os líderes de EUA, China e Rússia fizeram uma cúpula a três em Shenzhen e divulgaram uma 'declaração de paz' reafirmando que uma guerra nuclear 'não pode ser vencida e nunca deve ser travada'. Na prática, o texto é simbólico: não tem compromisso vinculante, não abre negociação de controle de armas e nem cita Ucrânia ou Irã. Trump deu nota '12 de 10' e comparou com Yalta; a Europa torceu o nariz, e o chanceler alemão Merz chamou o encontro de 'oportunidade de foto'.","relevancia":5,"fontes":[{"nome":"Reuters (via Investing.com)","url":"https://www.investing.com/news/world-news/trump-xi-and-putin-release-peace-declaration-from-unprecedented-summit-5040365"}],"nome":"Cúpula Shenzhen","imagem":{"credito":"The White House","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Xi%E2%80%93Putin%E2%80%93Trump_summit_-_P20261119DT-0901_(55662934489).jpg","legenda":"Trump, Xi Jinping e Putin na reunião trilateral da cúpula (foto da Casa Branca)","arquivo":"img/cupula-trump-xi-putin-shenzhen.webp","largura":960,"altura":640}},{"id":"flamengo-campeao-brasileiro","categoria":"brasil","data":"2026-11-21","simbolo":"Fl","titulo":"Flamengo é campeão brasileiro de 2026 com duas rodadas de folga","resumo":"No 1 a 1 contra o Palmeiras no Nubank Parque, em 21/11, o Flamengo garantiu o título: Jhon Arias abriu o placar para o Palmeiras e Samuel Lino empatou no 2º tempo. O Fla chegou a 80 pontos contra 74 do rival, vantagem que não pode mais ser alcançada nas duas rodadas restantes. É o 9º Brasileirão oficial do clube, que conta 10 incluindo 1987. E o Palmeiras ainda tem a final da Libertadores pela frente.","relevancia":4,"fontes":[{"nome":"Diario de Pernambuco","url":"https://www.diariodepernambuco.com.br/esportes-dp/nacional/2026/11/11729660-flamengo-empata-com-palmeiras-e-e-campeao-brasileiro-de-2026.html"},{"nome":"O Tempo","url":"https://www.otempo.com.br/sports/futebol-nacional/2026/11/21/com-titulo-do-flamengo-em-2026-confira-a-lista-de-todos-os-campeoes-brasileiros"}],"nome":"Fla campeão","imagem":{"credito":"Drmarcelodavid","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Maracan%C3%A3_-_Jogo_do_Flamengo_-_Rio_de_Janeiro_-_Brasil.jpg","legenda":"Torcida do Flamengo no Maracanã, em jogo do time (foto de arquivo)","arquivo":"img/flamengo-campeao-brasileiro.webp","largura":960,"altura":720}},{"id":"cop31-sem-acordo","categoria":"mundo","data":"2026-11-22","simbolo":"Co","titulo":"COP31 termina sem acordo, algo que não acontecia desde Copenhague","resumo":"A conferência do clima em Antália, na Turquia, que deveria acabar em 20/11, foi para a prorrogação e fechou em 22/11 sem decisão final. A UE e o Panamá barraram o texto porque ele não citava carvão, petróleo nem gás, depois que a Arábia Saudita e outros produtores derrubaram a linguagem sobre combustíveis fósseis. É a primeira COP sem acordo adotado por todos desde 2009. No dia 11, o discurso de Lula, lido pelo ministro Capobianco porque o presidente estava rouco, já avisava que o impulso de Belém tinha esfriado e cobrava dinheiro dos países ricos.","angulo_quimico":"Um dos pontos de briga foi o incentivo à captura e armazenamento de carbono (CCS) e se a expansão da geração elétrica deveria ser só renovável ou também incluir gás e carvão. Engenharia química no centro da diplomacia.","relevancia":5,"fontes":[{"nome":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/11/22/fossil-fuel-impasse-pushes-cop31-climate-talks-into-second-day-of-overtime"},{"nome":"Agência Gov","url":"https://agenciagov.ebc.com.br/noticias/202611/201ca-crise-climatica-e-tambem-uma-crise-de-injusticas201d-afirma-lula-na-abertura-da-cupula-de-lideres-da-cop31-na-turquia"}],"nome":"COP31","imagem":{"credito":"Press Information Department","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Tarique_Rahman_addressing_the_United_Nations_Climate_Change_Conference_COP31_in_Antalya,_Turkey,_2026-11-12.jpg","legenda":"Tarique Rahman, de Bangladesh, discursa na COP31, em Antalya, na Turquia","arquivo":"img/cop31-sem-acordo.webp","largura":960,"altura":683}},{"id":"bepicolombo-falha-software","categoria":"espaco","data":"2026-11-22","simbolo":"Bp","nome":"Bug na Bepi","corpo":"Mercúrio","titulo":"BepiColombo entrou em Mercúrio, mas a queima acabou antes da hora","resumo":"No domingo (22), um dia depois da chegada, a equipe da missão contou que, durante a manobra de captura do dia 21, a queima dos propulsores foi mais curta que o planejado por causa de um problema de software. A captura na órbita de Mercúrio está confirmada e a sonda está segura. O centro de operações ESOC, da ESA, está investigando o que houve e prometeu novidades na segunda (23). Ainda não se sabe quanto da mudança de órbita ficou faltando, nem se isso mexe na separação dos orbitadores MPO e Mio, marcada para 9–10 de dezembro.","relevancia":4,"fontes":[{"nome":"Starlust","url":"https://starlust.org/bepicolombo-ran-into-trouble-during-mercury-orbital-insertion-reveals-esa-a-day-after-milestone/"},{"nome":"The Tribune","url":"https://www.tribuneindia.com/news/science-technology/spacecraft-begins-orbit-of-mercury-with-glitch-reported"},{"nome":"SpacePolicyOnline","url":"https://spacepolicyonline.com/news/whats-happening-in-space-policy-november-22-29-2026/"}],"adicionado_em":"2026-11-23","imagem":{"credito":"ESA/BepiColombo/MTM","licenca":"CC BY-SA 3.0 igo","fonte":"https://commons.wikimedia.org/wiki/File:BepiColombo_hugs_Mercury_ESA24939504.png","legenda":"Pedaço da BepiColombo com Mercúrio ao fundo, foto de câmera da própria sonda num sobrevoo (arquivo)","arquivo":"img/bepicolombo-falha-software.webp","largura":960,"altura":960}},{"id":"spacex-recorde-pad-32h","categoria":"espaco","data":"2026-11-22","simbolo":"Rc","nome":"Recorde no pad","titulo":"Falcon 9 sai duas vezes do mesmo pad em 32 horas e quebra recorde","resumo":"No domingo (22), às 9h23 de Brasília, um Falcon 9 lançou a missão NROL-136, de satélites de reconhecimento do NRO, do complexo SLC-4E da base de Vandenberg, na Califórnia. Foi só 32 h 3 min 21 s depois da missão USSF-317, que saiu do mesmo pad. O recorde anterior era de 45 h, no Pad 40 de Cabo Canaveral. O booster B1097, no 14º voo, pousou de volta em Vandenberg uns 7,5 minutos após a decolagem.","relevancia":3,"fontes":[{"nome":"Space.com","url":"https://www.space.com/space-exploration/launches-spacecraft/spacex-spy-satellite-launch-nrol-136-proliferated-architecture"},{"nome":"Spaceflight Now","url":"https://spaceflightnow.com/2026/11/21/live-coverage-spacex-to-launch-intelligence-gathering-satellites-for-the-national-reconnaissance-office-3/"}],"adicionado_em":"2026-11-23","imagem":{"credito":"NASA / AFRC / NASA/Carla Thomas","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/AFRC2025-0170-02","legenda":"Falcon 9 decolando de Vandenberg com o satélite Sentinel-6B, em 2025, missão anterior do mesmo booster B1097 (arquivo)","arquivo":"img/spacex-recorde-pad-32h.webp","largura":640,"altura":960}},{"id":"ship42-aposentada","categoria":"espaco","data":"2026-11-21","simbolo":"Sx","nome":"Ship 42","titulo":"A primeira Starship agarrada pela torre não voa mais: vai ficar em exposição","resumo":"Elon Musk disse que a Ship 42, a nave do voo 15 que foi agarrada pelos 'chopsticks' da torre em 14/11, 'provavelmente poderia voar de novo com algumas semanas de reforma', mas a SpaceX não vai correr riscos com ela: vai ficar em exposição pública pelo papel histórico. O local ainda não foi divulgado. Na mesma fala, no TomorrowX Summit (18/11), ele repetiu a meta de cerca de 10 mil missões da Starship por ano até 2030.","relevancia":3,"fontes":[{"nome":"Space.com","url":"https://www.space.com/space-exploration/launches-spacecraft/spacex-will-retire-1st-starship-upper-stage-ever-caught-by-chopsticks-elon-musk-says"}],"adicionado_em":"2026-11-23","imagem":{"credito":"Jenny Hautmann","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Full_Stack_starship_crop_straight.jpg","legenda":"Starship montada na base de lançamento em Starbase (Booster 7 + Ship 24, foto de arquivo)","arquivo":"img/ship42-aposentada.webp","largura":432,"altura":960}},{"id":"hidrogel-acucar-fica-mais-forte","categoria":"quimica","data":"2026-11-21","simbolo":"Cy","nome":"Hidrogel de açúcar","titulo":"Hidrogel de açúcar fica mais forte quanto mais é dobrado","resumo":"Químicos da Washington University em St. Louis, do grupo de Chenfeng Ke, publicaram na Nature Materials um hidrogel biodegradável de ciclodextrina (anéis de açúcar) e polietilenoglicol (PEG) que, em vez de se desgastar com o uso, se reforça justamente nas regiões que sofrem tensão. Num modelo de articulação tipo joelho, foi dobrado 10 mil vezes e se comportou como previsto. Dá pra imprimir em 3D, já foi patenteado e por enquanto sai em lotes de dezenas de gramas. A ideia é usar como suporte de articulações artificiais e no reparo de tecidos.","angulo_quimico":"É química supramolecular (os autores chamam de rede 'adapt-ring'). Ao esticar, os aglomerados grandes de anéis de ciclodextrina se desfazem, os anéis deslizam ao longo das cadeias de PEG e, quando o material relaxa, se reorganizam em domínios cristalinos menores bem onde houve deformação. A parte sem tensão continua macia.","relevancia":4,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-sugar-based-hydrogel.html"}],"adicionado_em":"2026-11-23"},{"id":"amonia-verde-aqaba","categoria":"quimica","data":"2026-11-21","simbolo":"Av","nome":"Amônia verde","titulo":"Jordânia garante terreno por 45 anos para fábrica de amônia verde em Aqaba","resumo":"A Jordan Green Ammonia, projeto da Hynfra com o Fidelity Group, assinou um arrendamento de 45 anos com a Aqaba Development Corporation por cerca de 30 hectares na zona industrial sul de Aqaba. A planta, fora da rede elétrica, deve produzir cerca de 120 mil toneladas por ano de amônia renovável, com investimento estimado em US$ 1,1 bilhão. O projeto está na fase de FEED e licenciamento, com decisão final de investimento prevista para 2027 e operação em 2030. A produção vai para o mercado jordaniano e para exportação pelo porto de Aqaba.","angulo_quimico":"É o bom e velho Haber-Bosch alimentado com hidrogênio verde: a Topsoe fechou o FEED da síntese que converte o H2 em NH3, e a energia vem de um parque solar próprio. A meta é atender o padrão europeu de combustível renovável de origem não biológica (RFNBO). O ministério de energia jordaniano estima evitar cerca de 200 mil t de CO2 por ano.","relevancia":3,"fontes":[{"nome":"chemXplore","url":"https://chemxplore.com/news/jordan-green-ammonia-aqaba-plant-lease"}],"adicionado_em":"2026-11-23"},{"id":"curiosidade-tripla-carbono-bismuto","categoria":"quimica","data":"2026-11-21","simbolo":"Bi","nome":"Tripla relativística","titulo":"Curiosidade: a relatividade 'borra' a ligação tripla carbono–bismuto","resumo":"Um estudo da Brown University com a Washington State, publicado na Science em julho, voltou a circular no dia 21 pelo ScienceDaily. A equipe resfriou o íon CBi⁻ até perto do zero absoluto e mediu com espectroscopia de fotoelétrons. Em vez do 1 σ + 2 π dos livros, a tripla carbono–bismuto se comporta como uma ligação π mais duas híbridas σ-π. Nas palavras de Lai-Sheng Wang, continuam sendo três ligações, mas não dá mais pra chamá-las estritamente de σ ou π.","angulo_quimico":"O responsável é o acoplamento spin-órbita, que em átomos pesados como o bismuto (vizinho do chumbo na tabela) fica forte o bastante para misturar os orbitais. A parte teórica, de Kirk Peterson, usou cálculos relativísticos de quatro componentes (coupled-cluster Dirac-Coulomb). O próximo passo é testar elementos mais leves do mesmo grupo pra ver onde o efeito some.","relevancia":3,"fontes":[{"nome":"ScienceDaily","url":"https://www.sciencedaily.com/releases/2026/11/261120075602.htm"},{"nome":"Brown University","url":"https://www.brown.edu/news/2026-07-09/chemical-bonds-relativity"},{"nome":"Chemistry World","url":"https://www.chemistryworld.com/news/relativity-rewrites-the-textbook-take-on-triple-bonds-experiments-on-carbon-bismuth-ion-prove/4023845.article"}],"adicionado_em":"2026-11-23"},{"id":"gta-vi-review-bomb","categoria":"games","data":"2026-11-21","simbolo":"Rb","nome":"Review bomb","titulo":"GTA VI leva 99 da crítica e 5,6 do público no Metacritic","resumo":"No sábado (21/11), a nota dos usuários do GTA VI no Metacritic estava em 5,6 (versão de PS5), enquanto a da crítica segue em 99, com 152 análises. Tem muito zero vindo de conta recém-criada, de gente que nem jogou e até comentário feito por IA; parte parece querer proteger o recorde de 99 do Ocarina of Time original, e fã de GTA revidou dando zero para Zelda (não há prova de campanha organizada). Onde só quem comprou pode avaliar, o quadro é outro: 4,84 de 5 na PlayStation Store, com cerca de 170 mil avaliações. E o dinheiro nem liga: na sexta (20/11) a Take-Two informou à SEC US$ 3,79 bilhões em vendas no varejo só no primeiro dia e 32,5 milhões de cópias vendidas antes do lançamento (estimativa da própria empresa, e venda no varejo não é receita dela).","relevancia":4,"fontes":[{"nome":"GTABase","url":"https://www.gtabase.com/gta-6/articles/gta-6-review-bombed-on-metacritic"},{"nome":"Ynetnews","url":"https://www.ynetnews.com/tech-and-digital/article/b142ougj7l"},{"nome":"Take-Two (formulário 8-K na SEC)","url":"https://www.sec.gov/Archives/edgar/data/0000946581/000162828026075217/exhibit9918k.htm"}],"adicionado_em":"2026-11-23","imagem":{"credito":"Rockstar Games","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Grand_Theft_Auto_VI_logo_(with_gradient).svg","legenda":"Logotipo de Grand Theft Auto VI","arquivo":"img/gta-vi-review-bomb.webp","largura":960,"altura":729}},{"id":"riemann-prova-claude-lean","categoria":"tecnologia","data":"2026-11-21","simbolo":"Rh","nome":"Hipótese de Riemann","titulo":"Hipótese de Riemann: prova feita com o Claude passa na checagem do Lean","resumo":"Em 20/11, Levent Alpöge, matemático da Anthropic, publicou o que diz ser uma prova da Hipótese de Riemann (o problema de 1859 sobre os zeros da função zeta, ligado à distribuição dos números primos), encontrada junto com o Claude. A prova saiu como código formal no assistente de provas Lean: cerca de 17 milhões de linhas em 175.187 módulos, e cobriria também a versão generalizada para as funções L de Dirichlet. Em 21/11, as comunidades do Lean e do Mathlib declararam 'total confiança': o teorema provado bate com a definição padrão do Mathlib e verificadores independentes aceitaram tudo. Falta a parte humana: o texto que explica as ideias ainda está em andamento, e o Clay Institute, que oferece US$ 1 milhão, segue listando o problema como aberto, porque exige publicação e pelo menos dois anos de aceitação pela comunidade.","relevancia":5,"fontes":[{"nome":"Lean Community Blog","url":"https://leanprover-community.github.io/blog/posts/riemann-hypothesis/"},{"nome":"CryptoSlate","url":"https://cryptoslate.com/claude-assisted-proof-of-riemann-hypothesis-validated-by-independent-checkers/"},{"nome":"Michael Rubinstein (Univ. de Waterloo)","url":"https://www.math.uwaterloo.ca/~mrubinst/alpoge_claude_grh/"}],"adicionado_em":"2026-11-23","imagem":{"credito":"http://www.sil.si.edu/digitalcollections/hst/scientific-identity/explore.htm according to the German Wikipedia.","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Georg_Friedrich_Bernhard_Riemann.jpeg","legenda":"Bernhard Riemann, que formulou a hipótese em 1859, em foto de 1863","arquivo":"img/riemann-prova-claude-lean.webp","largura":879,"altura":960}},{"id":"openai-limites-perplexidade","categoria":"tecnologia","data":"2026-11-22","simbolo":"Px","nome":"Freio na IA","titulo":"OpenAI propõe 'limite de velocidade' comum para a IA, medido em perplexidade","resumo":"No domingo (22/11), o cientista-chefe da OpenAI, Jakub Pachocki, propôs que os laboratórios de ponta combinem limites comuns baseados na perplexidade (o quanto o modelo se 'surpreende' com o próximo pedaço de texto; quanto menor, melhor ele comprime e prevê) e se comprometam a não passar deles até que as ferramentas de monitorar o comportamento da IA atinjam um marco concreto. Como primeiro passo, a OpenAI abriu números internos: o GPT-3.5 tinha log-perplexidade de cerca de 0,99, o GPT-4 de 0,91, e abaixo de 0,8 surgiram capacidades transformadoras em cibersegurança e matemática. O motivo do alerta: segundo ele, já em 2027 pode vir uma 'avalanche' de avanços em pré-treinamento, parecida com a que se viu na matemática. Valor de limite ainda não tem.","relevancia":4,"fontes":[{"nome":"OpenAI","url":"https://openai.com/index/perplexity-and-intelligence"}],"adicionado_em":"2026-11-23","imagem":{"credito":"ICPCNews","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Jakub_Pachocki_in_2012_cropped.jpg","legenda":"Jakub Pachocki, hoje cientista-chefe da OpenAI, em foto de 2012","arquivo":"img/openai-limites-perplexidade.webp","largura":768,"altura":960}},{"id":"tesla-fsd-v15-gta","categoria":"tecnologia","data":"2026-11-21","simbolo":"Ts","nome":"FSD v15","titulo":"'É tipo GTA': Tesla solta o FSD v15 com visão fotorrealista do entorno","resumo":"No sábado (21/11), a Tesla começou a liberar a versão 15 do FSD, o sistema de direção autônoma dela, para parte dos carros. A novidade que mais chamou atenção é o Reality View: uma visão fotorrealista e em movimento do entorno, como se fosse uma câmera virtual acima e atrás do carro, que segundo a Tesla deixa o motorista ver e controlar o que o FSD planeja fazer. O Musk resumiu no X: 'It's like GTA', bem na semana em que o GTA VI fatura bilhões. A Tesla também promete melhora de 25 vezes em situações críticas de segurança, mas o Electrek lembra que a lista de correções parece a lista das maiores fraquezas do sistema e que o FSD nunca melhorou em linha reta.","relevancia":3,"fontes":[{"nome":"Gizmodo","url":"https://gizmodo.com/its-like-gta-musk-touts-video-game-like-update-to-tesla-fsd-2000843584"}],"adicionado_em":"2026-11-23","imagem":{"credito":"Sikander Iqbal","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Tesla_UBQ01B0_FSD_Chip_-_20240121_(cropped).jpg","legenda":"Chip de direção autônoma (FSD) da Tesla exposto num shopping em Toronto, em 2024","arquivo":"img/tesla-fsd-v15-gta.webp","largura":960,"altura":571}},{"id":"cheap-trick-ultimo-show","categoria":"rock","data":"2026-11-22","simbolo":"Ct","nome":"Cheap Trick","titulo":"Cheap Trick faz o último show antes de uma pausa sem data para acabar","resumo":"No domingo (22/11), o Cheap Trick tocou no Sound Board, do MotorCity Casino, em Detroit, o último show marcado da banda: as datas de 2027 foram canceladas e não há previsão de volta. É a primeira pausa em uns 50 anos de turnê, e a banda explicou só que 'precisamos de uma pausa', fazendo questão de avisar que não é por saúde. O set abriu com 'Dream Police', teve 'Ain't That a Shame' com a introdução estendida do 'At Budokan' e fechou com 'Surrender', antes da qual Robin Zander agradeceu ao público 'por tudo o que vocês nos deram'. O filho dele, Robin Taylor Zander, cantou 'Don't Be Cruel'.","ouvir":"Surrender (Cheap Trick), de preferência na versão do At Budokan","relevancia":3,"fontes":[{"nome":"Ultimate Classic Rock","url":"https://ultimateclassicrock.com/cheap-trick-final-show-touring-hiatus-set-list/"},{"nome":"Guitar Player","url":"https://www.guitarplayer.com/guitarists/cheap-trick-cancel-2027-dates-to-put-50-years-of-touring-on-hold-we-need-a-break"}],"adicionado_em":"2026-11-23","imagem":{"credito":"Bob n Renee","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Rick_Nielsen_Quint_Neck_Guitar_at_Concert_at_Shoreline_24-08-2016.jpg","legenda":"Rick Nielsen, do Cheap Trick, com a guitarra de cinco braços em show de 2016","arquivo":"img/cheap-trick-ultimo-show.webp","largura":960,"altura":540}},{"id":"igor-cavalera-fim-sepultura","categoria":"rock","data":"2026-11-22","simbolo":"Cv","nome":"Igor Cavalera","titulo":"Igor Cavalera: o fim do Sepultura é só o fim 'daquela versão'","resumo":"Numa sessão de perguntas no festival Transmissions, em Ravenna, na Itália, o Igor Cavalera comentou a despedida do Sepultura, que fez o último show em 7/11, em SP: 'Não acho que seja o fim. Acho que é o fim daquela versão do Sepultura.' Disse também que o que aconteceu lá não o afetou em nada e que 'nós seguimos nosso caminho, e eles seguem o deles, e está tudo bem'. Enquanto isso, ele e o Max tocam o repertório clássico como Cavalera e já marcaram show único em SP em 10/03/2027, no Audio, tocando o 'Chaos A.D.' inteiro.","ouvir":"Refuse/Resist (Sepultura, Chaos A.D.)","relevancia":3,"fontes":[{"nome":"Mundo Metal","url":"https://www.mundometalbr.com/igor-cavalera-considera-que-fim-do-sepultura-representa-apenas-o-encerramento-de-uma-formacao/"},{"nome":"Rolling Stone Brasil","url":"https://rollingstone.com.br/?p=328118"}],"adicionado_em":"2026-11-23","imagem":{"credito":"Birgit Fostervold","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Iggor_Cavalera_%E2%80%93_Cavalera_Conspiracy,_Tons_of_Rock_2026-2.jpg","legenda":"Iggor Cavalera com o Cavalera Conspiracy no festival Tons of Rock, em Oslo, em 2026","arquivo":"img/igor-cavalera-fim-sepultura.webp","largura":768,"altura":960}},{"id":"trump-ira-acordo-permanente","categoria":"mundo","data":"2026-11-21","simbolo":"Ir","nome":"Irã","titulo":"Trump quer acordo 'permanente' com o Irã; Ormuz segue fechado","resumo":"Numa entrevista por telefone à Fox News no sábado (21), Trump disse que quer um acordo 'permanente' com o Irã, que nenhum presidente futuro consiga desfazer para deixar Teerã chegar à bomba. 'A gente faz um acordo e no dia seguinte eles quebram', justificou, e chamou a atual liderança iraniana de 'terceiro grupo', o que seria 'a mudança de regime definitiva'. Do outro lado, o chanceler Abbas Araghchi diz que reabrir o Estreito de Ormuz é fácil se os EUA aceitarem as condições do Irã. Até lá, o estreito continua fechado.","angulo_quimico":"Pelo Estreito de Ormuz sai boa parte do petróleo e do gás natural do Golfo, que são matéria-prima da petroquímica. Com ele fechado, quem sente não é só o preço do combustível, mas a cadeia inteira de plásticos e solventes.","relevancia":4,"fontes":[{"nome":"Free Malaysia Today (Bernama/Anadolu)","url":"https://www.freemalaysiatoday.com/category/world/2026/11/22/trump-vows-to-make-permanent-deal-with-iran-prevent-future-nuclear-ambitions"},{"nome":"Anadolu Agency","url":"https://aa.com.tr/en/anadolu-post/morning-briefing-nov-22-2026/4133301"},{"nome":"Al Jazeera","url":"https://www.aljazeera.com/video/newsfeed/2026/11/21/21-11-clip-trump-iran-permanent-nuclear-deal"}],"adicionado_em":"2026-11-23","imagem":{"credito":"NASA","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:STS004-37-716_-_Strait_of_Hormuz.jpg","legenda":"O Estreito de Ormuz visto do ônibus espacial Columbia em 1982 (foto da NASA, não do evento)","arquivo":"img/trump-ira-acordo-permanente.webp","largura":960,"altura":960}},{"id":"fbi-ncic-invadido","categoria":"mundo","data":"2026-11-21","simbolo":"Nc","nome":"FBI hackeado","titulo":"Hackers invadem o banco de dados criminal do FBI, o segundo ataque em meses","resumo":"O FBI investiga uma invasão aparente do NCIC, o sistema nacional que as polícias dos EUA usam para consultar mandados, pessoas desaparecidas, carros e armas roubados. A CNN deu a notícia na sexta à noite. Ainda não se sabe quando nem como os invasores entraram, nem se levaram dados, e o medo maior é que tenham adulterado informações que os policiais usam na rua. Trump disse à Fox que 'não é bom', mas que 'talvez a gente aprenda coisas que nunca saberia de outro jeito'. O caso vem depois da série de panes que atingiu bancos, a NSA e o controle de tráfego aéreo da FAA, sem ligação comprovada entre uma coisa e outra.","relevancia":4,"fontes":[{"nome":"CNN (via WCVB)","url":"https://www.wcvb.com/article/fbi-ncic-database-breach-investigation/74497434"},{"nome":"ABC News (AP)","url":"https://abcnews.com/US/wireStory/fbi-investigating-apparent-hack-key-criminal-justice-information-138345950"},{"nome":"Forbes","url":"https://www.forbes.com/sites/larsdaniel/2026/11/21/fbi-reportedly-hacked-again-apparent-breach-hits-ncic-crime-database/"},{"nome":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/fbi-reportedly-hacked-again-this-time-targeting-nationwide-police-database"}],"adicionado_em":"2026-11-23","imagem":{"credito":"ajay_suresh","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:FBI_Headquarters_-_J._Edgar_Hoover_Building_(53840035941).jpg","legenda":"Edifício J. Edgar Hoover, em Washington, por décadas a sede do FBI (foto de arquivo)","arquivo":"img/fbi-ncic-invadido.webp","largura":960,"altura":540}},{"id":"sparta-ii-golfo-finlandia","categoria":"mundo","data":"2026-11-21","simbolo":"Sp","nome":"Báltico","titulo":"Drones atingem cargueiro russo no Golfo da Finlândia","resumo":"No sábado (21), dois drones atingiram o Sparta II, um cargueiro russo que ia para Kaliningrado, a oeste da ilha russa de Gogland. O navio pegou fogo, a tripulação foi retirada e ele ficou à deriva até entrar em águas finlandesas. Não houve relato de feridos. Ninguém assumiu o ataque: o premiê finlandês, Petteri Orpo, disse que a Ucrânia tem o direito de lutar contra o agressor, sem apontar autoria. A Finlândia reativou restrições aéreas e marítimas no leste do golfo, e no domingo a Rússia começou a rebocar o navio.","relevancia":3,"fontes":[{"nome":"The Moscow Times","url":"https://www.themoscowtimes.com/2026/11/21/russia-says-cargo-vessel-struck-by-drones-in-gulf-of-finland-a94342"},{"nome":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-11-21/russia-says-cargo-ship-attacked-by-drones-in-gulf-of-finland"},{"nome":"NBC News","url":"https://www.nbcnews.com/world/russia/cargo-ship-bound-russias-kaliningrad-hit-drones-finland-tightens-secur-rcna610567"}],"adicionado_em":"2026-11-23","imagem":{"credito":"Joe deSousa","licenca":"CC0","fonte":"https://commons.wikimedia.org/wiki/File:Gogland_Island,_Baltic_Sea_-_Flickr_-_Mustang_Joe.jpg","legenda":"Pôr do sol sobre a ilha de Gogland, no Golfo da Finlândia, perto de onde o navio foi atingido (foto de arquivo)","arquivo":"img/sparta-ii-golfo-finlandia.webp","largura":960,"altura":540}},{"id":"atletico-vice-sul-americana","categoria":"brasil","data":"2026-11-21","simbolo":"Ga","nome":"Sul-Americana","titulo":"Boca vence o Atlético-MG por 2 a 0 e é tri da Sul-Americana","resumo":"O Galo perdeu a final da Sul-Americana para o Boca Juniors por 2 a 0 no sábado (21), em Barranquilla, na Colômbia, com gols de Ascacíbar e Merentiel. O Boca vira o único tricampeão do torneio, que já tinha vencido em 2004 e 2005. Para o Atlético é mais uma final perdida em sequência, depois da Libertadores de 2024 para o Botafogo e da Sul-Americana de 2025 para o Lanús. Sem a vaga direta na Libertadores de 2027, o time, que está em sétimo no Brasileirão, vai ter que buscá-la pela liga.","relevancia":3,"fontes":[{"nome":"CNN Brasil","url":"https://www.cnnbrasil.com.br/esportes/futebol/futebol-internacional/sulamericana/atletico-mg-perde-para-o-boca-e-amarga-mais-um-vice-da-sul-americana/"},{"nome":"O Povo","url":"https://www.opovo.com.br/esportes/2026/11/22/boca-juniors-vence-sul-americana-sobre-o-atletico-mg.html"},{"nome":"VAVEL Brasil","url":"https://www.vavel.com/br/futebol/2026/11/22/atletico-mg/1280231-boca-juniors-vence-o-atletico-mg-e-conquista-o-titulo-da-copa-sul-americana-de-2026.html"}],"adicionado_em":"2026-11-23","imagem":{"credito":"Mkstillo","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Estadio_Metropolitano_de_Baranquilla_2011.jpg","legenda":"O Estádio Metropolitano Roberto Meléndez, em Barranquilla, palco da final, em foto de 2011","arquivo":"img/atletico-vice-sul-americana.webp","largura":960,"altura":720}},{"id":"tcu-el-nino-preparo","categoria":"brasil","data":"2026-11-22","simbolo":"En","nome":"El Niño","titulo":"TCU diz que o governo não está preparado para o El Niño","resumo":"Uma auditoria preliminar do TCU, revelada pela Folha e manchete do jornal no domingo (22), aponta falhas de planejamento e coordenação do governo federal contra secas e enchentes. O tribunal viu metas de segurança hídrica atualizadas com atraso, responsabilidades mal divididas entre ministérios e um planejamento que privilegia obras em vez de eficiência no uso da água. Os ministérios dizem que esperam a conclusão do trabalho, e a Casa Civil afirma ter garantido R$ 1,7 bilhão extra de emergência em novembro. A previsão é de chuva acima da média no Sul e de tempo mais seco em partes do Norte e do Nordeste até janeiro.","relevancia":3,"fontes":[{"nome":"NC News","url":"https://ncnews.com.br/2026/11/21/tcu-aponta-que-governo-nao-esta-preparado/"},{"nome":"Paraíba Online (capas dos jornais)","url":"https://paraibaonline.com.br/brasil/2026/11/22/o-que-tem-nas-capas-dos-jornais-do-brasil-neste-domingo-22-11/"},{"nome":"Blog do BG","url":"https://www.blogdobg.com.br/governo-federal-nao-esta-preparado-para-efeitos-do-el-nino-e-mudancas-climaticas-aponta-auditoria-do-tcu/"}],"adicionado_em":"2026-11-23","imagem":{"credito":"Borowskki","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Tribunal_de_contas_da_uniao_sede.jpg","legenda":"Sede do Tribunal de Contas da União, em Brasília (foto de arquivo)","arquivo":"img/tcu-el-nino-preparo.webp","largura":960,"altura":583}},{"id":"ufms-corantes-pantanal","categoria":"brasil","data":"2026-11-22","simbolo":"Cr","nome":"Corantes","titulo":"Cientista da UFMS é premiada por corantes feitos por micróbios do Pantanal","resumo":"A professora Denise Brentan da Silva, da UFMS, ficou em terceiro lugar no 5º Prêmio Confap de Ciência, Tecnologia e Inovação, na categoria Pesquisadora Inovadora. O prêmio foi entregue na quarta (18) em Curitiba e noticiado no domingo (22). A pesquisa dela usa microrganismos do Pantanal para produzir corantes naturais, como alternativa sustentável aos pigmentos sintéticos. Ela também é sócia-fundadora da Arandu Biotecnologia, startup apoiada pelo Programa Centelha.","angulo_quimico":"É um bioprocesso: o micróbio fabrica o pigmento no próprio metabolismo, e o trabalho da química passa a ser extrair, purificar e estabilizar a molécula. Muitos pigmentos sintéticos, ao contrário, partem de derivados do petróleo.","relevancia":2,"fontes":[{"nome":"A Onça","url":"https://www.aonca.com.br/pesquisadora-de-ms-conquista-premio-nacional-com-tecnologia-sustentavel-desenvolvida-a-partir-do-pantanal/"}],"adicionado_em":"2026-11-23","imagem":{"credito":"Ebertfloresta","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Araras_Azuis_no_Colorido_da_Flora_do_Pantanal.jpg","legenda":"Araras-azuis entre a flora colorida do Pantanal (foto ilustrativa, não da pesquisa)","arquivo":"img/ufms-corantes-pantanal.webp","largura":960,"altura":720}},{"id":"arquivos-pe-grande-forest-service","categoria":"misterios","data":"2026-11-21","simbolo":"Sq","nome":"Pé-Grande","titulo":"Governo dos EUA solta os 'arquivos do Pé-Grande', e o laudo de 1982 fala em fraude","resumo":"O Serviço Florestal dos EUA publicou sem alarde uma coleção chamada 'Bigfoot/Sasquatch Records', com relatos de caçadores dos anos 1940 e uma investigação de 1982 sobre pegadas de uns 38 cm na Floresta Nacional de Umatilla. A história viralizou agora, na carona dos arquivos de OVNI do Pentágono.","teoria":"Pra quem acredita, o governo soltar arquivos de Pé-Grande no meio da onda de documentos de OVNI não é coincidência e seria sinal de que tem mais coisa guardada. Um relato de 1941 fala de caçadores que viram um bicho não identificado levar embora o alce que tinham acabado de abater, e o próprio investigador de 1982 escreveu que, se as pegadas eram falsas, alguém teve um trabalhão com os detalhes.","fatos":"O biólogo Rodney L. Johnson concluiu em 1982 que as pegadas eram 'uma tentativa inteligente de fraude', provavelmente feitas com um pé revestido de borracha macia: o passo não mudava nem na ladeira. O Serviço Florestal não explicou por que publicou os arquivos, que estão no ar desde 15 de outubro. Até hoje ninguém achou corpo, esqueleto ou DNA do bicho.","relevancia":4,"fontes":[{"nome":"UNILAD","url":"https://www.unilad.com/news/us-news/us-government-quitely-releases-bigfoot-files-what-officials-found-424383-20261121"},{"nome":"UnHerd","url":"https://unherd.com/newsroom/bigfoot-is-not-the-only-mystery-worth-investigating/"},{"nome":"NewsNation","url":"https://www.newsnationnow.com/us-news/strange/forest-service-bigfoot-files/"}],"adicionado_em":"2026-11-23","imagem":{"credito":"U.S. Forest Service- Pacific Northwest Region","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Umatilla_Breaks,_Umatilla_National_Forest_(36044526534).jpg","legenda":"Floresta Nacional de Umatilla, no noroeste dos EUA, onde as pegadas de 1982 foram investigadas (foto do Serviço Florestal)","arquivo":"img/arquivos-pe-grande-forest-service.webp","largura":960,"altura":641}},{"id":"tuneis-hagia-sophia","categoria":"misterios","data":"2026-11-21","simbolo":"Tn","nome":"Túneis","titulo":"Túneis sob a Hagia Sophia: 420 metros limpos e água que ainda corre","resumo":"Equipes de restauração já limparam uns 420 metros de túneis sob a Hagia Sophia, em Istambul: são seis espaços subterrâneos ligados por nove túneis, e cerca de 3 mil toneladas de terra e entulho já saíram de lá. Um dos túneis desce rumo à Cisterna da Basílica com inclinação de uns 3%, e ainda corre água dentro dele.","teoria":"Desde setembro circulam manchetes sobre '9 km de túneis' sob o monumento, e mapas históricos descrevem uma rota da época romana que ia da região até Sarayburnu, a ponta da península. A ideia de uma rede escondida ligando tudo isso é o que alimenta a imaginação.","fatos":"O que está confirmado são os 420 metros. Os pesquisadores ainda não sabem se os túneis fazem parte da tal rota romana nem de onde vem a água, que pode ser do lençol freático ou de trechos do antigo aqueduto, segundo o professor Ahmet Gulec, do comitê científico do monumento. Por enquanto, a explicação é infraestrutura de água e drenagem, com partes possivelmente romanas que foram reaproveitadas por séculos.","relevancia":4,"fontes":[{"nome":"Anadolu Agency","url":"https://aa.com.tr/en/culture/beneath-hagia-sophia-grand-mosque-centuries-old-tunnels-begin-to-reveal-istanbul-s-hidden-water-network/4133181"},{"nome":"Greek City Times","url":"https://greekcitytimes.com/2026/11/22/hagia-sophia-restoration-uncovers-420-metres-of-underground-tunnels-beneath-the-great-church/"}],"adicionado_em":"2026-11-23","imagem":{"credito":"Ank Kumar","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Medusa_Head_at_Basilica_Cistern,_Istanbul,_Turkey_(Ank_Kumar)_01.jpg","legenda":"Cabeça de Medusa na Cisterna da Basílica, em Istambul, para onde corre um dos túneis (foto de arquivo, não dos túneis novos)","arquivo":"img/tuneis-hagia-sophia.webp","largura":960,"altura":640}},{"id":"bepicolombo-orbita-75h","categoria":"espaco","data":"2026-11-23","simbolo":"Bo","nome":"Bepi estável","corpo":"Mercúrio","titulo":"BepiColombo: queima entregou só 77% do previsto, mas a sonda está estável","resumo":"Saiu a explicação que a ESA tinha prometido. Na captura do dia 21, um problema de software no controle de orientação e dos propulsores encurtou a queima (que estava prevista para 37 minutos), e ela entregou só 77% da mudança de velocidade planejada. Resultado: a sonda ficou numa órbita de 75 horas em vez das 58 previstas, e estava em modo de segurança quando o contato voltou. Na segunda (23), a ESA disse que ela está 'segura e numa órbita estável', que as manobras seguintes foram recalculadas sem precisar de queimas extras e que a separação do MPO e do Mio continua marcada para 9 de dezembro.","relevancia":4,"fontes":[{"nome":"European Spaceflight","url":"https://europeanspaceflight.com/bepicolombo-enters-orbit-around-mercury-despite-software-glitch"},{"nome":"Space.com","url":"https://www.space.com/space-exploration/missions/esa-jaxa-bepicolomobo-mission-mercury-orbit-arrival"}],"adicionado_em":"2026-11-24","imagem":{"credito":"National Aeronautics and Space Administration (NASA)","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:BepiColombo_spacecraft_model.png","legenda":"Ilustração da BepiColombo montada: o orbitador europeu MPO (esquerda), o escudo MOSIF e o japonês Mio (direita), que se separam em dezembro (arte, não é foto)","arquivo":"img/bepicolombo-orbita-75h.webp","largura":960,"altura":960}},{"id":"planeta-x2-alem-netuno","categoria":"espaco","data":"2026-11-23","simbolo":"Px","nome":"Planeta X2","corpo":"Sistema solar externo","titulo":"Um planeta tipo Terra escondido além de Netuno? Novo modelo diz que pode ser","resumo":"Patryk Sofia Lykawka (Universidade Kindai, Japão) e Jonti Horner (Universidade do Sul de Queensland, Austrália) publicaram na MNRAS simulações de 4,5 bilhões de anos de evolução do sistema solar que apontam para um 'Planeta X2' (PX2) com 1,5 a 2 massas terrestres. Ele orbitaria a uns 350–500 UA do Sol, sem nunca chegar a menos de 200 UA (pra comparar, o Cinturão de Kuiper fica mais ou menos entre 38 e 50 UA). O modelo reproduz várias órbitas esquisitas de objetos gelados distantes, mas ainda não bate em tudo com o que se observa. Ninguém viu o planeta: a ideia é que o levantamento LSST do Observatório Vera C. Rubin consiga testar a previsão. (E não, não é Nibiru: é dinâmica orbital e estatística.)","relevancia":4,"fontes":[{"nome":"Phys.org (Royal Astronomical Society)","url":"https://phys.org/news/2026-11-astronomers-hidden-planet-neptune.html"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Kevin M. Gill","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Hypothetical_Planet_Nine_(24420842591).png","legenda":"Arte de um planeta hipotético, escuro e muito longe do Sol (ilustração genérica, não é o PX2 do estudo)","arquivo":"img/planeta-x2-alem-netuno.webp","largura":960,"altura":540}},{"id":"ibex-cauda-heliosfera","categoria":"espaco","data":"2026-11-23","simbolo":"Hl","nome":"Cauda do Sol","corpo":"Heliosfera","titulo":"A 'cauda' do sistema solar tem quatro lobos que mudam com o ciclo do Sol","resumo":"Uma equipe liderada por Maher Dayeh, do Southwest Research Institute (SwRI), usou 14 anos (2009–2022) de dados do IBEX, da NASA, para acompanhar a heliocauda, o rastro que a bolha do vento solar deixa no meio interestelar, ao longo de um ciclo solar inteiro de 11 anos. A cauda tem quatro lobos, num arranjo de trevo de quatro folhas: duas regiões com mais emissão de átomos neutros energéticos (ENAs) e duas com menos. Segundo Dayeh, essas emissões 'crescem, enfraquecem e mudam de posição' conforme o ciclo avança, com alguns anos de atraso. O estudo saiu na Astrophysical Journal Supplement Series e vira referência para interpretar os dados do IMAP, sucessor do IBEX lançado em setembro de 2025.","angulo_quimico":"Os ENAs nascem de troca de carga: um íon rápido do vento solar 'rouba' um elétron de um átomo neutro vindo do meio interestelar e vira átomo neutro. Sem carga, ele para de sentir o campo magnético e viaja em linha reta até a sonda, levando a informação de onde veio.","relevancia":3,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-nasa-spacecraft-reveal-solar-tail.html"}],"adicionado_em":"2026-11-24","imagem":{"credito":"NASA/Troy Bensech; Mapping the Heliosphere-NASA/IBEX","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Nasa_heliosphere.jpg","legenda":"Infográfico antigo da NASA (em inglês) sobre a heliosfera, com a sonda IBEX e um mapa de átomos neutros energéticos; não é a imagem do estudo novo","arquivo":"img/ibex-cauda-heliosfera.webp","largura":960,"altura":720}},{"id":"braskem-acordo-credores","categoria":"quimica","data":"2026-11-23","simbolo":"Bk","nome":"Braskem respira","titulo":"Braskem fecha acordo com credores, dizem jornais: US$ 4,9 bi, US$ 1,3 bi da Petrobras","resumo":"Segundo reportagens do Valor e do Estadão/Broadcast, com fontes que pediram anonimato (a empresa ainda não detalhou em fato relevante): na segunda (23), no fim do prazo de 90 dias da recuperação extrajudicial, a Braskem conseguiu o apoio de mais de 50% dos credores, principalmente os bondholders, para reestruturar uma dívida de pouco mais de US$ 11 bilhões, e protocolou o plano na Justiça. A capitalização soma US$ 4,9 bi: US$ 1,3 bi de aporte da Petrobras e US$ 3,6 bi de dívida convertida em ações. A dívida restante fica em torno de US$ 7 bi, com juros e principal adiados até 2028. O controle continua com a IG4 (via FIP Shine) e a Petrobras: os credores entram no acordo de acionistas, mas sem voto nas ações ordinárias e sem participar da gestão, e os detalhes da conversão ainda devem levar uns 30 dias.","angulo_quimico":"A Braskem é a maior petroquímica do país: transforma nafta e etano em eteno e propeno e daí em resinas como polietileno, polipropileno e PVC. As margens foram espremidas pelo excesso global de resinas, puxado pela expansão chinesa de PE e PP.","relevancia":4,"fontes":[{"nome":"Terra (Estadão/Broadcast)","url":"https://www.terra.com.br/economia/braskem-fecha-acordo-com-credores-envolvendo-capitalizacao-de-us-49-bilhoes,ec1950cf19c02bfec0f31d1755860dcfad53ijj3.html"},{"nome":"TNH1 (Valor Econômico)","url":"https://www.tnh1.com.br/noticia/nid/braskem-fecha-acordo-com-credores-de-us-49-bilhoes-com-aporte-de-us-13-bi-da-petrobras-dizem-fontes/"},{"nome":"Painel Político","url":"https://painelpolitico.com/braskem-fecha-acordo-de-us-49-bi-e-evita-recuperacao-judicial"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Cesman","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Braskem_triunfo.jpg","legenda":"Entrada do complexo petroquímico da Braskem em Triunfo (RS), em foto de arquivo","arquivo":"img/braskem-acordo-credores.webp","largura":638,"altura":394}},{"id":"petrobras-plano-2027-2031","categoria":"quimica","data":"2026-11-23","simbolo":"Pb","nome":"Plano Petrobras","titulo":"Petrobras aprova plano de US$ 122 bi e põe data na fábrica de ureia de MS","resumo":"O plano de negócios 2027–2031, aprovado na segunda (23), prevê US$ 122 bilhões, dos quais US$ 86 bi vão para exploração e produção. A fatia de refino, transporte, comercialização, petroquímica e fertilizantes leva US$ 24 bi: a capacidade de refino pode subir de 1,813 para 2,173 milhões de barris por dia até 2031 (contando projetos ainda em avaliação), sem refinaria nova, e a de diesel S-10 cresce 405 mil barris por dia. Na química pesada, a UFN-III, em Três Lagoas (MS), parada desde 2014 e com obras retomadas este ano, deve começar a operar em 2029 com 2,2 mil t/dia de amônia e 3,6 mil t/dia de ureia, o bastante para uns 15% da demanda nacional de ureia.","angulo_quimico":"A UFN-III usa gás natural como matéria-prima, na rota clássica: reforma a vapor para gerar H2, Haber-Bosch com o N2 do ar para fazer amônia e amônia com CO2 para fazer ureia. Já a expansão do S-10 é hidrotratamento na veia, como a nova unidade da Repar (partida em 2031) que vai converter 23 mil barris/dia de diesel S-500 em S-10.","relevancia":3,"fontes":[{"nome":"InfoMoney","url":"https://www.infomoney.com.br/mercados/petrobras-petr3-petr4-aprova-investimentos-de-us-122-bi-em-plano-de-negocios-2027-2031/"},{"nome":"Correio do Estado","url":"https://correiodoestado.com.br/economia/2026/11/23/petrobras-preve-fabrica-bilionaria-de-fertilizantes-em-ms-operando-em-2029.html"},{"nome":"eixos","url":"https://eixos.com.br/petroleo-e-gas/o-que-tem-de-novo-no-plano-de-us-122-bilhoes-da-petrobras/"}],"adicionado_em":"2026-11-24","imagem":{"credito":"MARCO AURÉLIO ESPARZ…","licenca":"CC BY-SA 3.0","fonte":"https://commons.wikimedia.org/wiki/File:REPLAN_-_Refinaria_de_Paul%C3%ADnia_-_Maior_refinaria_da_Petrobr%C3%A1s_-_panoramio.jpg","legenda":"A Replan, em Paulínia (SP), maior refinaria da Petrobras, vista da estrada em 2009 (foto de arquivo)","arquivo":"img/petrobras-plano-2027-2031.webp","largura":960,"altura":720}},{"id":"basf-baterias-foco-catodo","categoria":"quimica","data":"2026-11-23","simbolo":"Ni","nome":"BASF cátodos","titulo":"BASF vende a reciclagem de baterias e aposta só em material de cátodo","resumo":"A divisão de baterias da BASF anunciou na segunda (23) que vai se concentrar só em materiais ativos de cátodo (CAM), onde vê mais potencial de diferenciação e lucro. Para isso, vende para a cylib a reciclagem de baterias na Europa e na América do Norte, com propriedade intelectual, contratos, a planta de 'black mass' e a planta-protótipo de reciclagem de Schwarzheide, na Alemanha. O acordo foi assinado em 20/11, sem valores divulgados, e deve fechar entre o 2º e o 3º trimestre de 2027. A empresa também procura parceiros para duas fábricas paradas: Battle Creek (Michigan, EUA) e a de precursores de cátodo (PCAM) em Harjavalta, na Finlândia.","angulo_quimico":"'Black mass' é o pó escuro que sai da trituração de baterias usadas e de sucata de produção, uma mistura de grafite com os metais do cátodo, que depois vai para a hidrometalurgia recuperar níquel, cobalto e lítio. A planta de Schwarzheide foi projetada para 15 mil t/ano, e o foco da BASF agora é o CAM à base de níquel.","relevancia":3,"fontes":[{"nome":"BASF","url":"https://www.basf.com/global/en/media/news-releases/2026/11/p-26-192"},{"nome":"electrive (2025, sobre a planta de black mass)","url":"https://www.electrive.com/2025/06/03/basf-begins-production-of-black-mass-in-germany/"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Toniklemm","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:BASF_Schwarzheide_Panorama_2024_Luftbild_Toni_Klemm_2500px.jpg","legenda":"Vista aérea do complexo da BASF em Schwarzheide, na Alemanha, onde ficam a fábrica de material catódico e a planta de 'black mass' (2024)","arquivo":"img/basf-baterias-foco-catodo.webp","largura":960,"altura":416}},{"id":"huang-volta-nvidia","categoria":"tecnologia","data":"2026-11-23","simbolo":"Nv","nome":"Huang volta","titulo":"Reviravolta: Jensen Huang volta a ser CEO da Nvidia 11 dias depois de sair","resumo":"Onze dias depois de renunciar, o Jensen Huang foi reconduzido por unanimidade nesta segunda (23/11) como presidente, CEO e membro do conselho da Nvidia, com efeito imediato, segundo comunicado da própria empresa; a Colette Kress deixa o cargo de CEO interina e segue como CFO. Seis dias antes, o conselho tinha dito que não pretendia trazê-lo de volta. O Trump contou que falou com o conselho e com o próprio Huang e que ele 'não fez nada de errado'. A ação disparou com a notícia. A investigação dos conselheiros independentes sobre a suspeita de espionagem continua, e ele ainda tem depoimentos marcados no Congresso no começo de dezembro.","relevancia":5,"fontes":[{"nome":"CNBC","url":"https://www.cnbc.com/2026/11/23/nvidia-jensen-huang-ceo.html"},{"nome":"Nvidia Newsroom","url":"https://nvidianews.nvidia.com/news/nvidia-board-reinstates-jensen-huang-as-president-ceo-and-board-director"},{"nome":"Yahoo Finance","url":"https://finance.yahoo.com/technology/article/nvidia-reinstates-jensen-huang-as-ceo-stock-rockets-141145439.html"},{"nome":"Axios","url":"https://www.axios.com/2026/11/23/nvidia-board-jensen-huang-as-ceo"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Anderseidesvik","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Jensen_Huang_Stanford_2026-04-30_010_(cropped).jpg","legenda":"Jensen Huang em palestra em Stanford, em abril de 2026","arquivo":"img/huang-volta-nvidia.webp","largura":721,"altura":960}},{"id":"amazon-decart-trainium","categoria":"tecnologia","data":"2026-11-23","simbolo":"Tr","nome":"Amazon-Decart","titulo":"Amazon paga US$ 7,5 bi em tecnologia da Decart para encarar a Nvidia","resumo":"A Amazon anunciou nesta segunda (23/11) que vai ficar com a tecnologia do DOS (Decart Optimization Stack), software que faz modelos de IA rodarem de forma eficiente em chips da Nvidia, da Amazon e do Google, e vai contratar os fundadores e os pesquisadores da Decart, startup israelense de modelos de mundo interativos em tempo real. A Amazon não falou em valor, mas a Bloomberg cravou cerca de US$ 7,5 bilhões. O pano de fundo é chip: a Amazon, que até agora usava os Trainium só nos próprios data centers, se prepara para vendê-los a clientes, e o software da Decart pode facilitar a vida de quem hoje roda tudo em Nvidia. Detalhe: em agosto, segundo a Bloomberg, a Decart tinha negociado se vender para a Anthropic por uns US$ 6 bilhões.","relevancia":3,"fontes":[{"nome":"TechCrunch","url":"https://techcrunch.com/2026/11/23/amazon-snaps-up-decarts-ai-optimization-tech-for-7-5b-as-it-prepares-to-sell-trainium-chips/"},{"nome":"GeekWire","url":"https://www.geekwire.com/2026/amazon-is-buying-decarts-ai-chip-software-for-a-reported-7-5b-and-bringing-its-founders-aboard/"},{"nome":"The Spokesman-Review (Bloomberg)","url":"https://www.spokesman.com/stories/2026/nov/23/amazon-is-said-to-pay-75-billion-for-ai-startup-de/"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Tedder","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Amazon_AWS_us-west-2_beach_AZ.jpg","legenda":"Data centers da Amazon Web Services no Oregon (imagem ilustrativa)","arquivo":"img/amazon-decart-trainium.webp","largura":960,"altura":640}},{"id":"riemann-prova-humana-trava","categoria":"tecnologia","data":"2026-11-23","simbolo":"Zt","nome":"Riemann","titulo":"Riemann: a prova rival 'sem IA' já tem problemas; a do Claude segue em pé","resumo":"No mesmo dia em que Levent Alpöge publicou a prova feita com o Claude, o presidente da Sociedade Americana de Matemática, Ravi Vakil, divulgou uma prova rival de 940 páginas da versão generalizada, escrita por Alessandro Maria Masullo, 'toda humana, sem IA'; em poucas horas apareceram relatos de problemas (achados com ajuda de modelos de IA, ironia pouca é bobagem), e o Vakil atualizou o post dizendo que não garante que ela esteja correta. Sobre a do Alpöge, o matemático Daniel Litt diz que o código Lean muito provavelmente está certo, mas que nenhum humano entende a prova ainda. O próprio Alpöge contou que a tentativa de versão legível em inglês passou de 250 mil páginas e que vai trabalhar para simplificar. E o medalhista Fields Ngô Bảo Châu endossou a prova, segundo o 36Kr, dizendo que a IA vai fazer a matemática prosperar, não acabar.","relevancia":4,"fontes":[{"nome":"Phys.org / The Conversation","url":"https://phys.org/news/2026-11-sacred-mathematics-riemann-hypothesis-ai.html"},{"nome":"36Kr","url":"https://eu.36kr.com/en/p/4080372197282948"}],"adicionado_em":"2026-11-24"},{"id":"gta-vi-recorde-playstation","categoria":"games","data":"2026-11-23","simbolo":"Ps","nome":"Recorde PS","titulo":"Sony crava: GTA VI é o maior lançamento da história do PlayStation","resumo":"Segundo o blog oficial do PlayStation, mais de 39 milhões de pessoas jogaram GTA VI no PS5 entre o lançamento (19/11) e domingo (22/11), somando 683 milhões de horas, e em 70% dos PS5 novos ele foi o primeiro jogo aberto. A Sony também fala em recorde de jogadores simultâneos num único jogo na plataforma, mas sem dar o número. Nas vendas, o analista Rhys Elliott, da Alinea Analytics, estima 44,9 milhões de cópias (33,7 milhões no PS5 e 11,2 milhões no Xbox), uns 12 milhões a mais em quatro dias. É estimativa, não número oficial, e a versão de PC nem saiu ainda.","relevancia":4,"fontes":[{"nome":"VGC","url":"https://www.videogameschronicle.com/news/gta-6-was-the-biggest-launch-in-playstation-history-with-over-39-million-players/"},{"nome":"Push Square","url":"https://www.pushsquare.com/news/2026/11/gta-6-officially-the-biggest-launch-in-playstation-history-with-over-39-million-players"},{"nome":"ComicBook.com","url":"https://comicbook.com/gaming/news/gta-6-grand-theft-auto-vi-sales-45-million/"}],"adicionado_em":"2026-11-24","imagem":{"credito":"JDC808","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:All_PlayStations_(1-5,_PSP,_%26_Vita).jpg","legenda":"Todos os PlayStation, do primeiro ao PS5, mais PSP e Vita","arquivo":"img/gta-vi-recorde-playstation.webp","largura":960,"altura":634}},{"id":"gta-vi-easter-egg-vice-city","categoria":"games","data":"2026-11-23","simbolo":"Vc","nome":"Easter egg","titulo":"Resolvido o easter egg do GTA VI que abre um portal para a Vice City de PS2","resumo":"Quatro dias depois do lançamento, o YouTuber Memeio matou um dos segredos mais elaborados do GTA VI. Tudo começa com um toque musical do GTA: Vice City e uma charada; para resolver, é preciso saber os códigos de trapaça do Vice City e acionar chaves e botões em subestações espalhadas por Leonida, que ele achou seguindo as linhas de energia do jogo por três dias. No fim abre um portal para uma versão estilizada do jogo com cara de PS2, com participação do Danny Dyer como Kent Paul, e de prêmio vêm a camisa e a moto do Tommy Vercetti.","relevancia":3,"fontes":[{"nome":"VGC","url":"https://www.videogameschronicle.com/news/one-of-gta-6s-most-elaborate-easter-eggs-has-been-solved/"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Evan-Amos","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:PS2-Versions.jpg","legenda":"O PlayStation 2 original e o modelo slim, a era do GTA Vice City","arquivo":"img/gta-vi-easter-egg-vice-city.webp","largura":960,"altura":850}},{"id":"steam-awards-hall-da-fama","categoria":"games","data":"2026-11-23","simbolo":"St","nome":"Steam Awards","titulo":"Steam Awards fazem 10 anos e vão eleger o melhor jogo da década","resumo":"Abriram nesta segunda (23/11) as indicações do Steam Awards 2026, a 10ª edição do prêmio votado pelos usuários, e elas vão até 30/11 (às 15h de Brasília). A novidade é a categoria Hall da Fama: os vencedores de Jogo do Ano das edições anteriores disputam uma vaga só, e GTA V e The Witcher 3 entram representando os dois primeiros anos, quando a categoria ainda não existia. Ou seja, o GTA V pode virar o rei da década no Steam justo na semana em que o GTA VI sai sem versão de PC. A votação final começa em 17/12, junto com a Winter Sale, e termina no começo de janeiro.","relevancia":3,"fontes":[{"nome":"Inven Global","url":"https://www.invenglobal.com/articles/29034/2026-steam-awards-celebrates-10th-anniversary-open-for-nominations-until-december-1"},{"nome":"PC Gamer","url":"https://www.pcgamer.com/games/2026-steam-awards-pit-the-goty-winners-of-the-past-10-years-against-each-other-in-an-all-out-battle-for-supremacy/"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Liam Dawe/GamingOnLinux, PNG version by VulcanSphere","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Steam_Deck_(front).png","legenda":"O Steam Deck, o portátil da Valve (imagem ilustrativa)","arquivo":"img/steam-awards-hall-da-fama.webp","largura":960,"altura":357}},{"id":"the-warning-intervalo-nfl","categoria":"rock","data":"2026-11-22","simbolo":"Tw","nome":"The Warning","titulo":"The Warning leva o rock para o intervalo da NFL na Cidade do México","resumo":"No domingo (22/11), as irmãs Daniela, Paulina e Alejandra Villarreal, o trio mexicano The Warning, tocaram no intervalo de 49ers x Vikings no Estádio Banorte (o antigo Azteca), primeiro jogo da NFL no México desde 2022. Foi um medley enxuto de 'Ritual', 'Ego' e 'Kerosene', todas do disco 'Everything's Falling', de 2026, dez dias depois de a banda ganhar o primeiro Grammy Latino, de Melhor Canção de Rock, justamente com 'Ego'. Em 5/2/2027 elas abrem a turnê mundial com o primeiro show como atração principal num estádio, o Estadio GNP Seguros, também na Cidade do México.","ouvir":"'Ego', do The Warning (álbum 'Everything's Falling', 2026)","relevancia":3,"fontes":[{"nome":"Consequence","url":"https://consequence.net/2026/11/the-warning-peform-nfl-mexico-halftime-show/"},{"nome":"Metal Never Die","url":"https://metalneverdie.com.br/the-warning-show-intervalo-nfl-mexico-2026"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Tabercil","licenca":"CC BY-SA 3.0","fonte":"https://commons.wikimedia.org/wiki/File:The_Warning_at_Sound_of_Music_2022-5.jpg","legenda":"Daniela Villarreal, do The Warning, em show de 2022","arquivo":"img/the-warning-intervalo-nfl.webp","largura":960,"altura":686}},{"id":"roger-dean-fragile-recuperado","categoria":"rock","data":"2026-11-23","simbolo":"Fr","nome":"Fragile","titulo":"Capa original de 'Fragile', do Yes, sumida desde os anos 70, reaparece","resumo":"O Roger Dean, o artista das capas fantásticas do Yes, achava que a pintura original da capa de 'Fragile' (1971), um quadro de uns 44 cm de lado, estava perdida no próprio estúdio, até um colecionador contar que a tinha comprado de um conhecido marchand de Londres; a suspeita é que ela tenha sido roubada nos anos 1970. Ele acionou a polícia e a Art Recovery International e, depois de duas semanas de negociação e um acordo confidencial, a obra chegou à Heritage Auctions em setembro e foi apresentada num evento em Londres com o Rick Wakeman. 'Será que eu reconheceria na hora? Claro que reconheci!', disse o Dean. O leilão é em 2/12, e o lance estava em US$ 55 mil.","ouvir":"'Roundabout', do Yes (álbum 'Fragile', 1971)","relevancia":3,"fontes":[{"nome":"Louder","url":"https://www.loudersound.com/bands-artists/roger-dean-yes-stolen-fragile-artwork-returned"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Distributed by Atlantic Records","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Yes_1972_press_photo.jpg","legenda":"O Yes em foto de divulgação de 1972, com a formação do 'Fragile'","arquivo":"img/roger-dean-fragile-recuperado.webp","largura":752,"altura":960}},{"id":"gnr-jakarta-junior-eyes","categoria":"rock","data":"2026-11-23","simbolo":"Gn","nome":"GN'R","titulo":"Guns N' Roses volta depois de 'Paradise City' e toca Sabbath para o Ozzy","resumo":"No sábado (21/11), em Jacarta, na Indonésia, o público não parou de pedir mais depois de 'Paradise City', o encerramento de sempre; o Axl perguntou se queriam outra, e a banda voltou para tocar 'Junior's Eyes', do Black Sabbath, dedicada ao Ozzy, e 'Patience'. Segundo a Loudwire, que deu a notícia na segunda (23/11), é a primeira vez documentada em quase 20 anos que o GN'R volta ao palco depois do bis planejado: a anterior foi em Chiba, no Japão, em 14/7/2007, com 'Don't Cry'.","ouvir":"'Junior's Eyes', do Black Sabbath (álbum 'Never Say Die!', 1978)","relevancia":2,"fontes":[{"nome":"Loudwire","url":"https://loudwire.com/guns-n-roses-two-encores-indonesia-show/"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Kreepin Deth","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Axl_Rose_live_in_London_2022.jpg","legenda":"Axl Rose com o Guns N' Roses em Londres, em 2022","arquivo":"img/gnr-jakarta-junior-eyes.webp","largura":768,"altura":960}},{"id":"ucrania-afunda-corveta-russa-libia","categoria":"mundo","data":"2026-11-22","simbolo":"Mk","nome":"Benghazi","titulo":"Ucrânia afunda corveta russa num porto da Líbia, bem longe do front","resumo":"No domingo (22), drones navais atingiram a corveta russa Merkury, atracada numa base em Benghazi, no leste da Líbia; imagens de satélite mostram o navio quase todo tombado e submerso no porto. Na segunda (23), Zelensky confirmou a autoria: segundo ele, foram usados vários drones navais, e um cargueiro suspeito de levar armas russas também foi atingido. Os dois governos rivais da Líbia condenaram o ataque, a missão da ONU pediu uma investigação independente e o Kremlin disse que o Ministério da Defesa daria informações. É o segundo navio russo atingido no fim de semana, depois do cargueiro no Golfo da Finlândia no sábado.","relevancia":4,"fontes":[{"nome":"RFE/RL","url":"https://www.rferl.org/a/benghazi-libya-russian-ship-sunk-drone-ukraine/33903623.html"},{"nome":"NPR","url":"https://www.npr.org/2026/11/23/g-s1-155017/ukraine-attack-russian-warship-libya"},{"nome":"The Moscow Times","url":"https://www.themoscowtimes.com/2026/11/23/zelensky-confirms-attack-against-russian-warship-in-libya-a94346"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Jaw101ie","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Benghazi_Waterfront.JPG","legenda":"Orla de Benghazi, na Líbia, em foto de arquivo (não mostra o ataque)","arquivo":"img/ucrania-afunda-corveta-russa-libia.webp","largura":960,"altura":720}},{"id":"otan-russia-satelite-nuclear","categoria":"mundo","data":"2026-11-23","simbolo":"Su","nome":"Sputnik-S","titulo":"OTAN acha que a Rússia está pronta para pôr uma arma nuclear em órbita","resumo":"Segundo reportagem de NDR, WDR e Süddeutsche Zeitung publicada na segunda (23), serviços de inteligência de países da OTAN, incluindo o BND alemão, concluíram que a Rússia planeja lançar ainda este ano um satélite com arma nuclear, o 'Sputnik-S', montado há alguns anos e guardado na região de Moscou; há avaliações de que o lançamento pode sair já em dezembro. Um relatório da inteligência de defesa dos EUA, de outubro, já falava num satélite russo feito para carregar arma nuclear contra outros satélites, e o chefe do Comando Espacial americano estima que cerca de um terço dos satélites em órbita baixa poderia falhar em horas ou dias depois de uma explosão dessas. A embaixada russa em Berlim chamou as reportagens de infundadas e o Kremlin também negou, enquanto o chanceler Friedrich Merz as classificou de 'chocantes'. Colocar arma nuclear em órbita violaria o Tratado do Espaço Exterior, de 1967.","relevancia":4,"fontes":[{"nome":"Reuters (via U.S. News)","url":"https://www.usnews.com/news/world/articles/2026-11-23/nato-believes-russia-is-ready-to-launch-nuclear-armed-satellite-german-media-say"},{"nome":"AeroTime","url":"https://www.aerotime.aero/articles/russia-nuclear-armed-satellite-launch-warning"},{"nome":"Hromadske","url":"https://hromadske.ua/en/war/274835-russia-could-launch-nuclear-armed-satellite-by-december-western-intelligence-warns-german-media"},{"nome":"The Moscow Times","url":"https://www.themoscowtimes.com/2026/11/23/kremlin-dismisses-reports-about-alleged-nuclear-armed-satellite-launch-a94349"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Dktue","licenca":"CC0","fonte":"https://commons.wikimedia.org/wiki/File:Starlink_%C3%BCber_dem_Rathaus_in_T%C3%BCbingen.jpg","legenda":"Rastro de satélites Starlink sobre Tübingen, na Alemanha (ilustrativa; não é o satélite russo)","arquivo":"img/otan-russia-satelite-nuclear.webp","largura":960,"altura":727}},{"id":"camara-aprova-ajuste-fiscal","categoria":"brasil","data":"2026-11-23","simbolo":"Aj","nome":"Ajuste fiscal","titulo":"Câmara aprova o ajuste fiscal sem mudanças, e o pacote vai à sanção de Lula","resumo":"Na noite de segunda (23), a Câmara aprovou o texto-base do PLP 299/2026 por 353 votos a 128 e, na mesma sessão, derrubou todos os destaques que tentavam mudar o projeto. Como o texto é idêntico ao que passou no Senado, segue direto para a sanção. O pacote reduz de 2,5% para 2% o teto de crescimento real das despesas quando houver contingenciamento e corta benefícios fiscais; o governo espera alívio de até R$ 50 bi em 2027. Para garantir o placar, Lula exonerou temporariamente o ministro José Guimarães (Relações Institucionais), que reassumiu a cadeira de deputado para votar e depois volta ao ministério.","relevancia":4,"fontes":[{"nome":"Diario de Pernambuco","url":"https://www.diariodepernambuco.com.br/economia/2026/11/11729787-por-353-votos-contra-128-camara-aprova-texto-base-do-ajuste-fiscal.html"},{"nome":"Jovem Pan","url":"https://jovempan.com.br/politica/camara-rejeita-destaques-de-texto-base-do-ajuste-fiscal-e-projeto-sera-sancionado-por-lula/"},{"nome":"CartaCapital","url":"https://www.cartacapital.com.br/politica/lula-exonera-ministro-para-participar-da-votacao-do-ajuste-fiscal-na-camara/"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Kayo Magalhães/Câmara dos Deputados","licenca":"CC BY 3.0","fonte":"https://commons.wikimedia.org/wiki/File:Plen%C3%A1rio_da_C%C3%A2mara_dos_Deputados_durante_vota%C3%A7%C3%A3o_da_PEC_das_Prerrogativas.jpg","legenda":"Plenário da Câmara dos Deputados em outra votação (foto de arquivo, não da sessão do ajuste)","arquivo":"img/camara-aprova-ajuste-fiscal.webp","largura":768,"altura":473}},{"id":"rayssa-leal-ouro-utsunomiya","categoria":"brasil","data":"2026-11-23","simbolo":"Rl","nome":"Rayssa","titulo":"Rayssa Leal ganha a etapa do Japão da Copa do Mundo de skate street","resumo":"Na madrugada de segunda (23, horário de Brasília), Rayssa Leal venceu a etapa de Utsunomiya da Copa do Mundo de skate street com 176,03 pontos, só 0,90 à frente da australiana Chloe Covell. A japonesa Coco Yoshizawa, campeã olímpica em Paris 2024, ficou com o bronze (175,11) depois de errar a última manobra. A volta de 89,11 da Rayssa foi a maior nota de volta da final. É a resposta depois do 7º lugar no Mundial de Assunção, em outubro, e a vitória soma pontos no ranking rumo a Los Angeles 2028.","relevancia":3,"fontes":[{"nome":"Lance!","url":"https://www.lance.com.br/mais-esportes/rayssa-leal-supera-campea-olimpica-e-conquista-ouro-na-copa.html"},{"nome":"Atleta Pro","url":"https://www.atletapro.com.br/rayssa-leal-ouro-copa-do-mundo-skate-utsunomiya-2026/"},{"nome":"Jornal Pequeno","url":"https://jornalpequeno.com.br/2026/11/23/rayssa-leal-conquista-ouro-em-utsunomiya-com-a-melhor-volta-da-final"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Breno Barros","licenca":"CC BY 3.0 br","fonte":"https://commons.wikimedia.org/wiki/File:Rayssa_Leal_durante_a_prova_em_T%C3%B3quio.jpg","legenda":"Rayssa Leal na prova de street dos Jogos de Tóquio (2021), não na etapa de Utsunomiya","arquivo":"img/rayssa-leal-ouro-utsunomiya.webp","largura":960,"altura":640}},{"id":"ovni-agua-viva-alasca","categoria":"misterios","data":"2026-11-23","simbolo":"Me","nome":"Água-viva","titulo":"A 'água-viva voadora' do Alasca: o Snopes checou a onda de vídeos de OVNI","resumo":"Vídeos de um objeto escuro com 'tentáculos' flutuando no céu perto da base militar Elmendorf-Richardson, em Anchorage, viralizaram em novembro como prova de OVNI. Na segunda (23), o Snopes publicou uma checagem sobre a onda de vídeos.","teoria":"Pra quem acredita, é um UAP da mesma família da famosa 'água-viva' filmada sobre uma base dos EUA no Iraque em 2018, vídeo divulgado em 2024 pelo cineasta Jeremy Corbell: um objeto estranho, perto de instalação militar, que some do céu em poucos minutos. A base só disse que sabe do vídeo e que não tem 'informações adicionais', o que pra muita gente soa como silêncio suspeito.","fatos":"O vídeo original foi gravado em 15 de junho de 2026 pela fotógrafa Sara Jane Osborn e postado no Facebook no dia seguinte. Segundo o Snopes, esse clipe é real, mas parte dos vídeos que vieram depois foi feita com IA, e um deles mostrava pipas num festival em Lincoln City, no Oregon. O ex-investigador de UAPs do Pentágono Sean Kirkpatrick diz que o movimento lembra uma pipa com fitas (ventava bastante em Anchorage naquela hora), e a ex-analista Sarah Gamm acha mais provável um balão de alta altitude; oficialmente, segue 'não identificado', e Kirkpatrick lembra que vídeo comprimido de rede social não serve para análise.","relevancia":3,"fontes":[{"nome":"Snopes","url":"https://www.snopes.com/news/2026/11/23/jellyfish-ufo-aliens/"},{"nome":"Fox News","url":"https://www.foxnews.com/us/pentagons-former-ufo-investigator-offers-simple-theory-mysterious-jellyfish-shaped-object-video"},{"nome":"East Idaho News","url":"https://www.eastidahonews.com/2026/11/you-have-to-see-this-high-altitude-balloon-or-tentacled-ufo-viral-video-shows-strange-floating-object-in-sky/"}],"adicionado_em":"2026-11-24","imagem":{"credito":"Hansmuller","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:EYE_Film_Institute_Netherlands_-_Main_building_with_octopus_kites_-_2017.jpg","legenda":"Pipas em forma de polvo, com longos 'tentáculos', em Amsterdã (2017); não é o objeto do Alasca","arquivo":"img/ovni-agua-viva-alasca.webp","largura":960,"altura":720}},{"id":"luz-visivel-quebra-co2","categoria":"quimica","data":"2026-11-24","simbolo":"Ce","nome":"CO₂ com luz","titulo":"Luz azul e uma 'esponja de oxigênio' quebram CO₂ em CO sem forno","resumo":"O grupo de Naomi Halas, na Universidade Rice, montou um catalisador 'antena-reator': nanopartículas de cobre captam luz visível e mandam elétrons energéticos para sítios de rutênio, onde o CO₂ é quebrado em CO. O pulo do gato é o óxido de cério (céria) do suporte, que prende o oxigênio liberado na própria rede cristalina e impede a recombinação — sem ele, sai quase três vezes menos CO. Sob luz azul de 475 nm, o pico foi de 15.000 µmol de CO por hora por grama, com produção estável por 238 minutos, quase sete vezes mais que os controles aquecidos, que degradaram em 35 minutos. Saiu na PNAS, e o sistema está licenciado para a Syzygy Plasmonics, spin-off de Houston.","angulo_quimico":"A conversão térmica de CO₂ costuma pedir 700 a 1.500 °C; aqui a superfície chegou a 300–386 °C só com a iluminação, e a céria carregada de oxigênio pode ser regenerada com N₂ sob luz para novos ciclos.","relevancia":5,"fontes":[{"nome":"Phys.org (Rice University)","url":"https://phys.org/news/2026-11-visible-powers-catalyst-carbon-dioxide.html"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Leiem","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Cerium_dioxide_sample.jpg","legenda":"Pó de óxido de cério (CeO₂), a 'esponja de oxigênio' do catalisador; amostra comum, não a do estudo","arquivo":"img/luz-visivel-quebra-co2.webp","largura":960,"altura":720}},{"id":"grafite-flash-coque","categoria":"quimica","data":"2026-11-23","simbolo":"Gr","nome":"Grafite flash","titulo":"Coque de petróleo vira grafite de carga rápida em 0,2 segundo","resumo":"O laboratório de James Tour, na Universidade Rice, mistura coque de petróleo (resíduo barato do refino) com uma pitada de composto de níquel e dá um único pulso elétrico que esquenta tudo a cerca de 2.500 °C por dois décimos de segundo. As partículas de níquel ajudam os átomos de carbono a se organizarem nas camadas do grafite. Usado como ânodo, esse grafite aguentou uma taxa equivalente a carregar em quatro minutos e manteve 80% da capacidade depois de 1.000 ciclos. A equipe estima que o método corta mais de 80% da energia e das emissões da produção convencional de grafite (estudo na Advanced Materials).","angulo_quimico":"O níquel funciona como catalisador de grafitização: o ganho se manteve mesmo depois de remover mais de 99% do metal residual. Com temperatura alta demais o níquel se perdia; baixa demais, o grafite saía desordenado.","relevancia":5,"fontes":[{"nome":"Tech Xplore (Rice University)","url":"https://techxplore.com/news/2026-11-synthetic-graphite-paves-rapid-ev.html"}],"adicionado_em":"2026-11-25","imagem":{"credito":"romanm (talk)","licenca":"CC BY-SA 2.5 si","fonte":"https://commons.wikimedia.org/wiki/File:Petrolkoks_IMG_6166.jpg","legenda":"Coque de petróleo de perto, o resíduo de refino que vira grafite no método de Rice (amostra comum, não a do estudo)","arquivo":"img/grafite-flash-coque.webp","largura":960,"altura":720}},{"id":"glicina-numero-magico","categoria":"quimica","data":"2026-11-24","simbolo":"Gl","nome":"Glicina ×6","titulo":"Por que seis glicinas juntas são tão estáveis? Viram zwitteríons de uma vez","resumo":"Pesquisadores da Universidade Bar-Ilan, em Israel, atacaram um mistério da espectrometria de massas: por que aglomerados de seis moléculas de glicina são um 'número mágico'. Juntando experimentos com simulações de dinâmica molecular, viram que até cinco moléculas a glicina fica na forma neutra, mas no hexâmero todas viram zwitteríons (uma ponta positiva, outra negativa) de forma abrupta, o que permite ligações bem mais fortes entre elas. Nas simulações, o aglomerado de seis só se desfaz por volta de 1.200 K, contra uns 450 K para o de cinco e 480 K para o de sete. O trabalho saiu no Journal of Chemical Physics.","angulo_quimico":"Uma glicina sozinha 'não gosta' de ser zwitteríon; quem paga a conta é a interação entre as moléculas, uma explicação diferente da clássica, que atribui os números mágicos à simetria do arranjo. Como a glicina já foi achada em meteoritos, asteroides e cometas, o grupo vê ligação com a química da origem da vida.","relevancia":4,"fontes":[{"nome":"Phys.org (Bar-Ilan University)","url":"https://phys.org/news/2026-11-magic-scientists-secret-unusually-stable.html"}],"adicionado_em":"2026-11-25","imagem":{"credito":"Ben Mills","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Glycine-zwitterion-from-xtal-3D-bs-17.png","legenda":"Modelo bola-e-vareta da glicina na forma zwitteriônica (NH₃⁺ numa ponta, COO⁻ na outra), a forma que o hexâmero adota","arquivo":"img/glicina-numero-magico.webp","largura":960,"altura":688}},{"id":"eusi-magnetismo-onda-p","categoria":"quimica","data":"2026-11-24","simbolo":"Eu","nome":"Magnetismo p","titulo":"Um metal simples, o EuSi, mostra sinais de magnetismo de 'onda p'","resumo":"Uma colaboração de 38 cientistas de 19 instituições, puxada pelo Instituto Max Planck de Química Física dos Sólidos, em Dresden, publicou na Nature evidências de magnetismo d
