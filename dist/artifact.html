<title>Tabela Periódica das Notícias</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Retrospectiva de notícias organizada como tabela periódica: química, espaço, games, tecnologia, mistérios, rock, Brasil e mundo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: dark mission-console HUD. Sticky HUD bar (XP/level) -> photo hero -> top-5 strip -> family select (periodic tiles over photos) -> sticky filter chips -> swipeable rows per family (grid when filtered) -> animated solar-system map -> bonus quiz -> upcoming missions -> footer. Full story opens in a sheet. Single dark theme by design. */
:root {
  color-scheme: dark;
  --bg: #060912;
  --panel: #0D1222;
  --panel-2: #141B30;
  --ink: #E9EDF7;
  --muted: #8C96AE;
  --line: rgba(150, 168, 215, .16);
  --sys: #7CF4FF;
  --ok: #4CE38A;
  --bad: #FF6464;
  --sun: #FFB547;
  --star: #E8ECF8;
  --c-quimica: #2EF2C8;
  --c-espaco: #9192FF;
  --c-games: #FF52BA;
  --c-tecnologia: #47AFFF;
  --c-misterios: #B9F23E;
  --c-rock: #FF6340;
  --c-brasil: #FFC83F;
  --c-mundo: #95C7FF;
  --k: 14px;
  --hud-h: 54px;
  --f-display: "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; animation: none !important; } }
body {
  margin: 0;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  background:
    radial-gradient(1100px 620px at 85% -8%, rgba(145, 146, 255, .20), transparent 62%),
    radial-gradient(900px 520px at -12% 28%, rgba(46, 242, 200, .09), transparent 60%),
    radial-gradient(800px 600px at 50% 110%, rgba(255, 82, 186, .08), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
#stars { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
img { max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--sys); outline-offset: 3px; }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1240px; margin: 0 auto; }

[data-cat="quimica"] { --c: var(--c-quimica); }
[data-cat="espaco"] { --c: var(--c-espaco); }
[data-cat="games"] { --c: var(--c-games); }
[data-cat="tecnologia"] { --c: var(--c-tecnologia); }
[data-cat="misterios"] { --c: var(--c-misterios); }
[data-cat="rock"] { --c: var(--c-rock); }
[data-cat="brasil"] { --c: var(--c-brasil); }
[data-cat="mundo"] { --c: var(--c-mundo); }

.cut { clip-path: polygon(var(--k) 0, 100% 0, 100% calc(100% - var(--k)), calc(100% - var(--k)) 100%, 0 100%, 0 var(--k)); }
.hudlabel { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sec-title { display: flex; align-items: center; gap: 12px; margin: 0 0 14px; font-family: var(--f-display); font-weight: 700; font-size: clamp(20px, 2.6vw, 26px); letter-spacing: .04em; text-transform: uppercase; }
.sec-title::before { content: ""; width: 10px; height: 10px; background: var(--c, var(--sys)); box-shadow: 0 0 12px var(--c, var(--sys)); transform: rotate(45deg); flex: none; }
.sec-title small { font-family: var(--f-mono); font-size: 12px; font-weight: 400; letter-spacing: .04em; color: var(--muted); text-transform: none; margin-left: auto; }

/* HUD bar */
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--hud-h); background: rgba(6, 9, 18, .82); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.hud .wrap { height: 100%; display: flex; align-items: center; gap: 12px; }
.logo { display: grid; place-items: center; width: 34px; height: 34px; flex: none; font-family: var(--f-display); font-weight: 700; font-size: 15px; color: var(--bg); background: var(--sys); --k: 7px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brand span { color: var(--muted); font-weight: 500; }
@media (max-width: 560px) { .brand span { display: none; } .brand { font-size: 13px; letter-spacing: .05em; } }
.xp { margin-left: auto; display: flex; align-items: center; gap: 10px; flex: none; }
.lvl { font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--sys); white-space: nowrap; }
.lvl em { font-style: normal; color: var(--ink); }
@media (max-width: 420px) { .lvl em { display: none; } }
.xpbar { width: 84px; height: 8px; background: rgba(124, 244, 255, .12); --k: 3px; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--sys), var(--c-games)); box-shadow: 0 0 10px var(--sys); transition: width .5s ease; }
.xpnum { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 380px) { .xpnum { display: none; } }

/* Intro + hero */
.intro { padding-block: 22px 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; }
.intro h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3.4vw, 34px); letter-spacing: .02em; line-height: 1.1; }
.intro p { margin: 0; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); margin-right: 6px; animation: pulse 1.8s ease-in-out infinite; vertical-align: 1px; }
@keyframes pulse { 50% { opacity: .35; } }

.hero { position: relative; display: block; overflow: hidden; aspect-ratio: 16 / 7.2; min-height: 380px; text-decoration: none; color: var(--ink); background: var(--panel); --k: 22px; cursor: pointer; }
@media (max-width: 720px) { .hero { aspect-ratio: 4 / 5; min-height: 0; } }
.hero .ph { position: absolute; inset: 0; }
.hero .ph img, .hero .ph svg { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 1.2s ease; }
.hero:hover .ph img { transform: scale(1.04); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(6, 9, 18, .97) 8%, rgba(6, 9, 18, .62) 42%, rgba(6, 9, 18, .05) 75%), linear-gradient(to right, rgba(6, 9, 18, .55), transparent 60%); }
.hero-in { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; padding: clamp(18px, 3.4vw, 40px); display: grid; gap: 12px; max-width: 860px; }
.hero h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 4.6vw, 54px); line-height: 1.04; letter-spacing: .005em; text-wrap: balance; text-shadow: 0 2px 24px rgba(0, 0, 0, .6); }
.hero p { margin: 0; color: #C9D0E2; font-size: clamp(15px, 1.6vw, 17px); max-width: 62ch; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hero .tags { justify-self: start; padding: 5px 10px; background: rgba(6, 9, 18, .72); --k: 6px; clip-path: polygon(var(--k) 0, 100% 0, 100% calc(100% - var(--k)), calc(100% - var(--k)) 100%, 0 100%, 0 var(--k)); }
.cta { justify-self: start; display: inline-flex; align-items: center; gap: 10px; padding: 11px 18px; background: var(--c); color: var(--bg); font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; --k: 9px; box-shadow: 0 0 24px color-mix(in srgb, var(--c) 60%, transparent); }
.frame { position: absolute; inset: 12px; z-index: 1; pointer-events: none;
  background:
    linear-gradient(var(--c), var(--c)) top right / 28px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) top right / 2px 28px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 28px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 2px 28px no-repeat; opacity: .9; }

.tags { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.tag-cat { color: var(--c); text-shadow: 0 0 12px color-mix(in srgb, var(--c) 60%, transparent); }
.tag-date { color: var(--muted); }
.tag-new { padding: 2px 7px; background: var(--sys); color: var(--bg); --k: 4px; }
.tag-body { padding: 1px 7px; border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); color: var(--ink); }

/* Pictures */
.ph { position: relative; overflow: hidden; background: color-mix(in srgb, var(--c) 12%, var(--panel)); }
.ph img, .ph svg { display: block; width: 100%; height: 100%; object-fit: cover; }
.art .bg { fill: color-mix(in srgb, var(--c) 13%, var(--panel)); }
.art .night { fill: #0B1030; }
.art .star { fill: var(--star); }
.art .ln { stroke: var(--c); fill: none; }
.art .fl { fill: var(--c); }
.art .sym { font-family: var(--f-display); font-weight: 700; fill: var(--c); }

/* Cards */
.card { position: relative; display: block; text-decoration: none; color: var(--ink); cursor: pointer; transition: transform .2s ease, filter .2s ease; min-width: 0; }
.card:hover { transform: translateY(-4px); filter: drop-shadow(0 0 14px color-mix(in srgb, var(--c) 45%, transparent)); }
.shape { position: relative; display: grid; height: 100%; background: var(--panel); }
.shape::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background:
    linear-gradient(var(--c), var(--c)) top right / 20px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) top right / 2px 20px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 20px 2px no-repeat,
    linear-gradient(var(--c), var(--c)) bottom left / 2px 20px no-repeat; }
.card .ph { aspect-ratio: 16 / 10; }
.card .ph img { transition: transform .6s ease; }
.card:hover .ph img { transform: scale(1.05); }
.badges { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; z-index: 1; }
.badge { padding: 3px 8px; font-family: var(--f-display); font-weight: 700; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; --k: 5px; }
.badge.new { background: var(--sys); color: var(--bg); }
.badge.read { background: rgba(6, 9, 18, .8); color: var(--ok); border: 1px solid var(--ok); }
.sym-chip { position: absolute; right: 10px; top: 10px; z-index: 1; display: grid; place-items: center; width: 40px; height: 40px; font-family: var(--f-display); font-weight: 700; font-size: 17px; color: var(--c); background: rgba(6, 9, 18, .78); border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); --k: 8px; }
.card-in { display: grid; gap: 6px; align-content: start; padding: 12px 14px 16px; }
.card .ttl { margin: 0; font-family: var(--f-body); font-weight: 600; font-size: 16px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.card .tz { margin: 0; font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card.is-read .ph { opacity: .45; }
.card.is-read .ttl { color: var(--muted); }

/* Strip + rows */
.strip-sec { margin-top: 18px; }
.row-wrap { position: relative; }
.row { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(250px, 290px); gap: 14px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; padding: 6px 2px 14px; scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--c, var(--sys)) 50%, transparent) transparent; }
.row > * { scroll-snap-align: start; }
@media (max-width: 600px) { .row { grid-auto-columns: 78%; } }
.row-h { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.row-h .sec-title { margin: 0; }
.row-h .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.arrows { margin-left: auto; display: flex; gap: 6px; }
.arr { width: 38px; height: 34px; border: 0; background: var(--panel-2); color: var(--c, var(--sys)); cursor: pointer; --k: 7px; font-family: var(--f-display); font-weight: 700; font-size: 16px; }
.arr:hover { background: color-mix(in srgb, var(--c, var(--sys)) 22%, var(--panel-2)); }
@media (max-width: 600px) { .arrows { display: none; } }
.more-card { display: grid; place-items: center; align-content: center; gap: 10px; min-height: 240px; background: color-mix(in srgb, var(--c) 10%, var(--panel)); color: var(--c); text-decoration: none; font-family: var(--f-display); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; text-align: center; cursor: pointer; border: 0; padding: 20px; }
.more-card b { font-size: 46px; line-height: 1; }
.fam-row { margin-top: 34px; }
.row-desc { margin: 0 0 6px; font-size: 14px; color: var(--muted); max-width: 72ch; }
.row-desc em { font-style: normal; color: var(--c); }

/* Family select */
.fam-sec { margin-top: 40px; }
.fam-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .fam-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.fam { position: relative; display: grid; grid-template-rows: auto 1fr auto; aspect-ratio: 3 / 4; padding: 10px; overflow: hidden; border: 0; cursor: pointer; text-align: center; color: var(--ink); background: var(--panel); --k: 12px; transition: transform .2s ease, filter .2s ease; }
.fam:hover { transform: translateY(-3px); filter: drop-shadow(0 0 16px color-mix(in srgb, var(--c) 55%, transparent)); }
.fam .bgimg { position: absolute; inset: 0; z-index: 0; }
.fam .bgimg img, .fam .bgimg svg { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .38; filter: grayscale(.4); }
.fam::after { content: ""; position: absolute; inset: 0; z-index: 0; background: linear-gradient(to top, rgba(6, 9, 18, .92), rgba(6, 9, 18, .35)), linear-gradient(color-mix(in srgb, var(--c) 18%, transparent), transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); }
.fam > span { position: relative; z-index: 1; }
.fam .top { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.fam .s { align-self: center; font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 4vw, 46px); line-height: 1; color: var(--c); text-shadow: 0 0 18px color-mix(in srgb, var(--c) 70%, transparent); }
.fam .n { font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
.fam .n small { display: block; font-family: var(--f-mono); font-size: 10px; letter-spacing: 0; text-transform: none; color: var(--muted); }

/* Filters */
.feed { margin-top: 44px; }
.filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hud-h)); z-index: 15; background: rgba(6, 9, 18, .86); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.filters .wrap { display: flex; align-items: center; gap: 8px; padding-block: 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; padding: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border: 0; background: var(--panel-2); color: var(--ink); font-family: var(--f-display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; --k: 8px; }
.chip i { font-style: normal; font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: 0; }
.chip b { color: var(--c, var(--sys)); }
.chip[aria-pressed="true"] { background: var(--c, var(--sys)); color: var(--bg); }
.chip[aria-pressed="true"] b, .chip[aria-pressed="true"] i { color: var(--bg); }
.icon-btn { flex: none; display: grid; place-items: center; width: 40px; height: 36px; border: 0; background: var(--panel-2); color: var(--ink); cursor: pointer; --k: 8px; }
.icon-btn[aria-pressed="true"] { background: var(--sys); color: var(--bg); }
.icon-btn svg { width: 18px; height: 18px; }
.searchrow { padding-bottom: 10px; }
.search { width: 100%; padding: 10px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 400 15px/1.3 var(--f-body); --k: 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; padding-top: 10px; }
.empty { padding: 40px 0; color: var(--muted); }
.filter-note { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 14px; font-size: 14px; color: var(--muted); }
.filter-note button { border: 0; background: none; color: var(--sys); text-decoration: underline; cursor: pointer; padding: 0; }

/* Orrery */
.orr-sec { margin-top: 56px; }
.orr { position: relative; background: radial-gradient(ellipse at center, rgba(145, 146, 255, .12), transparent 70%), rgba(13, 18, 34, .6); --k: 20px; padding: 8px; }
.orr svg { display: block; width: 100%; height: auto; }
.orr .orbit { fill: none; stroke: rgba(170, 185, 230, .16); stroke-width: 1; }
.orr .belt { fill: none; stroke: rgba(200, 210, 240, .35); stroke-width: 3; stroke-dasharray: 1 7; }
.orr .pl { fill: #4A5470; }
.orr .on .pl { fill: var(--c-espaco); }
.orr .sel .pl { stroke: var(--ink); stroke-width: 2.5; }
.orr text { font-family: var(--f-mono); font-size: 12px; fill: rgba(200, 210, 235, .55); }
.orr .on text { fill: var(--ink); font-weight: 500; }
.orr .cnt { fill: var(--c-espaco); font-family: var(--f-display); font-weight: 700; font-size: 13px; }
.orr g[role="button"] { cursor: pointer; }
.orr g[role="button"]:focus-visible { outline: none; }
.orr g[role="button"]:focus-visible .pl { stroke: var(--sys); stroke-width: 3; }
.orr .tail { stroke: rgba(124, 244, 255, .55); stroke-width: 2; stroke-linecap: round; }
.orr-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.orr-note { margin: 0 0 12px; font-size: 14px; color: var(--muted); }

/* Quiz */
.quiz-sec { margin-top: 56px; }
.qs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.q { display: grid; gap: 10px; align-content: start; padding: 18px; background: var(--panel); --k: 14px; }
.q p { margin: 0; font-weight: 600; line-height: 1.35; }
.q .opts { display: grid; gap: 7px; }
.opt { text-align: left; padding: 10px 12px; border: 1px solid var(--line); background: var(--panel-2); font-size: 14px; line-height: 1.3; cursor: pointer; --k: 7px; }
.opt:hover:not(:disabled) { border-color: var(--sys); }
.opt:disabled { cursor: default; }
.opt.ok { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 18%, var(--panel-2)); }
.opt.no { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--panel-2)); }
.q .res { font-size: 13px; color: var(--muted); }
.q .res a { color: var(--sys); }
.score { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }

/* Agenda */
.ag-sec { margin-top: 56px; }
.ag { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.ag li { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; padding: 14px; background: var(--panel); --k: 12px; }
.when { display: grid; justify-items: center; align-content: start; gap: 2px; font-family: var(--f-display); color: var(--c); }
.when b { font-size: 28px; line-height: 1; font-weight: 700; }
.when span { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.ag h3 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3; }
.ag p { margin: 4px 0 6px; font-size: 14px; color: var(--muted); }
.ag .cd { font-family: var(--f-display); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--sys); }
.ag a { font-size: 13px; color: var(--muted); }

/* Footer */
.foot { margin-top: 72px; padding-block: 30px 56px; border-top: 1px solid var(--line); display: grid; gap: 12px; }
.foot .msg { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(20px, 2.8vw, 28px); line-height: 1.25; max-width: 30ch; text-wrap: balance; }
.foot p { margin: 0; color: var(--muted); font-size: 14px; max-width: 72ch; }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(3, 5, 12, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.sheet { position: relative; width: min(780px, 100%); max-height: calc(100vh - 48px); max-height: calc(100dvh - 48px); overflow-y: auto; overscroll-behavior: contain; background: var(--panel); --k: 22px; animation: rise .25s ease; }
@keyframes rise { from { transform: translateY(24px); opacity: .4; } }
@media (max-width: 720px) {
  .sheet-wrap { padding: 0; place-items: end stretch; }
  .sheet { width: 100%; max-height: 100%; height: 100%; clip-path: none; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
.sh-bar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top, 0px)); background: rgba(13, 18, 34, .92); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.sh-bar .pos { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-right: auto; }
.sh-btn { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px; border: 0; background: var(--panel-2); color: var(--ink); cursor: pointer; font-family: var(--f-display); font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; --k: 7px; }
.sh-btn:hover { background: color-mix(in srgb, var(--sys) 20%, var(--panel-2)); }
.sh-btn:disabled { opacity: .35; cursor: default; }
.sh-img .ph { aspect-ratio: 16 / 9; }
.sh-cap { padding: 6px 20px 0; font-size: 12px; color: var(--muted); }
.sh-cap a { color: var(--muted); }
.sh-body { display: grid; gap: 14px; padding: 16px 20px 28px; }
.sh-body h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(24px, 3.4vw, 32px); line-height: 1.12; text-wrap: balance; }
.sh-body > p { margin: 0; font-size: 17px; line-height: 1.6; }
.tf { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.tf div { padding: 12px 14px; background: var(--panel-2); font-size: 15px; --k: 10px; }
.tf b { display: block; margin-bottom: 4px; font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
.tf .t1 b { color: var(--c-misterios); }
.tf .t2 b { color: var(--ok); }
.chem { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; padding: 12px 14px; font-size: 15px; background: color-mix(in srgb, var(--c-quimica) 10%, var(--panel-2)); --k: 10px; }
.chem svg { width: 22px; height: 22px; color: var(--c-quimica); margin-top: 2px; }
.chem b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--c-quimica); margin-bottom: 2px; }
.listen { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 14px; background: color-mix(in srgb, var(--c-rock) 10%, var(--panel-2)); --k: 10px; }
.listen b { font-family: var(--f-display); font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--c-rock); }
.listen a { padding: 5px 10px; background: var(--panel); text-decoration: none; font-size: 13px; font-weight: 600; --k: 5px; }
.srcs { font-size: 14px; color: var(--muted); }
.srcs a { color: var(--ink); }
.sh-foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Toast */
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 60; transform: translateX(-50%); padding: 10px 18px; background: var(--panel-2); color: var(--sys); font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; box-shadow: 0 0 24px rgba(124, 244, 255, .35); --k: 9px; animation: toast 2.4s ease forwards; pointer-events: none; white-space: nowrap; }
.toast.big { font-size: 16px; padding: 14px 22px; color: var(--bg); background: linear-gradient(90deg, var(--sys), var(--c-games)); }
@keyframes toast { 0% { opacity: 0; transform: translate(-50%, 12px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -6px); } }

<script type="application/json" id="dados">{"atualizado_em":"2026-11-26","periodo":{"inicio":"2026-10-28","fim":"2026-11-25"},"lead":"Tudo que rolou desde 28 de outubro, separado por família: química, espaço, games, tecnologia, mistérios, rock, Brasil e mundo. Cada notícia tem link pra fonte original, pra você conferir.","mensagem":"Montado pelo seu irmão pra você não ficar por fora de nada. Força aí: tem GTA VI, sonda nova em Mercúrio e muito rock te esperando aqui fora.","metodo":"Como foi feito: cada notícia foi pesquisada na web e tem pelo menos uma fonte com link. Os resumos são em português e simplificam; se algo parecer estranho, clica na fonte e confere. A gente vai atualizando.","resumo_ids":["riemann-prova-claude-lean","hera-dimorphos-cratera-estadio","fcc-starmind-milhao-satelites","huang-volta-nvidia","luz-visivel-quebra-co2","gta-vi-chegou"],"categorias":[{"id":"quimica","nome":"Química","simbolo":"Cm","z":96,"massa":"(247)","elemento_nome":"Cúrio","elemento":"Cm, cúrio (96): batizado em homenagem a Marie e Pierre Curie.","descricao":"A sua área: materiais, catálise, energia e indústria química."},{"id":"espaco","nome":"Espaço","simbolo":"Es","z":99,"massa":"(252)","elemento_nome":"Einstênio","elemento":"Es, einstênio (99): achado nos destroços do primeiro teste de bomba de hidrogênio, em 1952.","descricao":"Missões, planetas, luas, asteroides e o que o céu aprontou."},{"id":"games","nome":"Games","simbolo":"Ga","z":31,"massa":"69,723","elemento_nome":"Gálio","elemento":"Ga, gálio (31): derrete a 29,8 °C, ou seja, na palma da mão.","descricao":"Lançamentos, notas, polêmicas e o que vem por aí."},{"id":"tecnologia","nome":"Tecnologia","simbolo":"Tc","z":43,"massa":"(98)","elemento_nome":"Tecnécio","elemento":"Tc, tecnécio (43): o primeiro elemento produzido artificialmente, em 1937.","descricao":"IA, chips, hardware e as big techs."},{"id":"misterios","nome":"Mistérios","simbolo":"Xe","z":54,"massa":"131,29","elemento_nome":"Xenônio","elemento":"Xe, xenônio (54): vem do grego xénos, 'estranho'. Nada mais justo.","descricao":"OVNIs, arquivos secretos e teorias, com a teoria e o que se sabe lado a lado."},{"id":"rock","nome":"Rock","simbolo":"Rn","z":86,"massa":"(222)","elemento_nome":"Radônio","elemento":"Rn, radônio (86): gás nobre radioativo que escapa das rochas. Rock, sacou?","descricao":"Discos, turnês, shows e o que rolou no rock."},{"id":"brasil","nome":"Brasil","simbolo":"Br","z":35,"massa":"79,904","elemento_nome":"Bromo","elemento":"Br, bromo (35): um dos dois únicos elementos líquidos em temperatura ambiente.","descricao":"O que mudou por aqui."},{"id":"mundo","nome":"Mundo","simbolo":"Mo","z":42,"massa":"95,95","elemento_nome":"Molibdênio","elemento":"Mo, molibdênio (42): a resposta para a vida, o universo e tudo mais.","descricao":"Os fatos grandes lá fora."}],"itens":[{"id":"morre-george-whitesides","categoria":"quimica","data":"2026-11-20","simbolo":"Wh","titulo":"Morre George Whitesides, gigante da química de superfícies, aos 87 anos","resumo":"George M. Whitesides, um dos químicos mais influentes e mais citados da era moderna, morreu em 19 de novembro, aos 87 anos. Foram mais de quatro décadas pesquisando, dando aula e orientando em Harvard, com impacto em química de materiais e de superfícies, síntese orgânica, nanotecnologia e diagnósticos de baixo custo. Também cofundou várias startups. Entre os prêmios: Priestley Medal, National Medal of Science e Kavli Prize em nanociência.","angulo_quimico":"É a linhagem de onde saíram ferramentas que viraram rotina de laboratório, como a litografia macia em PDMS, as monocamadas automontadas (SAMs) de tióis sobre ouro e a microfluídica em papel para diagnóstico barato.","relevancia":4,"fontes":[{"nome":"C&EN (ACS)","url":"https://cen.acs.org/people/obituaries/george-whitesides-materials-chemist-nanoscientist/104/web/2026/11"}],"nome":"Whitesides","imagem":{"credito":"Douglas A. Lockard","licenca":"CC BY-SA 3.0","fonte":"https://commons.wikimedia.org/wiki/File:George_Whitesides_HD2010_podium.JPG","legenda":"George Whitesides em palestra, em 2010 (foto de arquivo)","arquivo":"img/morre-george-whitesides.webp","largura":960,"altura":640}},{"id":"oxoboranos-estaveis","categoria":"quimica","data":"2026-11-06","simbolo":"Ob","titulo":"Depois de 60 anos de tentativas, químicos isolam oxoboranos estáveis com tripla B≡O","resumo":"O grupo de Holger Braunschweig (Universidade de Würzburg) publicou na Nature Chemistry a síntese e o isolamento de três oxoboranos estáveis, moléculas com ligação tripla boro–oxigênio. Químicos correm atrás delas desde o começo dos anos 1960, e até agora elas só tinham sido detectadas ou capturadas em condições extremas, ou deduzidas por evidência indireta. Veio meio sem querer: dois doutorandos, cada um estudando uma reação diferente, viram aparecer sólidos laranja e amarelos.","angulo_quimico":"A rota é diboracumuleno + cetonas comuns, com o oxoborano saindo como produto principal. É o mesmo laboratório que fez a primeira tripla B≡B (2012) e a primeira tripla B≡C neutra (2025). Os cálculos são do grupo de Ashwini Phukan (Tezpur, Índia).","relevancia":5,"fontes":[{"nome":"ScienceDaily","url":"https://www.sciencedaily.com/releases/2026/11/261103003205.htm"}],"nome":"Tripla B≡O"},{"id":"tecido-molecular-benzeno-ciclohexano","categoria":"quimica","data":"2026-11-12","simbolo":"Tx","titulo":"Tecido molecular, com Stoddart como coautor póstumo, separa benzeno de ciclohexano","resumo":"Times da UT Austin (Jonathan Sessler) e da Universidade de Zhejiang (Feihe Huang e Guangfeng Li) publicaram na Nature um 'tecido molecularmente tecido' 2D triaxial. São quatro redes moleculares que se entrelaçam por cima e por baixo, automontadas, em camadas quirais empilhadas com orientação alternada. Sir Fraser Stoddart, Nobel de 2016, é coautor, mas morreu antes de o estudo ser concluído. O material funciona como filtro reutilizável para uma das separações mais chatas da indústria.","angulo_quimico":"Benzeno (Teb 80,1 °C) e ciclohexano (80,7 °C) quase não se separam por destilação sem aditivos. Numa mistura 50/50, o tecido absorveu 97,9% do benzeno. Basta aquecer para o benzeno vaporizar, e o tecido pode ser usado de novo. Zhejiang diz já ter testado o material em escala industrial.","relevancia":5,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-reusable-molecular-fabric-energy-industrial.html"}],"nome":"Tecido molecular","imagem":{"credito":"Haltopub","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Benzene_geometrie.svg","legenda":"Estrutura da molécula de benzeno (ilustração)","arquivo":"img/tecido-molecular-benzeno-ciclohexano.webp","largura":960,"altura":960}},{"id":"membrana-pan-fraciona-petroleo","categoria":"quimica","data":"2026-11-05","simbolo":"Mb","titulo":"Membrana que 'entope' do jeito certo fraciona petróleo cru em temperatura ambiente","resumo":"KAIST e Georgia Tech publicaram na Nature uma membrana de poliacrilonitrila (PAN) mesoporosa, sem revestimento, que fraciona petróleo cru real (fornecido pela HD Hyundai Oilbank) em temperatura ambiente. A destilação convencional esquenta o cru acima de 350 °C. A membrana rodou 28 dias seguidos, com permeação cerca de 23 vezes maior que a das melhores membranas anteriores para cru. Simulações de processo, ainda sem teste em refinaria, apontam cerca de 31,6% menos energia, 37,6% menos CO2 e 36% menos custo operacional.","angulo_quimico":"O truque é o próprio fouling. Hidrocarbonetos pesados se acumulam nas paredes dos poros e estreitam os canais para menos de 2 nm, formando uma peneira que deixa passar nafta, gasolina e querosene e segura os pesados. Para comparar, a destilação de cru no mundo gasta cerca de 1.100 TWh por ano.","relevancia":5,"fontes":[{"nome":"ScienceDaily","url":"https://www.sciencedaily.com/releases/2026/11/261103003207.htm"}],"nome":"Membrana x petróleo","imagem":{"credito":"Carlos Valenzuela","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Distillation_towers_tulap4.jpg","legenda":"Torres de destilação de refinaria no México (imagem ilustrativa)","arquivo":"img/membrana-pan-fraciona-petroleo.webp","largura":960,"altura":579}},{"id":"braskem-crise-3t26","categoria":"quimica","data":"2026-11-13","simbolo":"Bm","titulo":"Braskem: prejuízo de R$ 1,1 bi, calote em debêntures e corrida contra o prazo dos credores","resumo":"A Braskem está em recuperação extrajudicial desde agosto, com cerca de US$ 10,9 bi de dívida em reestruturação. No 3º trimestre de 2026, teve prejuízo de cerca de R$ 1,1 bilhão, e o Ebitda recorrente caiu 63%, para R$ 1,96 bi. A empresa não pagou juros e amortização da 18ª emissão de debêntures (cerca de R$ 1,2 bi), que venciam em 9/11, e a B3 classificou os papéis como inadimplentes. Petrobras e IG4 propõem um aporte de cerca de US$ 5 bi e os credores, de US$ 4 bi. O prazo citado para fechar acordo era 22/11, e a recuperação judicial está no radar se não houver consenso.","angulo_quimico":"É ciclo petroquímico na veia. O spread do polietileno americano sobre a nafta caiu 57% do 2º para o 3º trimestre, e o preço médio das resinas vendidas no Brasil caiu 42%. No 2º trimestre a empresa tinha lucrado R$ 3,3 bi com margens infladas pelo conflito no Oriente Médio e por Ormuz. Agora a diretoria prevê 2027 abaixo da média histórica, por causa da sobrecapacidade asiática, e estuda fechar plantas menos rentáveis.","relevancia":4,"fontes":[{"nome":"Jornal do Comércio","url":"https://www.jornaldocomercio.com/economia/2026/11/1270435-braskem-ve-margens-menores-em-2027-e-segue-engajada-em-acordo-com-credores-diz-diretoria.html"},{"nome":"Status Invest","url":"https://statusinvest.com.br/noticias/braskem-brkm5-b3-debentures-impagas/amp/"},{"nome":"InvestNews","url":"https://investnews.com.br/negocios/braskem-deixa-de-pagar-debentures-de-r-12-bilhao-e-cita-recuperacao-extrajudicial/amp/"}],"nome":"Crise Braskem","imagem":{"credito":"Sofiamay","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:1490070601917_160114_BRASKEM_CAMPO_BOM_36.jpg","legenda":"Unidade da Braskem em Campo Bom (RS), em foto de arquivo","arquivo":"img/braskem-crise-3t26.webp","largura":960,"altura":640}},{"id":"h2o2-sem-metal-precioso","categoria":"quimica","data":"2026-11-19","simbolo":"Hp","titulo":"H2O2 sem metal precioso: catalisador orgânico passa de 99% de eficiência faradaica","resumo":"Químicos da Rutgers–Newark e da Universidade de Bonn publicaram na Nature Communications um eletrocatalisador molecular puramente orgânico, baseado em moléculas CpN3 ricas em nitrogênio. Ele reduz O2 a H2O2 usando corrente elétrica e uma fonte de prótons, sem metal precioso e sem H2 gasoso. Mais de 99% da carga aplicada vira produto, com frequências de turnover muito altas. Ainda faltam estabilidade, escalonamento e operação em água.","angulo_quimico":"O mecanismo é de 'radical rebound': um H sai de uma ligação C–H fraca do ligante e forma HO2•, que se religa ao catalisador antes de liberar H2O2. Até agora esse caminho tinha sido visto basicamente em complexos de metais de transição. A comparação óbvia é com o processo da antraquinona, que depende de H2 e paládio.","relevancia":4,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-qa-hydrogen-peroxide-precious-metals.html"},{"nome":"C&EN (ACS)","url":"https://cen.acs.org/synthesis/catalysis/metal-free-electrocatalyst-hydrogen-peroxide/104/web/2026/11"}],"nome":"H₂O₂ sem Pd","imagem":{"credito":"Niklaus Yager","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Hydrogen_Peroxide_Tank_Car.jpg","legenda":"Vagão-tanque para transporte de peróxido de hidrogênio (foto de arquivo)","arquivo":"img/h2o2-sem-metal-precioso.webp","largura":960,"altura":540}},{"id":"rutenio-1nm-amonia","categoria":"quimica","data":"2026-11-18","simbolo":"Ru","titulo":"Rutênio de 1 nm acelera a síntese de amônia em até 57 vezes","resumo":"Um time do KAIST liderado por Minkee Choi mostrou no JACS que reduzir nanopartículas de Ru promovidas com BaO de 10 nm para 1 nm aumenta a produção de NH3 em até 57 vezes, com a mesma massa de rutênio. Não é só ganho de área: cada sítio do catalisador de 1 nm foi 4,4 vezes mais ativo. O alvo é a amônia como vetor de hidrogênio e combustível sem carbono, gastando menos metal raro.","angulo_quimico":"O título do paper resume bem: 'Beyond Geometric Effects'. Em partículas menores, os elétrons passam do BaO para a superfície do Ru com mais eficiência, e essa densidade eletrônica extra facilita quebrar a tripla N≡N, que é a etapa difícil da síntese.","relevancia":4,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-ruthenium-catalysts-boosts-ammonia-production.html"}],"nome":"Ru de 1 nm","imagem":{"credito":"Dietmar Rabich","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Karlsruhe,_Hochdruckreaktor_zur_Ammoniak-Synthese_--_2013_--_5282.jpg","legenda":"Antigo reator de alta pressão para síntese de amônia, em Karlsruhe","arquivo":"img/rutenio-1nm-amonia.webp","largura":640,"altura":960}},{"id":"fenazinas-hidrogenacao-interface","categoria":"quimica","data":"2026-11-17","simbolo":"Fz","titulo":"Moléculas de bateria de fluxo fazem hidrogenação sem H2 na interface óleo-água","resumo":"Em Harvard, os grupos de Richard Liu e Michael Aziz publicaram na Nature Catalysis um jeito de hidrogenar sem H2 gasoso e sem metal. Fenazinas solúveis em água, criadas para baterias de fluxo, são carregadas eletroquimicamente com prótons e elétrons e bombeadas para um reator bifásico. Lá elas reduzem grupos nitro a aminas primárias na fase orgânica. Em fluxo contínuo, o rendimento chegou a 91%, e a spinoff Adiabatic Materials já trabalha na comercialização.","angulo_quimico":"A transferência é por PCET na interface, com próton e elétron acoplados na etapa determinante. A velocidade depende de quanto a fenazina adsorve na interface, e não do poder redutor dela. A fenazina fica na água e o produto na fase orgânica, o que simplifica a separação. O método também preserva duplas, triplas e anéis halogenados, que catalisadores tradicionais costumam atacar.","relevancia":4,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-repurposed-battery-molecules-key-chemical.html"}],"nome":"Hidrogenação sem H₂","imagem":{"credito":"Simonhackett","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Redflow_ZBM2_zinc-bromine_flow_batteries_in_a_performance_testing_lab.jpg","legenda":"Baterias de fluxo de zinco-bromo em teste de laboratório (foto de arquivo)","arquivo":"img/fenazinas-hidrogenacao-interface.webp","largura":960,"altura":720}},{"id":"mofs-co2-umido-so2f2","categoria":"quimica","data":"2026-11-17","simbolo":"Mf","titulo":"Semana dos MOFs: um captura CO2 em gás úmido, outro transforma SO2F2 em sólido","resumo":"Na Oregon State, o grupo de Kyriakos Stylianou, com Berkeley e o centro de P&D da Aramco, publicou na Angewandte o BVR-X. É um MOF redox-ativo que continua capturando CO2 de uma corrente muito úmida com só 4% de CO2, ao longo de dezenas de ciclos, sem perder desempenho. Na mesma semana, a C&EN (19/11) mostrou um MOF que sequestra fluoreto de sulfurila, transformando um gás tóxico num reagente sólido para click chemistry e para fazer candidatos a fármacos covalentes.","angulo_quimico":"A água costuma ser o calcanhar de aquiles dos adsorventes de CO2, porque compete pelos mesmos sítios. No BVR-X, os poros separam CO2 e H2O em compartimentos diferentes, e o material se ajusta à presença de água, o que dispensa secar o gás. No caso do SO2F2, o ganho é dosar com segurança o reagente da química SuFEx.","relevancia":4,"fontes":[{"nome":"ScienceDaily","url":"https://www.sciencedaily.com/releases/2026/11/261116023405.htm"},{"nome":"C&EN (ACS)","url":"https://cen.acs.org/materials/metal-organic-frameworks/mof-sequesters-sulfuryl-fluoride-safer/104/web/2026/11"}],"nome":"MOFs"},{"id":"cutinase-liquido-ionico-pet","categoria":"quimica","data":"2026-11-10","simbolo":"Pe","titulo":"Enzima 'blindada' em líquido iônico despolimeriza PET cerca de 10 vezes mais rápido","resumo":"King's College London e Rutgers (ACS Sustainable Chem. Eng.) modificaram quimicamente a superfície de uma cutinase natural para ela aguentar calor e um líquido iônico que afrouxa o empacotamento das cadeias de PET. A velocidade de quebra das ligações subiu 9,2 vezes, com cerca de 10 vezes menos enzima, e a taxa ficou estável por 7 dias. A enzima sem modificação, em água, perde boa parte da atividade em cerca de 36 h. Funcionou em flocos de garrafa usada sem pré-tratamento e entregou ácido tereftálico puro.","angulo_quimico":"97,1% do líquido iônico foi recuperado para reuso. O gargalo é que a enzima perde atividade nessa recuperação. Os autores estimam que, com enzimas engenheiradas de ponta, a despolimerização quase completa cairia de cerca de 2 dias para cerca de 5 h, mas isso ainda não foi testado.","relevancia":4,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-approach-boosts-plastic-enzyme-tenfold.html"}],"nome":"Enzima x PET","imagem":{"credito":"Grendelkhan","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Bales_of_PET_bottles_closeup.jpg","legenda":"Fardo de garrafas PET prensadas em usina de reciclagem (foto de arquivo)","arquivo":"img/cutinase-liquido-ionico-pet.webp","largura":960,"altura":720}},{"id":"pfas-lignina-e-esponjas","categoria":"quimica","data":"2026-11-20","simbolo":"Pf","titulo":"PFAS: lignina pode substituir revestimento 'eterno', e as 'esponjas' duram menos","resumo":"Foram duas notícias no mesmo dia. A C&EN reportou nanopartículas biodegradáveis de lignina com ácido esteárico que dão acabamento hidrofóbico e podem substituir certos revestimentos com PFAS. E um estudo da Universidade de Maryland (Environmental Science & Technology) indicou que o carvão ativado coloidal injetado no subsolo para imobilizar PFAS pode segurar os compostos por menos de 20 anos, e não pelos até 100 anos que alguns estimavam. O motivo é o 'envelhecimento biológico' do adsorvente.","angulo_quimico":"Adsorção imobiliza o PFAS mas não quebra a ligação C–F, então quando o sorvente envelhece o contaminante volta a migrar. A alternativa bioinspirada troca a cadeia fluorada por hidrofobicidade de cadeia C18 (ácido esteárico) combinada à lignina, sem nenhum flúor.","relevancia":4,"fontes":[{"nome":"C&EN (ACS)","url":"https://cen.acs.org/materials/biobased-materials/pfas-coatings-biodegradable-nanoparticles-lignin-stearic-acid/104/web/2026/11"},{"nome":"Phys.org","url":"https://phys.org/news/2026-11-chemicals-dont.html"}],"nome":"PFAS","imagem":{"credito":"real name: Karol Głąb pl.wiki: Karol007 commons: Karol007 e-mail: kamikaze007 (at) tlen.pl","licenca":"CC BY-SA 3.0","fonte":"https://commons.wikimedia.org/wiki/File:Lignin_structure.svg","legenda":"Estrutura química da lignina (esquema)","arquivo":"img/pfas-lignina-e-esponjas.webp","largura":960,"altura":928}},{"id":"baterias-b12-zinco-ar-cloro","categoria":"quimica","data":"2026-11-18","simbolo":"Bt","titulo":"Baterias: vitamina B12 em zinco-ar e cloro armazenando carga no cátodo","resumo":"A Universidade de Córdoba (J. Mater. Chem. A) fez o eletrodo de ar de uma bateria zinco-ar recarregável com vitamina B12 ancorada em nanotubos de carbono de parede simples, e o protótipo aguentou até 250 ciclos. Em Taiwan, o grupo de Ru-Shi Liu (revista Small) mostrou o cloro participando do redox no cátodo de cloreto Li2FeCl4, numa célula totalmente de estado sólido. No lado do mercado, a C&EN destacou um acordo de US$ 1 bilhão da Sila como sinal de fôlego para anodos de silício, mesmo com o carro elétrico crescendo menos.","angulo_quimico":"Na B12, o centro de Co(III) é bifuncional: catalisa a redução de O2 (ORR) na descarga e a evolução de O2 (OER) na recarga. No Li2FeCl4, com eletrólito Li3InCl6, aparecem duas etapas de oxidação. Perto de 3,8 V ocorre Fe2+/Fe3+, e perto de 4,2 V vs Li+/Li orbitais não ligantes do Cl entram na compensação de carga. Essa etapa do cloro é só parcialmente reversível, e não dá para descartar liberação de Cl2.","relevancia":4,"fontes":[{"nome":"ScienceDaily","url":"https://www.sciencedaily.com/releases/2026/11/261117033909.htm"},{"nome":"Phys.org","url":"https://phys.org/news/2026-11-role-chlorine-uncovering-anion-redox.html"},{"nome":"C&EN (ACS)","url":"https://cen.acs.org/energy/energy-storage/sila-nanotechnologies-panasonic-energy-silicon-anode-battery/104/web/2026/11"}],"nome":"Baterias","imagem":{"credito":"Preston MacDougall","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:B12_zoom.jpg","legenda":"Densidade eletrônica da molécula de vitamina B12 (cianocobalamina)","arquivo":"img/baterias-b12-zinco-ar-cloro.webp","largura":960,"altura":946}},{"id":"basf-desiste-evonik","categoria":"quimica","data":"2026-11-18","simbolo":"Ev","titulo":"BASF desiste de comprar a Evonik depois de duas ofertas recusadas","resumo":"A BASF encerrou a tentativa de comprar a Evonik depois que a diretoria da rival recusou duas ofertas não vinculantes, ambas em dinheiro. A última foi de € 24 por ação, cerca de € 11,2 bi em valor de equity. A BASF disse que as perspectivas e os riscos da Evonik não justificavam pagar mais e que, na estratégia dela, aquisições são um 'pode fazer', não um 'precisa fazer'. O governo da Renânia do Norte-Vestfália, onde a Evonik tem cerca de 11 mil funcionários, era contra o negócio.","angulo_quimico":"Tem um detalhe de engenharia de processo na mesma semana: a Evonik reportou corte de 6% no consumo de vapor em plantas químicas usando IA para otimizar a operação (C&EN, 20/11). A própria empresa admite que a economia total ainda é incerta.","relevancia":4,"fontes":[{"nome":"BASF","url":"https://www.basf.com/global/en/media/news-releases/2026/11/p-26-202"},{"nome":"CHEManager","url":"https://chemanager-online.com/en/news/basf-backtracks-no-takeover-of-evonik"},{"nome":"C&EN (ACS)","url":"https://cen.acs.org/business/petrochemicals/evonik-ai-energy-consumption-chemical-plants-germany-belgium/104/web/2026/11"}],"nome":"BASF x Evonik","imagem":{"credito":"Felix König","licenca":"CC BY 3.0","fonte":"https://commons.wikimedia.org/wiki/File:BASF_Ludwigshafen_part.jpg","legenda":"Parte do complexo da BASF em Ludwigshafen, na Alemanha (foto de arquivo)","arquivo":"img/basf-desiste-evonik.webp","largura":960,"altura":960}},{"id":"isomorphic-labs-5-bilhoes","categoria":"quimica","data":"2026-11-17","simbolo":"Ia","titulo":"Isomorphic Labs, da DeepMind, levanta US$ 5 bi para desenhar fármacos com IA","resumo":"A spinout da Google DeepMind comandada por Demis Hassabis fechou em 17/11 uma Série C de US$ 5 bilhões, liderada por Greenoaks e Sequoia. Foi poucos meses depois de uma rodada de US$ 2,1 bi em maio, e o total captado desde 2021 passa de US$ 7,7 bi. O dinheiro vai para os modelos fundacionais de simulação, para o pipeline próprio e com parceiros (J&J, Novartis, Eli Lilly) e para infraestrutura. Mas nenhum candidato entrou em ensaio clínico até agora.","angulo_quimico":"A plataforma, chamada IsoDDE, prevê estruturas 3D de proteínas e interações fármaco–alvo. A empresa fala em 'resultados pré-clínicos positivos' em oncologia e imunologia, mas não divulgou dado clínico nem números de economia de tempo ou custo. Por enquanto, a promessa ainda está na frente da química medicinal.","relevancia":4,"fontes":[{"nome":"pharmaphorum","url":"https://pharmaphorum.com/news/isomorphic-labs-raises-5bn-massive-third-round"},{"nome":"C&EN (ACS)","url":"https://cen.acs.org/business/investment/isomorphic-labs-ai-drug-discovery/104/web/2026/11"}],"nome":"Isomorphic Labs"},{"id":"levedura-etanol-de-milho","categoria":"quimica","data":"2026-11-18","simbolo":"Et","titulo":"Levedura brasileira feita para etanol de milho vai para escala piloto","resumo":"A startup Bioinfood, de Campinas, apoiada pela FAPESP (PIPE) e com um projeto de R$ 8 milhões aprovado pela Finep, desenvolveu uma cepa 100% brasileira de Saccharomyces cerevisiae para etanol de milho. A meta é tirar mais etanol da mesma quantidade de grão, e a cepa agora sai do laboratório para a escala piloto. O momento ajuda: o milho já responde por 10,17 bi de litros, pouco mais de 27% dos 37,5 bi de litros de etanol da safra 2025/26. A gasolina está em E32 desde agosto, e os testes de E35 começam em janeiro de 2027.","angulo_quimico":"Uma única usina grande consome até 50 toneladas de levedura por mês. O próximo passo é uma cepa que fermente em temperatura um pouco mais alta, para economizar no resfriamento das dornas.","relevancia":3,"fontes":[{"nome":"Agência FAPESP","url":"https://agencia.fapesp.br/brazilian-startup-develops-yeast-for-corn-based-ethanol-and-prepares-for-pilot-scale-production/59625"},{"nome":"Movimento Econômico","url":"https://movimentoeconomico.com.br/economia/combustivel/2026/10/27/testes-da-gasolina-com-35-de-etanol-ficam-para-2027-e-portaria-sai-ate-novembro/"}],"nome":"Levedura de etanol"},{"id":"sirius-perovskita-in-situ","categoria":"quimica","data":"2026-11-04","simbolo":"Sx","titulo":"Sirius ganha porta-amostra para ver célula de perovskita funcionando","resumo":"O LNLS/CNPEM, em Campinas, abriu a pesquisadores de fora um porta-amostra in situ na estação Tarumã da linha Carnaúba do Sirius. Com ele dá para fazer nanoscopia de raios X em células solares completas enquanto elas operam, com luz, temperatura e atmosfera controladas. O alvo principal são as perovskitas, mas o sistema também serve para células orgânicas, de pontos quânticos e LEDs. O trabalho saiu na Photon Science, com Rodrigo Szostak como primeiro autor.","angulo_quimico":"O feixe de cerca de 200 nm combina difração, fluorescência e absorção de raios X. Na demonstração, a equipe mapeou a distribuição de iodo e chumbo, resolveu grãos de perovskita de cerca de 2 µm e viu a rede expandir entre 40 e 65 °C. A temperatura vai de 30 a 150 °C, com flutuação abaixo de 0,1 °C.","relevancia":3,"fontes":[{"nome":"Agência FAPESP","url":"https://agencia.fapesp.br/a-new-instrument-at-brazils-sirius-accelerator-enables-researchers-to-observe-solar-cells-in-operation/59529"}],"nome":"Sirius","imagem":{"credito":"Prefeitura Campinas","licenca":"Public domain","fonte":"https://commons.wikimedia.org/wiki/File:Sirius_Campinas.jpg","legenda":"Vista do Sirius, acelerador de partículas do CNPEM, em Campinas","arquivo":"img/sirius-perovskita-in-situ.webp","largura":960,"altura":596}},{"id":"chama-hidrogenio-laranja-sodio","categoria":"quimica","data":"2026-11-19","simbolo":"Na","titulo":"Curiosidade: por que a chama de hidrogênio às vezes fica laranja (culpa do sal marinho)","resumo":"Pesquisadores da Adelaide University e da UNSW (revista Next Energy) mostraram que o tom laranja da chama de hidrogênio em fogões depende do sódio presente no ar, e o sal marinho trazido pelo vento é uma fonte importante. Em duas semanas, com o queimador sempre na mesma regulagem, o sinal ligado ao sódio variou mais de 28 vezes. Sem sódio, a chama fica quase invisível e emite menos luz que a de gás natural, o que é um problema de segurança para casas abastecidas com H2.","angulo_quimico":"É o velho teste de chama do sódio decidindo se você enxerga o fogo ou não. O ar que passou sobre o oceano deixava a chama mais laranja. Os autores recomendam detectores UV/IR e sensores de temperatura em vez de confiar na cor.","relevancia":3,"fontes":[{"nome":"ScienceDaily","url":"https://www.sciencedaily.com/releases/2026/11/261118065509.htm"}],"nome":"Chama laranja","imagem":{"credito":"Nefronus","licenca":"CC BY-SA 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Sodium_flame_color.jpg","legenda":"Chama que fica amarelo-alaranjada por causa do sódio do sal (foto de arquivo)","arquivo":"img/chama-hidrogenio-laranja-sodio.webp","largura":720,"altura":960}},{"id":"carbono-hexacoordenado-ouro","categoria":"quimica","data":"2026-11-17","simbolo":"Au","titulo":"Curiosidade: carbono com seis vizinhos de ouro, e como a ligação deixa de ser 'normal'","resumo":"Um estudo no JACS Au, do Institute for Molecular Science, da Tokyo University of Science e da Universidade de Fuzhou, usou DFT e AdNDP para entender clusters de ouro(I) centrados em carbono. Neles o C central se liga a 4, 5 ou 6 átomos de Au, contra os 4 vizinhos do metano. O trabalho mostra como a ligação passa de localizada a deslocalizada conforme entram mais átomos de ouro, e como os ligantes (NHC ou PPh3) mudam a simetria e a quiralidade do núcleo.","angulo_quimico":"No CAu4 há quatro ligações 2c-2e clássicas. No CAu6, o carbono faz três ligações deslocalizadas 3c-2e, cada par de elétrons dividido num Au–C–Au, e o CAu5 fica no meio do caminho. Ligantes volumosos distorcem o núcleo: um CAu6 assimétrico saiu 7,5 kcal/mol mais estável que o simétrico. O primeiro cluster hexaouro centrado em carbono foi descrito em 1988.","relevancia":3,"fontes":[{"nome":"Phys.org","url":"https://phys.org/news/2026-11-unraveling-bonding-evolution-carbon-centered.html"}],"nome":"Carbono + 6 Au"},{"id":"bepicolombo-orbita-mercurio","categoria":"espaco","data":"2026-11-21","simbolo":"Bc","corpo":"Mercúrio","titulo":"BepiColombo finalmente entra na órbita de Mercúrio","resumo":"Depois de quase oito anos de viagem e nove sobrevoos (1 da Terra, 2 de Vênus e 6 do próprio Mercúrio), a missão conjunta ESA/JAXA entrou em órbita de Mercúrio no dia 21, ainda com os dois orbitadores (o europeu MPO e o japonês Mio) acoplados, numa órbita elíptica. A queima de inserção estava prevista para durar uns 37 minutos. É só a segunda nave a orbitar Mercúrio, depois da MESSENGER da NASA (2011–2015). Em 9–10 de dezembro o MPO e o Mio se separam, e a ciência começa pra valer em abril de 2027.","angulo_quimico":"O MPO vai medir a composição e a temperatura da superfície e estudar a exosfera (a 'atmosfera' finíssima de Mercúrio) e sua interação com o plasma solar, além de investigar o enorme núcleo de ferro do planeta.","relevancia":5,"fontes":[{"nome":"Space.com","url":"https://www.space.com/space-exploration/missions/esa-jaxa-bepicolomobo-mission-mercury-orbit-arrival"},{"nome":"AeroTime","url":"https://www.aerotime.aero/articles/bepicolombo-reaches-mercury-orbit-after-nearly-eight-years-in-space"},{"nome":"Eos","url":"https://eos.org/research-and-developments/bepicolombo-arrives-at-mercury"}],"nome":"Bepi em Mercúrio","imagem":{"credito":"NASA / GSFC","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/GSFC_20171208_Archive_e001918","legenda":"Mercúrio visto pela sonda MESSENGER, da NASA, em 2011 (arquivo)","arquivo":"img/bepicolombo-orbita-mercurio.webp","largura":956,"altura":960}},{"id":"hera-chega-didymos","categoria":"espaco","data":"2026-11-04","simbolo":"He","corpo":"Didymos","titulo":"Hera chega ao asteroide que a NASA atropelou de propósito","resumo":"A sonda europeia de defesa planetária chegou ao sistema binário Didymos–Dimorphos no dia 4, cerca de um mês antes do previsto. É a 'perícia' do impacto da DART em 2022, que encurtou a órbita de Dimorphos em 33 minutos. As primeiras imagens mostram Didymos cheio de pedregulhos e crateras, com uma crista no equador surpreendentemente afiada; Dimorphos ainda aparece quase todo escondido na sombra do irmão maior. A Hera agora faz 'órbitas retangulares' a 25–30 km, a uns 12 cm/s, chega mais perto em dezembro e, no começo de 2027, solta dois CubeSats — um deles, o Juventas, vai tentar pousar em Dimorphos.","angulo_quimico":"Os CubeSats levam radar e instrumentos espectrais para estudar superfície e interior dos asteroides, e a câmera térmica (fornecida pela JAXA) deve mostrar se Didymos é rocha sólida ou um amontoado poroso, já que rocha sólida libera calor mais devagar.","relevancia":5,"fontes":[{"nome":"Smithsonian Magazine","url":"https://www.smithsonianmag.com/smart-news/europes-hera-spacecraft-has-begun-its-close-up-investigation-of-the-asteroid-system-nasa-intentionally-hit-in-2022-180989871/"},{"nome":"ESA","url":"https://www.esa.int/articles/hera-spacecraft-in-rectangular-orbit-around-target-asteroids"},{"nome":"Space.com","url":"https://www.space.com/space-exploration/asteroid-comet-missions/dimorphos-in-sight-europes-hera-probe-gets-its-1st-look-at-battered-space-rock-photo"}],"nome":"Hera em Didymos","imagem":{"credito":"NASA / JPL / NASA/Johns Hopkins APL/Steve Gribben","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA25329","legenda":"O sistema Didymos visto pela sonda DART, da NASA, em 2022","arquivo":"img/hera-chega-didymos.webp","largura":960,"altura":540}},{"id":"voyager1-um-dia-luz","categoria":"espaco","data":"2026-11-18","simbolo":"Vg","titulo":"Voyager 1 chega a um dia-luz da Terra — e fica muda bem na hora","resumo":"No dia 18, às 7h16 de Brasília, a Voyager 1 virou o primeiro objeto feito por humanos a 1 dia-luz da Terra: uns 25,9 bilhões de km. Agora um comando leva 24 horas pra chegar e mais 24 pra resposta voltar. O plot twist: desde o dia 14 a sonda manda só o sinal portador, sem dados científicos nem de engenharia, e a NASA suspeita do computador de bordo que junta e formata os dados. Foi justamente esse sinal 'vazio', somado aos cálculos de trajetória, que permitiu confirmar o marco; a equipe diz estar confiante de que os dados voltam.","angulo_quimico":"A sonda vive de três geradores termoelétricos de radioisótopos (RTGs), alimentados pelo calor do decaimento do plutônio-238, hoje a cerca de dois terços da potência original. Por isso a NASA vem desligando equipamentos, e o fim da missão é esperado nos anos 2030.","relevancia":5,"fontes":[{"nome":"Space.com","url":"https://space.com/space-exploration/voyager/1-light-day-from-earth-nasas-voyager-1-probe-hits-huge-milestone-in-interstellar-space"},{"nome":"IFLScience","url":"https://www.iflscience.com/as-voyager-1-hit-one-light-day-from-earth-it-stopped-sending-scientific-data-to-nasa-85232"},{"nome":"Popular Science","url":"https://www.popsci.com/science/voyager-1-one-light-day-away-from-earth-nasa-estimate/"}],"nome":"Voyager 1","imagem":{"credito":"NASA / JPL / NASA/JPL/Walt Feimer","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA04927","legenda":"Ilustração artística de uma sonda Voyager rumo ao espaço interestelar","arquivo":"img/voyager1-um-dia-luz.webp","largura":576,"altura":389}},{"id":"starship-voo15-captura-nave","categoria":"espaco","data":"2026-11-14","simbolo":"Sh","titulo":"SpaceX agarra a nave Starship com os braços da torre pela 1ª vez","resumo":"No voo 15, lançado no dia 13 de Starbase (Texas), a nave Ship 42 passou cerca de 22 horas em órbita, deu 14 voltas na Terra, soltou 26 satélites Starlink V3 e, no dia 14, voltou ao local de lançamento pra ser agarrada pela torre 'Mechazilla'. É a primeira vez que o estágio superior é recuperado inteiro depois de um voo orbital, passo-chave para a reutilização total que a SpaceX promete. O booster Super Heavy, por outro lado, abortou a captura após um alerta de pouco combustível e caiu no Golfo do México.","relevancia":5,"fontes":[{"nome":"Spaceflight Now","url":"https://spaceflightnow.com/2026/11/13/live-coverage-starship-flight-15-attempts-to-recover-full-vehicle-in-double-launch-pad-catch/"},{"nome":"Interesting Engineering","url":"https://interestingengineering.com/space/spacex-starship-ship-42-first-upper-stage-catch"},{"nome":"Space.com","url":"https://www.space.com/space-exploration/launches-spacecraft/relive-starships-historic-flight-15-with-our-best-photos-from-launch-and-mechazilla-tower-catch"}],"nome":"Starship","imagem":{"credito":"Steve Jurvetson","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Starship_Booster_Return_on_Final_Approach_(54063904149).jpg","legenda":"Booster da Starship voltando à torre no voo 5, em 2024 (foto de arquivo)","arquivo":"img/starship-voo15-captura-nave.webp","largura":690,"altura":960}},{"id":"perseverance-odyssey-pane","categoria":"espaco","data":"2026-11-19","simbolo":"Pv","corpo":"Marte","titulo":"Pane dupla em Marte: Perseverance e Odyssey param a ciência","resumo":"Semanas depois de bater o recorde de distância rodada fora da Terra (passou dos 45,16 km da Opportunity em 11/10), o Perseverance perdeu o rádio UHF principal, entrou em modo de segurança e descobriu que o rádio reserva transmite com só metade da potência. Agora fala direto com a Terra pela antena de alto ganho, em taxa mais baixa, e a NASA espera retomar a ciência até o fim de novembro. Já a Odyssey, em órbita desde 2001 (a veterana de Marte), perdeu uma de suas rodas de reação; se ela não voltar, a sonda vai depender dos propulsores, e o combustível restante dura só um ou dois meses.","angulo_quimico":"A Odyssey fez os primeiros mapas globais da composição da superfície marciana e ajudou a localizar depósitos de gelo de água. E o 'relógio' dela agora é químico: depende da hidrazina que sobrou no tanque.","relevancia":4,"fontes":[{"nome":"Space.com","url":"https://www.space.com/astronomy/mars/trouble-at-mars-nasas-perseverance-rover-odyssey-orbiter-halt-science-work-due-to-glitches"}],"nome":"Pane em Marte","imagem":{"credito":"NASA / JPL / NASA/JPL-Caltech/MSSS","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA24542","legenda":"Autorretrato do rover Perseverance com o helicóptero Ingenuity, em 2021","arquivo":"img/perseverance-odyssey-pane.webp","largura":960,"altura":706}},{"id":"hayabusa2-muda-plano","categoria":"espaco","data":"2026-11-17","simbolo":"Hy","corpo":"Asteroide 2015 BM510","titulo":"Hayabusa2 perde o último motor iônico e desiste de pousar em asteroide","resumo":"A sonda japonesa que trouxe amostras do asteroide Ryugu em 2020 teve pane no último dos seus quatro propulsores iônicos em agosto, e um sensor ainda detectou erosão inesperada na superfície da nave. No dia 17 a JAXA anunciou: acabou o plano de encontrar e pousar no minúsculo 1998 KY26 (uns 11 m) em 2031. No lugar, ela fará um sobrevoo rápido do asteroide 2015 BM510 em abril de 2028, sem pouso. Em julho ela ainda tinha passado pelo asteroide de 'duas cabeças' Torifune.","angulo_quimico":"O 2015 BM510 é um asteroide do tipo D, considerado rico em compostos orgânicos e parecido com cometas — um alvo interessante mesmo só de passagem.","relevancia":4,"fontes":[{"nome":"Space.com","url":"https://www.space.com/space-exploration/asteroid-comet-missions/no-more-asteroid-landing-engine-trouble-forces-japans-hayabusa2-probe-to-change-plans"}],"nome":"Hayabusa2","imagem":{"credito":"DLR German Aerospace Center","licenca":"CC BY 2.0","fonte":"https://commons.wikimedia.org/wiki/File:Hayabusa2_approaching_asteroid.jpg","legenda":"Ilustração da sonda Hayabusa2, da JAXA, perto do asteroide Ryugu","arquivo":"img/hayabusa2-muda-plano.webp","largura":960,"altura":540}},{"id":"marte-vulcao-alba-mons","categoria":"espaco","data":"2026-11-04","simbolo":"Am","corpo":"Marte","titulo":"Marte não morreu: o vulcão Alba Mons ainda solta gás","resumo":"Estudo publicado no dia 4 na Science Advances, com dados do orbitador europeu ExoMars TGO, detectou cloreto de hidrogênio saindo de fissuras recentes nos flancos do Alba Mons, o maior vulcão de Marte em área. Os picos aparecem no começo do verão, quando o gás nem deveria estar lá — a hipótese é que ele se acumula sob o gelo no inverno e escapa quando o gelo sublima. Para os autores, os vulcões marcianos estão dormentes, não extintos, e pode haver uma câmara magmática adormecida lá embaixo.","angulo_quimico":"A evidência é química: HCl é um gás de origem vulcânica, e flagrá-lo vazando de fissuras frescas, com variação sazonal, é o que sustenta a ideia de que Marte ainda guarda calor interno.","relevancia":4,"fontes":[{"nome":"Space.com","url":"https://www.space.com/astronomy/mars/mars-isnt-dead-recent-volcanic-activity-reveals-its-just-sleeping"}],"nome":"Vulcão marciano","imagem":{"credito":"NASA / JPL / NASA/JPL-Caltech/ASU","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA18126","legenda":"Fluxos de lava na região de Alba Mons, em Marte, vistos por sonda da NASA","arquivo":"img/marte-vulcao-alba-mons.webp","largura":475,"altura":960}},{"id":"nasa-psra-amostras-marte","categoria":"espaco","data":"2026-11-09","simbolo":"Sr","corpo":"Marte","titulo":"NASA recomeça do zero o plano de trazer as amostras de Marte","resumo":"No dia 9, a diretora do Programa de Exploração de Marte, Tiffany Morgan, apresentou a PSRA (Perseverance Sample Retrieval Architecture), novo esforço para ressuscitar o enrolado Mars Sample Return. Uma revisão anterior chegou a estimar uns US$ 11 bilhões com as amostras voltando só em 2040, caro e lento demais. A equipe começa em janeiro de 2027 e entrega o relatório no inverno 2027–28. Enquanto isso, a China planeja lançar a Tianwen-3 por volta de 2028 e trazer cerca de 500 g de Marte em 2031.","angulo_quimico":"Um dos argumentos para estudar as amostras antes de mandar gente é química pura: o solo marciano tem compostos perigosos como percloratos e clorometanos, risco para astronautas e equipamentos.","relevancia":3,"fontes":[{"nome":"Space.com","url":"https://www.space.com/astronomy/mars/nasa-kick-starts-a-fresh-push-to-bring-mars-samples-home"}],"imagem":{"credito":"NASA / JPL / NASA/ESA/JPL-Caltech","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA25326","legenda":"Ilustração de um conceito do plano de retorno de amostras de Marte","arquivo":"img/nasa-psra-amostras-marte.webp","largura":960,"altura":540}},{"id":"escapade-estilingue-terra","categoria":"espaco","data":"2026-11-09","simbolo":"Ec","corpo":"Marte","titulo":"Sondas gêmeas ESCAPADE dão estilingue inédito na Terra rumo a Marte","resumo":"As duas sondas da NASA fizeram sobrevoos propulsados da Terra nos dias 7 e 9, a primeira vez que a agência usa essa manobra para mandar uma nave a Marte. Elas perderam a janela de lançamento de 2024 por atrasos do foguete New Glenn e ficaram numa órbita de 'espera' em formato de feijão até voltar à Terra agora. Chegada prevista em setembro de 2027, para estudar o ambiente magnético de Marte, gerado pela interação de partículas solares com a atmosfera e por regiões magnetizadas da crosta.","relevancia":3,"fontes":[{"nome":"Space.com","url":"https://www.space.com/astronomy/mars/nasas-escapade-twin-mars-probes-execute-a-1st-of-its-kind-gravity-slingshot-around-earth"}],"imagem":{"credito":"NASA / KSC / NASA/Kim Shiflett","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/KSC-20240822-PH-KLS01_0030","legenda":"Uma das sondas ESCAPADE, da NASA, antes do lançamento, em 2024","arquivo":"img/escapade-estilingue-terra.webp","largura":640,"altura":960}},{"id":"minilua-2026-qq8","categoria":"espaco","data":"2026-10-29","simbolo":"Qq","corpo":"Terra","titulo":"A Terra ganhou uma 'minilua' de 2 metros (por pouco tempo)","resumo":"O Minor Planet Center anunciou no dia 29 o objeto 2026 QQ8, uma rocha de uns 2 metros que foi capturada pela gravidade da Terra em abril e só foi avistada em agosto. Ela fica por aqui até dezembro e deve escapar no começo de 2027. Miniluas assim são sempre temporárias: a estadia média é de uns nove meses.","relevancia":3,"fontes":[{"nome":"Space.com","url":"https://www.space.com/astronomy/earth/earth-has-captured-a-new-mini-moon-but-it-wont-stick-around-for-long"}],"imagem":{"credito":"NASA / JPL / NASA/JPL-Caltech","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA25251","legenda":"Radar mostra outro asteroide próximo da Terra (2022), só para ilustrar","arquivo":"img/minilua-2026-qq8.webp","largura":960,"altura":688}},{"id":"urano-campo-magnetico","categoria":"espaco","data":"2026-11-03","simbolo":"Ur","corpo":"Urano","titulo":"Por que o campo magnético de Urano é tão torto? Talvez agora a gente saiba","resumo":"A Voyager 2 mostrou nos anos 80 que os campos de Urano e Netuno são bizarros: o de Urano é inclinado uns 59° em relação ao eixo de rotação e deslocado do centro do planeta (o da Terra tem uns 11°). Simulações lideradas por Chi Yan (Universidade do Texas), publicadas na Communications Physics, reproduziram esses campos tortos com um dínamo num 'oceano' de voláteis que fica mais condutor quanto mais fundo. Bônus: o campo pode mudar bastante em poucas décadas, algo que dá pra testar com auroras observadas pelo James Webb e com a futura missão a Urano.","angulo_quimico":"O fluido do dínamo seria uma mistura de água, amônia, metano, hidrogênio e hélio; sob pressão e temperatura extremas, as moléculas de água se quebram em íons e o material vira condutor elétrico.","relevancia":3,"fontes":[{"nome":"Space.com","url":"https://www.space.com/astronomy/uranus/scientists-may-finally-understand-the-weird-magnetic-fields-of-uranus-and-neptune"}],"imagem":{"credito":"NASA / JPL / NASA/JPL-Caltech","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA18182","legenda":"Urano visto pela sonda Voyager 2, da NASA, em 1986","arquivo":"img/urano-campo-magnetico.webp","largura":960,"altura":960}},{"id":"cometa-220p-explosao","categoria":"espaco","data":"2026-11-03","simbolo":"Mc","corpo":"Cometa 220P/McNaught","titulo":"Gás preso rasgou um cometa e o deixou milhares de vezes mais brilhante","resumo":"Estudo publicado no dia 3 na Monthly Notices of the Royal Astronomical Society explica os surtos do cometa 220P/McNaught em 2026: perto do periélio, em junho, ele pulou da magnitude +17,4 para +8,2 em poucos dias (deu pra ver de binóculo em céu escuro) e teve outro surto entre julho e agosto. O modelo, liderado por Josep M. Trigo-Rodríguez (Espanha), mostra que gelos aquecidos sob a superfície viram gás, a pressão rasga a crosta e uma nuvem de poeira enche a coma, refletindo a luz do Sol.","angulo_quimico":"Os gelos envolvidos são de água, dióxido de carbono e nitrogênio: ao sublimarem sob a crosta, geram a pressão que 'estoura' o cometa e lança poeira de cerca de 1 micrômetro a uns 390 m/s.","relevancia":3,"fontes":[{"nome":"Space.com","url":"https://www.space.com/astronomy/comets/how-escaping-gases-ripped-apart-a-comet-and-caused-it-to-become-thousands-of-times-brighter"}],"imagem":{"credito":"NASA / JPL / NASA/JPL/Caltech/Ames Research Center/University of Arizona","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA04943","legenda":"Outro cometa de explosões, o Schwassmann-Wachmann 1, visto pela NASA em 2003","arquivo":"img/cometa-220p-explosao.webp","largura":658,"altura":430}},{"id":"cometas-ingredientes-vida","categoria":"espaco","data":"2026-10-28","simbolo":"Hc","corpo":"Terra","titulo":"Cometas trouxeram os ingredientes da vida? Provavelmente não","resumo":"Simulações publicadas no dia 28 na Scientific Reports, lideradas por Richard Anslow (Cambridge), acompanharam cometas da origem até a entrada na atmosfera e o impacto. Conclusão: moléculas orgânicas só sobrevivem a impactos abaixo de uns 15 km/s, e cometas costumam chegar rápidos e inclinados demais, vaporizando quase tudo. A entrega cometária de ingredientes prebióticos seria, no máximo, um 'acaso raro'; em Marte as chances seriam um pouco melhores, pela atmosfera fina e gravidade menor.","angulo_quimico":"O estudo usou o cianeto de hidrogênio (HCN), muito comum em cometas e detectado até no cometa interestelar 3I/ATLAS, como representante das moléculas orgânicas complexas.","relevancia":3,"fontes":[{"nome":"Space.com","url":"https://www.space.com/astronomy/comets/did-comets-bring-building-blocks-of-life-to-earth-scientists-arent-so-sure-anymore"}],"imagem":{"credito":"NASA / JPL / Copyright: ESA/Rosetta/Philae/CIVA","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA18826","legenda":"O cometa 67P visto pela sonda Rosetta, da ESA, em 2014","arquivo":"img/cometas-ingredientes-vida.webp","largura":960,"altura":960}},{"id":"euclid-primeiro-cometa","categoria":"espaco","data":"2026-11-16","simbolo":"Eu","corpo":"Cometa C/2026 S1 (Euclid)","titulo":"Telescópio de matéria escura acha um cometa sem querer","resumo":"O Euclid, da ESA, foi feito pra mapear matéria e energia escuras, mas Mikko Pöntinen, da Universidade de Helsinque, achou nas imagens de setembro o 'risco' de um objeto rápido envolto numa nuvem difusa: um cometa ativo e inédito, batizado C/2026 S1 (Euclid). Ele estava a cerca de 1,3 bilhão de km, entre as órbitas de Júpiter e Saturno. A descoberta foi destaque no dia 16.","relevancia":2,"fontes":[{"nome":"Space.com","url":"https://www.space.com/astronomy/comets/euclid-discovers-its-1st-comet-space-photo-of-the-day-for-nov-16-2026"}],"imagem":{"credito":"European Space Agency","licenca":"CC BY-SA 3.0 igo","fonte":"https://commons.wikimedia.org/wiki/File:Euclid_spacecraft_ESA24912474.jpg","legenda":"Ilustração do telescópio espacial Euclid, da ESA","arquivo":"img/euclid-primeiro-cometa.webp","largura":960,"altura":540}},{"id":"nasa-base-lunar-promise","categoria":"espaco","data":"2026-11-07","simbolo":"Pr","corpo":"Lua","titulo":"NASA abre a carteira para a base lunar — e encomenda um rover nuclear","resumo":"No evento 'Max Power', no Centro Espacial Kennedy, a NASA anunciou no dia 7 o CLPS 2: um contrato-quadro de 10 anos que pode chegar a US$ 10 bilhões, com oito empresas (entre elas SpaceX, Blue Origin, Firefly e Intuitive Machines) disputando entregas na Lua. A meta é ter uma base para astronautas até 2032. A estrela do pacote é o PROMISE, um rover autônomo movido a energia nuclear, baseado no projeto do Curiosity/Perseverance, que deve começar a explorar o polo sul lunar no fim de 2028, levado pelo módulo Blue Moon da Blue Origin.","angulo_quimico":"O PROMISE leva broca e instrumentos para procurar voláteis e gelo de água no polo sul, recurso essencial para uma base permanente.","relevancia":4,"fontes":[{"nome":"Space.com","url":"https://www.space.com/space-exploration/artemis/nasa-unveils-usd10-billion-in-moon-base-contracts-new-lunar-missions-and-the-promise-of-a-nuclear-powered-rover"}],"nome":"Base lunar","imagem":{"credito":"NASA / GRC / NASA/GRC/Sara Lowthian-Hanna","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/GRC-2023-C-10425","legenda":"Conceito de energia nuclear para a superfície da Lua (ilustração da NASA)","arquivo":"img/nasa-base-lunar-promise.webp","largura":960,"altura":640}},{"id":"china-roteiro-lua-2030","categoria":"espaco","data":"2026-11-01","simbolo":"Ly","corpo":"Lua","titulo":"China detalha o roteiro para pôr astronautas na Lua antes de 2030","resumo":"No 7º Simpósio de Voos Tripulados, em Pequim (31/10 e 1/11), a China apresentou quatro etapas: teste da cápsula Mengzhou em órbita baixa com o foguete Long March 10A em 2027, voo do módulo lunar Lanyue em 2028, ensaio de acoplamento em órbita lunar em 2029 e, antes de 2030, o pouso tripulado — segundo o CNSpaceflight, três astronautas lançados e dois na superfície por três dias. Do lado americano, a Artemis III (teste em órbita da Terra) está prevista para meados de 2027 e o pouso da Artemis IV para o início de 2028. A corrida tá apertada.","relevancia":4,"fontes":[{"nome":"Space.com","url":"https://www.space.com/astronomy/moon/china-lays-out-plans-to-land-astronauts-on-the-moon-before-2030-can-nasa-still-win-this-race"}],"nome":"China na Lua","imagem":{"credito":"NASA / JSC","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/as8-14-2392","legenda":"A Terra nascendo sobre a Lua, foto da Apollo 8 em 1968 (arquivo)","arquivo":"img/china-roteiro-lua-2030.webp","largura":956,"altura":960}},{"id":"conjuncao-jupiter-marte","categoria":"espaco","data":"2026-11-15","simbolo":"Jm","corpo":"Júpiter","titulo":"Júpiter e Marte quase se encostaram no céu","resumo":"Na madrugada de 15 para 16/11, Júpiter e Marte ficaram a pouco mais de 1° um do outro na constelação de Leão, com a estrela Regulus logo abaixo — tudo visível a olho nu antes do amanhecer. Um encontro tão apertado entre os dois só se repete em julho de 2029. Marte continua pertinho de Regulus até o fim do mês.","relevancia":3,"fontes":[{"nome":"Space.com","url":"https://www.space.com/stargazing/see-jupiter-and-mars-make-a-spectacular-close-approach-overnight-nov-15-16"},{"nome":"Astronomy","url":"https://www.astronomy.com/observing/sky-this-month-november-2026/"}],"imagem":{"credito":"NASA / JPL / mage data: NASA/JPL-Caltech/SwRI/MSSS Image processing by Kevin M. Gill © CC BY","licenca":"Domínio público (NASA)","fonte":"https://images.nasa.gov/details/PIA25013","legenda":"Júpiter visto pela sonda Juno, da NASA, em 2022","arquivo":"img/conjuncao-jupiter-marte.webp","largura":960,"altura":540}},{"id":"leonidas-2026","categoria":"espaco","data":"2026-11-17","simbolo":"Le","corpo":"Cometa 55P/Tempel-Tuttle","titulo":"Leônidas: a chuva de meteoros que você perdeu (sem grandes dramas)","resumo":"O pico foi na noite de 17 para 18/11, com estimativa de até 15 meteoros por hora em céu perfeito (a NASA falava em menos de 3). A Lua crescente se pôs antes da madrugada e deixou o céu escuro. As Leônidas são poeira do cometa 55P/Tempel-Tuttle, que dá a volta no Sol a cada ~33 anos. Consolo: não havia previsão de tempestade de meteoros este ano.","relevancia":2,"fontes":[{"nome":"Space.com","url":"https://www.space.com/stargazing/meteor-showers/the-leonid-meteor-shower-peaks-nov-17-18-heres-what-you-need-to-know"},{"nome":"ScienceDaily","url":"https://www.sciencedaily.com/releases/2026/11/261105224547.htm"}],"imagem":{"credito":"NOIRLab/NSF/AURA","licenca":"CC BY 4.0","fonte":"https://commons.wikimedia.org/wiki/File:Four_views_of_the_Leonid_meteor_shower_of_1966_Noao-4127A.jpg","legenda":"Quatro vistas da tempestade de Leônidas de 1966 (foto de arquivo)","arquivo":"img/leonidas-2026.webp","largura":960,"altura":848}},{"id":"gta-vi-chegou","categoria":"games","data":"2026-11-19","simbolo":"Gt","titulo":"GTA VI finalmente saiu, e a crítica deu praticamente nota máxima","resumo":"Depois de 13 anos e dois adiamentos, GTA VI saiu em 19/11 para PS5 e Xbox Series X|S, com Jason e Lucia no estado fictício de Leonida (sim, Vice City está de volta). Fechou com 99 no Metacritic com base em mais de 150 análises, e o IGN
